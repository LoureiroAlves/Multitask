<html lang="pt">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão do negócio</title>
<meta name="theme-color" content="#3a2c18">
<!-- Ecrã cheio quando associado ao ecrã principal (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@600;800&family=Playfair+Display:wght@700;800&family=Quicksand:wght@600;700&family=Montserrat:wght@700;800&family=Bebas+Neue&family=Lobster&family=Pacifico&family=Baloo+2:wght@700;800&family=Chewy&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-reservas-180.png">
<link rel="icon" type="image/png" href="icon-reservas-192.png">
<style>
  :root{ --castanho:#3a2c18; --dourado:#a8712f; --dourado-escuro:#6b4a1f; --bege:#f5efe2; --bege-claro:#fbf8f2; --linha:#e3d9c4; --verde:#2e9b57; --vermelho:#c0392b; --azul:#2a5aa8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bege-claro); color:var(--castanho); }
  header.top{ background:linear-gradient(135deg,#6a4e26,#38290f); color:#fff; padding:calc(16px + env(safe-area-inset-top)) 20px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:0 0 20px 20px; box-shadow:0 6px 22px rgba(58,44,24,.22); }
  header.top h1{ font-size:1.2rem; margin:0; font-weight:800; }
  header.top button{ background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:9px; padding:9px 13px; cursor:pointer; font-size:.82rem; font-weight:700; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px; }
  .card{ background:#fff; border:1px solid var(--linha); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 6px 22px rgba(74,56,32,.09); }
  input{ width:100%; padding:10px 12px; border:1.5px solid var(--linha); border-radius:9px; font-family:inherit; font-size:.95rem; margin-bottom:9px; }
  label{ font-size:.82rem; font-weight:600; color:var(--dourado-escuro); display:block; margin:6px 0 4px; }
  button.acao{ background:var(--dourado); color:#fff; border:none; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; }
  .msg{ font-size:.85rem; margin-top:8px; } .msg.erro{ color:var(--vermelho); }
  .hide{ display:none; }

  /* Barra do mês */
  .mes-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .mes-bar button{ background:#fff; border:1px solid var(--linha); border-radius:12px; width:42px; height:42px; font-size:1.2rem; cursor:pointer; color:var(--castanho); box-shadow:0 2px 6px rgba(74,56,32,.06); }
  .mes-bar .mes-nome{ font-weight:800; font-size:1.12rem; text-transform:capitalize; }

  /* Grelha do calendário */
  .cal{ background:#fff; border:1px solid var(--linha); border-radius:18px; padding:12px; box-shadow:0 6px 22px rgba(74,56,32,.09); }
  .cal-cab, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cab{ margin-bottom:6px; }
  .cal-cab div{ text-align:center; font-size:.74rem; font-weight:800; color:#fff; padding:6px 0; border-radius:8px; letter-spacing:.3px; }
  .cal-cab div:nth-child(1){ background:#2a5aa8; }   /* Seg */
  .cal-cab div:nth-child(2){ background:#2e9b57; }   /* Ter */
  .cal-cab div:nth-child(3){ background:#c9971c; }   /* Qua */
  .cal-cab div:nth-child(4){ background:#8e5bd0; }   /* Qui */
  .cal-cab div:nth-child(5){ background:#e0662a; }   /* Sex */
  .cal-cab div:nth-child(6){ background:#c8702f; }   /* Sáb */
  .cal-cab div:nth-child(7){ background:#c0392b; }   /* Dom */
  .dia{ position:relative; aspect-ratio:1/1; border:1.5px solid transparent; border-radius:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.95rem; cursor:default; background:#fbf6ec; transition:transform .06s ease; }
  .dia.vazio{ background:transparent; }
  .dia.fds{ background:#fbeee1; }                                  /* fim de semana */
  .dia.fds .num{ color:#b0532e; }
  .dia.futuro{ background:#eef2fb; }                               /* dias que ainda vêm (tom azulado) */
  .dia.tem{ cursor:pointer; }
  .dia.tem:active{ transform:scale(.95); }
  .dia.tem-pend{ background:#fdf1d2; border-color:#eccd7d; }       /* dia com pendentes */
  .dia.tem-conf{ background:#e2f4e9; border-color:#93d4ac; }       /* dia com confirmadas */
  .dia.passado{ background:#ececea; border-color:transparent; }    /* dias que já passaram (cinzento) */
  .dia.passado .num{ color:#b3ada1; }
  .dia.passado .bar i{ opacity:.35; }
  .dia.passado .promo-tag{ opacity:.4; }
  .dia.hoje{ box-shadow:0 0 0 3px var(--dourado) inset; background:#fdf2d6; }   /* HOJE em destaque */
  .dia.hoje .num{ color:var(--dourado-escuro); font-weight:800; }
  .dia.sel{ background:linear-gradient(145deg,#4a3820,#2f2410); color:#fff; border-color:#2f2410; box-shadow:0 6px 16px rgba(58,44,24,.32); transform:translateY(-1px); }
  .dia.sel .num{ color:#fff; }
  .dia .num{ line-height:1; font-weight:700; }
  .dia .bar{ display:flex; gap:3px; margin-top:5px; height:5px; }
  .dia .bar i{ width:13px; height:5px; border-radius:3px; display:block; }
  .bar i.pend{ background:var(--dourado); }
  .bar i.conf{ background:var(--verde); }
  .dia.sel .bar i.pend{ background:#f2c879; } .dia.sel .bar i.conf{ background:#7ed3a1; }
  .dia .cnt{ position:absolute; top:4px; right:7px; font-size:.6rem; font-weight:800; color:#a86b2c; }
  .dia.tem-conf .cnt{ color:#2e9b57; }
  .dia .promo-tag{ position:absolute; top:4px; left:6px; font-size:.6rem; line-height:1; }
  .dia .fer-tag{ position:absolute; top:3px; right:6px; font-size:.62rem; line-height:1; color:#c0392b; }
  .dia.sel .fer-tag{ color:#ffcf9e; }
  .dia.feriado .num{ text-decoration:underline; text-decoration-color:#c0392b; text-underline-offset:2px; }
  .dia.fechado{ background:repeating-linear-gradient(45deg,#f4dedb,#f4dedb 5px,#fbeeec 5px,#fbeeec 10px); border-color:#e6b7af; }
  .dia.fechado .num{ color:#b23; }
  .dia .fechado-tag{ position:absolute; bottom:3px; right:5px; font-size:.6rem; line-height:1; }
  .dia.sel .cnt{ color:#f0d9b0; }

  .legenda{ display:flex; gap:14px; justify-content:center; margin:14px 0 0; font-size:.76rem; color:#8a7a5c; }
  .legenda span{ display:inline-flex; align-items:center; gap:6px; }
  .legenda i{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  /* Detalhe do dia */
  .dia-tit{ font-weight:800; font-size:1.05rem; text-transform:capitalize; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .dia-tit .chip{ font-size:.68rem; font-weight:800; color:#fff; border-radius:8px; padding:3px 9px; text-transform:uppercase; letter-spacing:.3px; }
  .r{ border:1px solid var(--linha); border-left:5px solid var(--linha); border-radius:14px; padding:13px 14px; margin-bottom:11px; }
  .r.confirmada{ border-left-color:var(--verde); }
  .r.pendente{ border-left-color:var(--dourado); }
  .r.cancelada{ border-left-color:var(--vermelho); opacity:.6; }
  .r-top{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
  .r-quando{ font-weight:800; font-size:1.15rem; }
  .r-nome{ font-size:.95rem; margin-top:5px; font-weight:600; }
  .r-meta{ font-size:.83rem; color:#8a7a5c; margin-top:3px; }
  .r-menu{ font-size:.85rem; color:var(--dourado-escuro); margin-top:6px; font-weight:600; background:#faf4e8; border-radius:8px; padding:6px 9px; }
  .r-acoes{ display:flex; gap:7px; flex-wrap:wrap; margin-top:11px; }
  .r-acoes button, .r-acoes a button{ border:1px solid var(--linha); background:#fff; border-radius:9px; padding:8px 12px; cursor:pointer; font-size:.82rem; font-weight:700; }
  .r-acoes button.ok{ color:#fff; background:var(--verde); border-color:var(--verde); }
  .r-acoes button.no{ color:var(--vermelho); border-color:#e8c4bf; }
  .r-acoes button.wa{ color:#fff; background:#25d366; border-color:#25d366; }
  .r-acoes button.edit{ color:var(--dourado-escuro); border-color:#e7d8b4; }
  .r-acoes button.del{ color:#8a7a5c; border-color:var(--linha); }
  .pill{ font-size:.68rem; font-weight:800; padding:4px 11px; border-radius:30px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.pendente{ background:#fbeecb; color:#8a5a10; }
  .pill.confirmada{ background:#e2f4e9; color:#1e6b3c; }
  .pill.cancelada{ background:#fbe7e4; color:var(--vermelho); }
  /* Separadores Calendário / Painel */
  .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#efe4cf; padding:5px; border-radius:14px; margin-bottom:16px; }
  .tab{ white-space:nowrap; padding:12px 10px; border:none; background:transparent; border-radius:10px; font-weight:800; cursor:pointer; color:#9a7f4f; font-size:.9rem; transition:.15s; }
  .tab.ativo{ background:#fff; color:var(--castanho); box-shadow:0 2px 8px rgba(74,56,32,.12); }
  /* Painel (dashboard) */
  .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px; }
  .kpi{ border:1px solid var(--linha); border-radius:16px; padding:15px; background:#fff; box-shadow:0 6px 22px rgba(74,56,32,.07); }
  .kpi .ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; margin-bottom:9px; background:#f2ead9; }
  .kpi .n{ font-size:1.8rem; font-weight:800; line-height:1; }
  .kpi .l{ font-size:.76rem; color:#8a7a5c; font-weight:700; margin-top:5px; }
  .kpi-cap{ font-size:1rem; color:#8a7a5c; font-weight:700; }
  .kpi.full{ grid-column:1 / -1; }
  .kpi.a{ background:#eef4fc; border-color:#cfe0f4; } .kpi.a .ic{ background:#d5e5f7; } .kpi.a .n{ color:#2a5aa8; }
  .kpi.c{ background:#fdf6e3; border-color:#eeddb0; } .kpi.c .ic{ background:#f7e6bd; } .kpi.c .n{ color:var(--dourado-escuro); }
  .kpi.b{ background:#eafaf0; border-color:#bfe6cd; } .kpi.b .ic{ background:#cfeeda; } .kpi.b .n{ color:var(--verde); }
  .dash-sec{ margin-bottom:18px; }
  .dash-sec h3{ font-size:.95rem; margin:0 0 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .linha-r{ display:flex; align-items:center; gap:12px; border:1px solid var(--linha); border-radius:14px; padding:11px 13px; margin-bottom:9px; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(74,56,32,.05); }
  .linha-r:hover{ filter:brightness(.985); }
  .linha-r .datebox{ width:50px; text-align:center; border-radius:11px; padding:7px 0; color:#fff; flex-shrink:0; }
  .linha-r .datebox .dia-n{ font-size:1.15rem; font-weight:800; line-height:1; }
  .linha-r .datebox .mes-n{ font-size:.6rem; text-transform:uppercase; letter-spacing:.5px; opacity:.92; margin-top:2px; }
  .db-1{ background:#2a5aa8; } .db-2{ background:#2e9b57; } .db-3{ background:#c9971c; } .db-4{ background:#8e5bd0; } .db-5{ background:#e0662a; } .db-6{ background:#c8702f; } .db-0{ background:#c0392b; }
  .linha-r .info{ flex:1; min-width:0; }
  .linha-r .quem{ font-weight:700; font-size:.9rem; }
  .linha-r .quando{ font-size:.8rem; color:#8a7a5c; margin-top:2px; }
  .linha-r.cancelada{ opacity:.55; }
  .dot{ font-size:.66rem; font-weight:800; padding:4px 10px; border-radius:20px; flex-shrink:0; text-transform:uppercase; letter-spacing:.3px; }
  .dot.confirmada{ background:#e2f4e9; color:#1e6b3c; } .dot.pendente{ background:#fbeecb; color:#8a5a10; } .dot.cancelada{ background:#fbe7e4; color:var(--vermelho); }
  .vazio-msg{ color:#8a7a5c; font-size:.9rem; }
  .pdf-btn{ width:100%; margin-top:12px; background:#fff; border:1.5px solid var(--linha); border-radius:12px; padding:12px; font-weight:800; color:var(--dourado-escuro); cursor:pointer; font-size:.9rem; box-shadow:0 2px 8px rgba(74,56,32,.06); }
  .pdf-btn:disabled{ opacity:.6; }
  /* Definições de reservas */
  .def-h{ font-weight:800; font-size:1.1rem; margin-bottom:4px; }
  .subt{ font-size:.82rem; color:#8a7a5c; margin-bottom:14px; }
  .subt2{ font-size:.76rem; color:#8a7a5c; margin:2px 0 6px; }
  .sw{ display:flex; align-items:center; gap:9px; font-size:.9rem; margin:14px 0 4px; font-weight:700; color:var(--castanho); }
  .sw input{ width:auto; margin:0; }
  .dias-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px; }
  .dia-chip{ display:flex; align-items:center; gap:5px; background:var(--bege-claro); border:1.5px solid var(--linha); border-radius:10px; padding:8px 11px; font-size:.85rem; cursor:pointer; font-weight:700; }
  .dia-chip input{ width:auto; margin:0; }
  .dia-chip.hd-on{ background:#e2f4e9; border-color:#93d4ac; font-weight:800; }
  .dia-chip.hd-sel{ outline:2px solid var(--dourado); }
  .hd-painel{ border:1px solid var(--linha); border-radius:12px; padding:12px; margin:8px 0 4px; background:#fffdf8; }
  .hd-tit{ font-size:.84rem; font-weight:800; margin-bottom:8px; }
  .hd-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .hd-chip{ display:inline-flex; align-items:center; gap:5px; background:#fff; border:1.5px solid var(--linha); border-radius:9px; padding:7px 10px; font-size:.85rem; cursor:pointer; font-weight:700; }
  .hd-chip input{ width:auto; margin:0; }
  .lin{ display:flex; gap:10px; align-items:start; } .lin > div{ flex:1; }
  .lin input{ min-height:46px; box-sizing:border-box; }
  .mesa-row{ display:flex; align-items:center; gap:7px; font-size:.82rem; color:#5a4c39; margin-bottom:8px; }
  .mesa-row input{ margin:0; }
  .fecho-row{ display:flex; align-items:center; gap:7px; margin-bottom:8px; }
  .fecho-row input{ margin:0; flex:1; min-width:0; }
  .fecho-row span{ font-size:.82rem; color:#8a7a5c; }
  .mini-btn{ background:var(--castanho); color:#fff; border:none; border-radius:9px; padding:9px 13px; cursor:pointer; font-size:.85rem; font-weight:700; margin-top:2px; }
  .mrem{ background:#fbe7e4; color:var(--vermelho); border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-weight:800; flex-shrink:0; }
  .wa-dest{ background:#eafaf0; border:1.5px solid #b7e6c8; border-radius:14px; padding:14px; margin-bottom:6px; }
  .wa-tit{ font-weight:800; font-size:1rem; color:#1e6b3c; }
  .wa-sub{ font-size:.8rem; color:#4a7a5c; margin:3px 0 10px; }
  .wa-dest input{ margin-bottom:6px; background:#fff; }
  .wa-nota{ font-size:.74rem; color:#6a8a76; }
  .av-btn{ width:100%; margin-top:14px; background:var(--bege-claro); border:1px solid var(--linha); border-radius:10px; padding:11px; font-weight:700; color:var(--dourado-escuro); cursor:pointer; font-size:.88rem; }
  /* Pop-up de edição */
  .modal-bg{ position:fixed; inset:0; background:rgba(45,33,17,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:60; }
  .modal-bg.hide{ display:none; }
  .modal{ background:#fff; border-radius:16px; padding:18px 18px 16px; width:100%; max-width:420px; max-height:90vh; overflow:auto; box-shadow:0 14px 44px rgba(0,0,0,.28); }
  .modal h3{ margin:0 0 12px; font-size:1.05rem; }
  .modal .fechar{ float:right; border:none; background:none; font-size:1.25rem; cursor:pointer; color:#8a7a5c; line-height:1; padding:0; }
  /* Pop-up de aprovação */
  .ap-tag{ font-size:.78rem; font-weight:800; color:var(--dourado-escuro); background:#fbeecb; display:inline-block; padding:5px 12px; border-radius:20px; }
  .ap-data{ font-size:1.25rem; font-weight:800; margin:12px 0 12px; text-transform:capitalize; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .ap-data .ap-wd{ font-size:.7rem; color:#fff; border-radius:8px; padding:3px 10px; text-transform:uppercase; letter-spacing:.4px; }
  .ap-card{ background:#faf4e8; border:1px solid var(--linha); border-radius:12px; padding:13px; }
  .ap-hora{ font-weight:800; font-size:1.1rem; }
  .ap-nome{ font-size:.95rem; margin-top:5px; font-weight:600; }
  .ap-meta{ font-size:.83rem; color:#8a7a5c; margin-top:3px; }
  .ap-menu{ font-size:.85rem; color:var(--dourado-escuro); margin-top:6px; font-weight:600; }
  .ap-estado{ font-size:.82rem; color:#8a7a5c; margin:12px 0; }
  .ap-acts{ display:flex; gap:9px; }
  .ap-acts button{ flex:1; border-radius:11px; padding:13px; font-weight:800; font-size:.95rem; cursor:pointer; border:1px solid var(--linha); background:#fff; }
  .ap-ok{ background:var(--verde) !important; color:#fff; border-color:var(--verde) !important; }
  .ap-no{ color:var(--vermelho); border-color:#e8c4bf !important; }
  .ap-ver{ width:100%; margin-top:9px; background:none; border:none; color:#8a7a5c; font-weight:700; font-size:.85rem; cursor:pointer; padding:6px; }
  /* Nova reserva manual */
  .dia:not(.vazio){ cursor:pointer; }
  .nova-btn{ width:100%; border:1.5px dashed var(--dourado); background:#fff; color:var(--dourado-escuro); border-radius:12px; padding:12px; cursor:pointer; font-weight:800; font-size:.92rem; margin-bottom:12px; }
  .nova-btn:hover{ background:#fffaf0; }
  .nova-form{ border:1px solid var(--linha); border-radius:12px; padding:14px; margin-bottom:14px; background:#fffdf8; }
  .nova-form label{ display:block; font-size:.76rem; color:#8a7a5c; font-weight:800; margin:9px 0 3px; }
  .nova-form input, .nova-form select, .nova-form textarea{ width:100%; padding:9px 10px; border:1.5px solid var(--linha); border-radius:8px; font-family:inherit; font-size:.9rem; box-sizing:border-box; background:#fff; }
  .nova-form .lin{ display:flex; gap:8px; align-items:start; } .nova-form .lin > div{ flex:1; }
  .nova-form .lin input{ min-height:46px; box-sizing:border-box; }
  .nova-form .acts{ display:flex; gap:8px; margin-top:13px; }
  .nova-form .acts button{ flex:1; border-radius:8px; padding:10px; cursor:pointer; font-weight:800; font-size:.88rem; border:1px solid var(--linha); background:#fff; }
  .nova-form .acts button.guardar{ background:var(--verde); color:#fff; border-color:var(--verde); }
  .promo-btn{ width:100%; border:1.5px dashed #e0245e; background:#fff; color:#c01e50; border-radius:12px; padding:12px; cursor:pointer; font-weight:800; font-size:.92rem; margin-bottom:12px; }
  .promo-btn:hover{ background:#fff5f8; }
</style>
</head>
<body>
<header class="top">
  <h1 id="topTit">Gestão</h1>
  <button class="hide" id="btnSair">Sair</button>
</header>
<div class="wrap">
  <div class="card" id="loginCard">
    <h2 style="margin:0 0 8px; font-size:1.05rem;">Entrar</h2>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="acao" id="btnEntrar">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="painel" class="hide">
    <div class="tabs">
      <button id="tabCal" class="tab ativo" type="button">📅 Calendário</button>
      <button id="tabDash" class="tab" type="button">📊 Painel</button>
      <button id="tabEnc" class="tab" type="button">🛍️ Encomendas</button>
      <button id="tabNotif" class="tab" type="button">🔔 Avisar</button>
      <button id="tabDef" class="tab" type="button">⚙️ Definições</button>
    </div>
    <div id="vistaCal">
      <div class="mes-bar">
        <button id="mesPrev" aria-label="Mês anterior">‹</button>
        <div class="mes-nome" id="mesNome"></div>
        <button id="mesNext" aria-label="Mês seguinte">›</button>

  function _pascoa(ano){
    const a=ano%19, b=Math.floor(ano/100), c=ano%100, d=Math.floor(b/4), e=b%4,

    return new Date(ano, mes-1, dia);

  // Apaga entradas de semanas anteriores, mas mantém sempre o dia mais recente (para "Copiar do último dia")
  function _purgaMapaAntigo(mapa, segunda){
    if(!mapa || typeof mapa!=='object') return false;
    var antigas=Object.keys(mapa).filter(function(k){ return k < segunda; }).sort();  // crescente
    if(!antigas.length) return false;
    var manter=antigas[antigas.length-1];   // o mais recente das anteriores fica como base para copiar
    var mudou=false;
    antigas.forEach(function(k){ if(k!==manter){ delete mapa[k]; mudou=true; } });
    return mudou;
  }

  const _beepEl = (function(){ try{ const a = new Audio(_BEEP_SRC); a.preload = 'auto'; return a; }catch(e){ return null; } })();
  function _beep(){ try{ if(!_encSomOn() || !_beepEl) return; _beepEl.muted = false; _beepEl.currentTime = 0; const p = _beepEl.play(); if(p && p.catch) p.catch(function(){}); }catch(e){} }
  // preparar/desbloquear o som no primeiro toque (regra dos navegadores), sem se ouvir
  function _prepararSom(){ try{ if(!_beepEl || _somPronto) return; _beepEl.muted = true; const p = _beepEl.play(); const fim = function(){ try{ _beepEl.pause(); _beepEl.currentTime = 0; _beepEl.muted = false; _somPronto = true; }catch(e){} }; if(p && p.then) p.then(fim).catch(function(){ try{ _beepEl.muted = false; }catch(e){} }); else fim(); }catch(e){} }
  document.addEventListener('pointerdown', _prepararSom);
  document.addEventListener('click', _prepararSom);
  async function renderEncomendas(silencioso){
    const v = $('vistaEncomendas');
    if(!silencioso) v.innerHTML = '<div class="msg">A carregar…</div>';
    const desde = new Date(); desde.setDate(desde.getDate() - 7);
    const { data, error } = await sb.from('encomendas').select('*').eq('negocio_id', negocio.id).gte('criado_em', desde.toISOString()).order('criado_em', { ascending:false });
    if(error){ if(!silencioso) v.innerHTML = '<div class="msg erro">Erro: ' + esc(error.message) + '</div>'; return; }
    const arr = data || [];
    const sig = JSON.stringify(arr.map(function(e){ return [e.id, e.estado]; }));
    if(silencioso && sig === _encSig) return;   // nada mudou → não re-desenha (evita piscar)
    _encSig = sig;
    // Som quando chega uma encomenda NOVA (id que ainda não tínhamos visto)
    const _ids = arr.map(function(e){ return String(e.id); });
    if(_encIdsVistos !== null){ let _nova = false; _ids.forEach(function(id){ if(!_encIdsVistos[id]) _nova = true; }); if(_nova) _beep(); }
    _encIdsVistos = {}; _ids.forEach(function(id){ _encIdsVistos[id] = 1; });
    const _somHdr = '<div style="display:flex; justify-content:flex-end; margin-bottom:8px;"><button id="encSomBtn" type="button" style="border:1px solid var(--linha); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; font-family:inherit; font-weight:700; font-size:.8rem; color:var(--castanho);">' + (_encSomOn() ? '🔔 Som ligado' : '🔕 Som desligado') + '</button></div>';
    function _wireSom(){ const b = document.getElementById('encSomBtn'); if(!b) return; b.onclick = function(){ const novo = _encSomOn() ? '0' : '1'; try{ localStorage.setItem('amesaEncSom', novo); }catch(e){} _somPronto = false; _prepararSom(); b.textContent = (novo === '1') ? '🔔 Som ligado' : '🔕 Som desligado'; if(novo === '1') setTimeout(_beep, 60); }; }
    if(!arr.length){ v.innerHTML = _somHdr + '<div class="card"><div style="color:#8a7a5c; font-size:.9rem;">Ainda não há encomendas (últimos 7 dias).</div></div>'; _wireSom(); return; }
    const _cartaEnc = function(e, cor){
      const dt = new Date(e.criado_em);
      const itens = Array.isArray(e.itens) ? e.itens : [];
      const linhas = itens.map(function(it){ return (it.qtd||1) + '× ' + esc(it.nome||''); }).join('<br>');
      const dia = String(dt.getDate()).padStart(2,'0') + '/' + String(dt.getMonth()+1).padStart(2,'0');
      const hh = String(dt.getHours()).padStart(2,'0') + ':' + String(dt.getMinutes()).padStart(2,'0');
      let acoes = '';
      if(e.estado !== 'confirmada' && e.estado !== 'pronta') acoes += '<button class="enc-a" data-a="confirmada" data-id="' + e.id + '" style="border:none; background:#e2f4e9; color:#1e6b3c; border-radius:8px; padding:7px 11px; cursor:pointer; font-family:inherit; font-weight:800; font-size:.82rem;">✔ Confirmar</button>';
      if(e.estado !== 'pronta' && e.estado !== 'cancelada') acoes += '<button class="enc-a" data-a="pronta" data-id="' + e.id + '" style="border:none; background:#ffe6c2; color:#8a4b10; border-radius:8px; padding:7px 11px; cursor:pointer; font-family:inherit; font-weight:800; font-size:.82rem;">🍳 Pronta</button>';
      if(e.estado !== 'cancelada') acoes += '<button class="enc-a" data-a="cancelada" data-id="' + e.id + '" style="border:none; background:#fbe7e4; color:#b23; border-radius:8px; padding:7px 11px; cursor:pointer; font-family:inherit; font-weight:800; font-size:.82rem;">✕ Cancelar</button>';
      acoes += '<button class="enc-del" data-id="' + e.id + '" style="border:1px solid #e8c4bf; color:var(--vermelho); background:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; font-family:inherit; font-weight:700; font-size:.82rem;">🗑</button>';
      return '<div class="card" style="margin-bottom:10px; border-left:5px solid ' + cor + ';">'
        + '<div style="font-weight:800; color:var(--castanho);">Encomenda nº ' + (e.numero != null ? e.numero : '—') + '</div>'
        + '<div style="font-size:.82rem; color:#8a7a5c; margin:2px 0 8px;">Recebida ' + dia + ' às ' + hh + (e.nome ? (' · ' + esc(e.nome)) : '') + (e.levantamento ? (' · 🕒 levantar às ' + esc(e.levantamento)) : '') + '</div>'
        + '<div style="font-size:.9rem; color:var(--castanho); line-height:1.5;">' + (linhas || '—') + '</div>'
        + (Number(e.total) > 0 ? ('<div style="margin-top:8px; font-weight:800; color:var(--castanho);">Total: ' + Number(e.total).toFixed(2).replace('.', ',') + '€</div>') : '')
        + '<div style="display:flex; gap:7px; flex-wrap:wrap; margin-top:10px;">' + acoes + '</div>'
        + '</div>';
    };
    const _grupos = [
      { est:'pendente',   nome:'🟡 A chegar',     cor:'#d9a521', bg:'#fbeecb', tc:'#8a5a10' },
      { est:'confirmada', nome:'🟢 Em andamento', cor:'#2e9e5b', bg:'#e2f4e9', tc:'#1e6b3c' },
      { est:'pronta',     nome:'🟠 Prontas',      cor:'#e08a2b', bg:'#ffe6c2', tc:'#8a4b10' },
      { est:'cancelada',  nome:'⚪ Canceladas',   cor:'#c9a9a0', bg:'#f6e9e6', tc:'#b23' }
    ];
    let html = _somHdr;
    _grupos.forEach(function(g){
      const doGrupo = arr.filter(function(e){ return (e.estado || 'pendente') === g.est; });
      if(!doGrupo.length) return;
      html += '<div style="margin:10px 2px 10px;"><span style="background:' + g.bg + '; color:' + g.tc + '; padding:6px 13px; border-radius:999px; font-weight:800; font-size:.9rem;">' + g.nome + ' · ' + doGrupo.length + '</span></div>';
      doGrupo.forEach(function(e){ html += _cartaEnc(e, g.cor); });
    });
    v.innerHTML = html;
    _wireSom();
    v.querySelectorAll('.enc-a').forEach(function(b){ b.onclick = function(){ _encSetEstado(b.dataset.id, b.dataset.a); }; });
    v.querySelectorAll('.enc-del').forEach(function(b){ b.onclick = async function(){ if(!(await window.__amConfirm('Confirmar',{texto:'Apagar esta encomenda da lista?', ok:'Sim', cancelar:'Não'}))) return; const { error } = await sb.from('encomendas').delete().eq('id', b.dataset.id); if(error){ alert('Erro: ' + error.message); return; } renderEncomendas(); }; });
  }

  function _cmpR(a,b){ return (a.data + (a.hora||'')).localeCompare(b.data + (b.hora||'')); }
  function _kpi(n, l, cls, icon){ return '<div class="kpi '+(cls||'')+'"><div class="ic">'+(icon||'')+'</div><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  function _linhaReserva(r){
    const d = new Date(r.data+'T00:00:00');
    const wd = d.getDay();
    const obs = (r.obs||'').toString().trim();
    const quando = esc(r.hora||'') + (obs ? ' · ' + esc(obs) : '');
    return '<div class="linha-r '+(r.estado||'')+'" data-id="'+r.id+'">'
      + '<div class="datebox db-'+wd+'"><div class="dia-n">'+d.getDate()+'</div><div class="mes-n">'+MESES[d.getMonth()].slice(0,3)+'</div></div>'
      + '<div class="info"><div class="quem">'+esc(r.nome||'')+' · '+(Number(r.pessoas)||1)+' pessoa(s)</div>'
      + '<div class="quando">'+quando+'</div></div>'
      + '<span class="dot '+(r.estado||'')+'">'+(r.estado||'')+'</span></div>';
  }
  function irParaDia(iso){
    const d = new Date(iso+'T00:00:00');
    vAno = d.getFullYear(); vMes = d.getMonth(); diaSel = iso;
    mostrarVista('cal');
    renderCal(); renderDia(iso);
    const det = $('detalhe'); if(det) det.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  function renderDashboard(){
    const dash = $('vistaDash');
    const hojeIso = isoLocal(hoje);
    const ativas = reservas.filter(function(r){ return r.estado !== 'cancelada'; });
    const futuras = ativas.filter(function(r){ return r.data >= hojeIso; }).sort(_cmpR);
    const futPend = futuras.filter(function(r){ return r.estado === 'pendente'; });
    const hojeR = ativas.filter(function(r){ return r.data === hojeIso; }).sort(_cmpR);
    const cap = _capacidade();
    const pessoasHoje = _pessoasDia(hojeIso);

    let html = '<div class="kpis">'
      + _kpi(hojeR.length, 'Reservas hoje', 'a', '📅')
      + _kpi(futPend.length, 'Por responder', 'c', '⏳')
      + '<div class="kpi b full" id="kpiPessoas"><div class="ic">👥</div><div class="n" id="kpiPessoasN">'+pessoasHoje+(cap?(' <span class="kpi-cap">/ '+cap+'</span>'):'')+'</div><div class="l" id="kpiPessoasL">Pessoas hoje</div></div>'
      + '</div>';

    html += '<div class="dash-sec"><h3>⏳ A precisar de resposta</h3>'
      + (futPend.length ? futPend.map(_linhaReserva).join('') : '<div class="vazio-msg">Nada pendente. 👍</div>')
      + '</div>';

    html += '<div class="dash-sec"><h3>📆 Hoje</h3>'
      + (hojeR.length ? hojeR.map(_linhaReserva).join('') : '<div class="vazio-msg">Sem reservas para hoje.</div>')
      + '</div>';

    const prox = futuras.filter(function(r){ return r.data > hojeIso; }).slice(0, 30);
    html += '<div class="dash-sec"><h3>➡️ Próximas reservas <span style="font-weight:600; color:#8a7a5c; font-size:.82rem;">(a partir de amanhã)</span></h3>'
      + (prox.length ? prox.map(_linhaReserva).join('') : '<div class="vazio-msg">Sem reservas futuras.</div>')
      + '</div>';

    dash.innerHTML = html;
    _setKpiPessoas(hojeIso);
    dash.querySelectorAll('.linha-r').forEach(function(el){ el.onclick = function(){
      const id = el.getAttribute('data-id');
      const r = reservas.find(function(x){ return String(x.id)===String(id); });
      if(r) _setKpiPessoas(r.data);
      abrirModalEdicao(id);
    }; });

  /* ===== Exportar o mês em PDF ===== */
  const _CDNS_JSPDF = [
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];
  let _jspdfP = null;
  function _temJsPDF(){ return (window.jspdf && window.jspdf.jsPDF) || window.jsPDF; }
  function _carregarJsPDF(){
    if(_jspdfP) return _jspdfP;
    _jspdfP = new Promise(function(resolve, reject){
      if(_temJsPDF()){ resolve(); return; }
      let i = 0;
      (function tentar(){
        if(_temJsPDF()){ resolve(); return; }
        if(i >= _CDNS_JSPDF.length){ reject(new Error('Não foi possível carregar a biblioteca de PDF.')); return; }
        const s = document.createElement('script'); s.src = _CDNS_JSPDF[i++];
        s.onload = function(){ _temJsPDF() ? resolve() : tentar(); }; s.onerror = tentar;
        document.head.appendChild(s);
      })();
    });
    return _jspdfP;
  }
  async function exportarPdf(){
    const btn = $('btnPdf'); const _t = btn.textContent; btn.disabled = true; btn.textContent = 'A gerar PDF...';
    try{
      await _carregarJsPDF();
      const JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      const pdf = new JsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const mesPrefix = vAno + '-' + String(vMes+1).padStart(2,'0');
      const doMes = reservas.filter(function(r){ return String(r.data).indexOf(mesPrefix) === 0 && r.estado !== 'cancelada'; }).sort(_cmpR);
      const totalPax = doMes.reduce(function(s,r){ return s + (Number(r.pessoas)||0); }, 0);
      const M = 14, W = 210, BOTTOM = 285; let y = 18;
      const ensure = function(h){ if(y + h > BOTTOM){ pdf.addPage(); y = 18; } };
      pdf.setFont('helvetica','bold'); pdf.setFontSize(16); pdf.setTextColor(58,44,24);
      pdf.text((negocio && negocio.nome) || 'Reservas', M, y); y += 7;
      pdf.setFont('helvetica','normal'); pdf.setFontSize(12); pdf.setTextColor(120,110,90);

      pdf.setFontSize(10);
      pdf.text(doMes.length + ' reserva(s) · ' + totalPax + ' pessoa(s)', M, y); y += 5;
      pdf.setDrawColor(205,185,150); pdf.line(M, y, W - M, y); y += 7;
      if(!doMes.length){ pdf.setTextColor(120,110,90); pdf.text('Sem reservas neste mês.', M, y); }
      let lastDay = null;
      const WD = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      doMes.forEach(function(r){
        if(r.data !== lastDay){
          lastDay = r.data;
          const d = new Date(r.data+'T00:00:00');
          ensure(12);
          pdf.setFillColor(244,238,222); pdf.rect(M, y - 4, W - 2*M, 8, 'F');
          pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(58,44,24);
          pdf.text(WD[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase(), M + 2, y + 1.5);
          pdf.setFontSize(10); pdf.setTextColor(90,74,40);
          pdf.text(_pessoasDia(r.data) + ' pessoa(s)', W - M - 2, y + 1.5, { align:'right' });
          y += 10;
        }
        ensure(8);
        pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(40,30,20);
        pdf.text(String(r.hora || '—'), M + 2, y);
        pdf.setFont('helvetica','normal'); pdf.setTextColor(40,30,20);
        let linha = (r.nome || '') + '  ·  ' + (Number(r.pessoas)||1) + ' pax';
        if(r.telefone) linha += '  ·  ' + r.telefone;
        pdf.text(linha, M + 18, y, { maxWidth: W - M - 18 - 26 });
        if(r.estado === 'confirmada'){ pdf.setTextColor(46,139,87); } else { pdf.setTextColor(160,110,20); }
        pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
        pdf.text((r.estado || '').toUpperCase(), W - M - 2, y, { align:'right' });
        y += 5;
        if(r.obs){ pdf.setFont('helvetica','italic'); pdf.setFontSize(8.5); pdf.setTextColor(120,100,70); pdf.text('   ' + String(r.obs), M + 18, y, { maxWidth: W - M - 18 }); y += 4; }
        y += 1.5;
      });
      const fich = 'reservas-' + mesPrefix + '.pdf';
      try{ pdf.save(fich); }catch(e){ const nova = window.open(pdf.output('bloburl'), '_blank'); if(!nova) alert('O navegador bloqueou o PDF. Ativa os pop-ups.'); }
    }catch(err){ alert(err.message || 'Não foi possível gerar o PDF.'); }

  }

  function renderCal(){
    $('mesNome').textContent = MESES[vMes] + ' ' + vAno;
    const primeiro = new Date(vAno, vMes, 1);
    const arranque = (primeiro.getDay() + 6) % 7;   // segunda = 0
    const dias = new Date(vAno, vMes+1, 0).getDate();
    const hojeIso = isoLocal(hoje);
    let html = '';
    for(let i=0;i<arranque;i++) html += '<div class="dia vazio"></div>';
    for(let d=1; d<=dias; d++){
      const iso = vAno + '-' + String(vMes+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const rs = (porDia[iso] || []).filter(function(r){ return r.estado !== 'cancelada'; });
      const nPend = rs.filter(function(r){ return r.estado==='pendente'; }).length;
      const nConf = rs.filter(function(r){ return r.estado==='confirmada'; }).length;
      const temPromo = !!(((negocio && negocio.config && negocio.config.promoDatas) || {})[iso]);
      const fer = _feriado(iso) || _ferMunicipal(iso);
      const fechado = _encerrado(iso);
      const wd = new Date(iso+'T00:00:00').getDay();
      let cls = 'dia';
      if(fer) cls += ' feriado';
      if(fechado) cls += ' fechado';
      if(wd===0 || wd===6) cls += ' fds';
      if(iso < hojeIso) cls += ' passado';
      else if(iso > hojeIso) cls += ' futuro';
      if(rs.length) cls += ' tem';
      if(nConf) cls += ' tem-conf'; else if(nPend) cls += ' tem-pend';
      if(iso===hojeIso) cls += ' hoje';
      if(iso===diaSel) cls += ' sel';
      let bar = '';
      if(nPend) bar += '<i class="pend"></i>';
      if(nConf) bar += '<i class="conf"></i>';
      const _ttl = fechado ? ' title="Encerrado"' : (fer ? (' title="Feriado: '+esc(fer)+'"') : '');
      html += '<div class="'+cls+'" data-dia="'+iso+'"'+_ttl+'>'
            + (temPromo ? '<span class="promo-tag">🏷️</span>' : '')
            + (fer ? '<span class="fer-tag">★</span>' : '')
            + (fechado ? '<span class="fechado-tag">🔒</span>' : '')
            + '<span class="num">'+d+'</span>'
            + '<span class="bar">'+bar+'</span></div>';
    }
    $('grid').innerHTML = html;
    $('grid').querySelectorAll('.dia:not(.vazio)').forEach(function(el){ el.onclick = function(){
      const g = $('grid');
      const prev = g.querySelector('.dia.sel'); if(prev && prev !== el) prev.classList.remove('sel');
      el.classList.add('sel');
      diaSel = el.getAttribute('data-dia');
      renderDia(diaSel);
    }; });
  }

  async function _gravarPromoData(iso, promo){
    const { data, error } = await sb.from('negocios').select('config').eq('id', negocio.id).maybeSingle();
    if(error) return error;
    const cfg = (data && data.config) || {};
    cfg.promoDatas = cfg.promoDatas || {};
    if(promo) cfg.promoDatas[iso] = promo; else delete cfg.promoDatas[iso];
    // As promoções passaram a ser todas por DATA — limpar a base/por-dia-da-semana legada (senão a montra cairia nela)
    if(cfg.promo) delete cfg.promo;
    if(cfg.promoDias) delete cfg.promoDias;
    const up = await sb.from('negocios').update({ config: cfg }).eq('id', negocio.id);
    if(up.error) return up.error;
    negocio.config = cfg;   // manter a cópia local em sincronia
    return null;
  }
  async function guardarPromo(iso){
    const texto = ($('pmTexto').value||'').trim();
    const cor = $('pmCor').value || '#e0245e';
    const corMold = ($('pmCorMold') && $('pmCorMold').value) || '#ffffff';
    const tam = Math.max(11, Math.min(30, parseInt($('pmTam').value,10)||16));
    const horOn = $('pmHorarioOn').checked;
    const msg = $('pmMsg');
    if(!texto){ msg.textContent='Escreve o texto da promoção.'; msg.className='msg erro'; return; }
    const promo = { texto: texto, cor: cor, corMold: corMold, tamanho: tam, ativo: true };
    if(horOn){ promo.horaIni = $('pmHoraIni').value||''; promo.horaFim = $('pmHoraFim').value||''; }
    const g = $('pmGuardar'); g.disabled = true; msg.textContent='A publicar...'; msg.className='msg';
    const err = await _gravarPromoData(iso, promo);
    if(err){ g.disabled = false; msg.textContent='Erro: '+err.message; msg.className='msg erro'; return; }
    // Publicado no à mesa + no cardápio (config.promoDatas). Envia também push automaticamente.
    msg.textContent = 'Promoção publicada ✓'; msg.className = 'msg';
    { const rmb = $('pmRemover'); if(rmb) rmb.style.display = ''; }
    try{
      const corpoPush = texto.replace(/\s+/g,' ').trim();
      const { data, error } = await sb.functions.invoke('enviar-push', { body:{ negocio: negocio.id, titulo:(negocio.nome || 'Promoção'), corpo: corpoPush, url: _linkCardapio() } });
      if(!error && !(data && data.erro)){ msg.textContent = 'Promoção publicada ✓ · 🔔 aviso enviado a ' + ((data && data.enviados) || 0) + ' aparelho(s).'; }
    }catch(e){}
    g.disabled = false;
    renderCal();
  }
  async function removerPromo(iso){
    if(!(await window.__amConfirm('Confirmar',{texto:'Remover a promoção deste dia?', ok:'Sim', cancelar:'Não'}))) return;
    const err = await _gravarPromoData(iso, null);
    if(err){ const msg=$('pmMsg'); if(msg){ msg.textContent='Erro: '+err.message; msg.className='msg erro'; } return; }
    renderCal(); renderDia(iso);
  }

  function _telWA(t){
    let d = String(t||'').replace(/\D/g,'');
    if(!d) return '';
    if(d.length===9) d = '351' + d;          // número PT sem indicativo
    else if(d.indexOf('00')===0) d = d.slice(2);  // 00351... → 351...
    return d;
  }
  function _dataPt(iso){ const d = new Date(iso+'T00:00:00'); return d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function _waUrl(r, tipo){
    const tel = _telWA(r.telefone);
    if(!tel) return '';
    const nome = (r.nome||'').trim();
    const quando = _dataPt(r.data) + (r.hora ? (' às ' + r.hora) : '');
    const pessoas = (Number(r.pessoas)||1) + ' pessoa(s)';
    const casa = (negocio && negocio.nome) ? negocio.nome : 'o restaurante';
    // link para o cliente gerir (alterar/cancelar) a reserva dele
    let _gerir = '';
    try{ if(SLUG){ _gerir = '\nGerir a tua reserva (alterar ou cancelar): ' + location.origin + '/cardapio.html?n=' + SLUG + '&rgerir=1' + (r.id ? ('&rid=' + encodeURIComponent(r.id)) : '') + '&rn=' + encodeURIComponent(nome) + '&rd=' + (r.data||'') + '&rh=' + encodeURIComponent(r.hora||'') + '&rp=' + (Number(r.pessoas)||1); } }catch(e){}
    let msg;
    if(tipo==='confirmar'){
      msg = 'Olá' + (nome ? ' '+nome : '') + '! A sua reserva em ' + casa + ' para ' + quando + ' (' + pessoas + ') está confirmada. Até já! 🍽️' + _gerir;
    } else if(tipo==='pendente'){
      msg = 'Olá' + (nome ? ' '+nome : '') + '! Recebemos o seu pedido de reserva em ' + casa + ' para ' + quando + ' (' + pessoas + '). Confirmamos em breve. Obrigado!' + _gerir;
    } else if(tipo==='cancelaceite'){
      // O CLIENTE pediu para cancelar e o restaurante aceitou
      msg = 'Olá' + (nome ? ' '+nome : '') + '! O seu cancelamento da reserva em ' + casa + ' para ' + quando + ' foi aceite. Obrigado por avisar — até uma próxima! 👋';
    } else {
      msg = 'Olá' + (nome ? ' '+nome : '') + '. Lamentamos, mas não conseguimos confirmar a sua reserva em ' + casa + ' para ' + quando + '. Contacte-nos para encontrarmos uma alternativa.';
    }
    return 'https://wa.me/' + tel + '?text=' + encodeURIComponent(msg);
  }
  // Avisar o cliente por WhatsApp a QUALQUER momento (mensagem conforme o estado atual da reserva)
  function _avisarCliente(r){
    if(!r){ return; }
    const tipo = (r.estado==='confirmada') ? 'confirmar' : (r.estado==='cancelada' ? 'recusar' : 'pendente');
    const url = _waUrl(r, tipo);
    if(url){ window.open(url, '_blank'); }
    else { alert('Esta reserva não tem número de telefone para avisar o cliente.'); }
  }

  // Pedido de cancelamento vindo do cliente (link &canc=1): mostra "Cliente X quer cancelar a reserva Y"
  // e, ao aceitar, marca cancelada + abre o WhatsApp com "cancelamento aceite, até uma próxima".
  async function _pedidoCancelamento(r){
    if(!r) return;
    if(String(r.estado) === 'cancelada'){ alert('Esta reserva já está cancelada.'); return; }
    var quando = _dataPt(r.data) + (r.hora ? (' às ' + r.hora) : '');
    var nome = (r.nome || 'O cliente').trim();
    var sim = await window.__amConfirm('Pedido de cancelamento', {
      texto: nome + ' quer cancelar a reserva de ' + quando + ' (' + (Number(r.pessoas)||1) + ' pessoa(s)).\n\nAceitar o cancelamento e avisar o cliente?',
      ok: 'Aceitar e avisar', cancelar: 'Agora não'
    });
    if(!sim) return;
    // Abre já o WhatsApp (mantém o gesto do toque) com a mensagem de cancelamento aceite
    var url = _waUrl(r, 'cancelaceite');
    var win = url ? window.open(url, '_blank') : null;
    var { error } = await sb.from('reservas').update({ estado:'cancelada' }).eq('id', r.id);
    if(error){ alert('Erro: ' + error.message); if(win){ try{ win.close(); }catch(e){} } return; }
    carregar();
  }

  async function accao(id, a){
    const r = reservas.find(function(x){ return String(x.id)===String(id); });
    if(a==='avisar'){ _avisarCliente(r); return; }
    if(a==='editar'){ abrirEdicao(id); return; }
    if(a==='apagar'){
      if(!(await window.__amConfirm('Confirmar',{texto:'Apagar esta reserva definitivamente? Esta ação não pode ser anulada.', ok:'Sim', cancelar:'Não'}))) return;
      const { error } = await sb.from('reservas').delete().eq('id', id);
      if(error){ alert('Erro: '+error.message); return; }
      carregar();
      return;
    }
    let patch = null, tipo = null;
    if(a==='confirmar'){ patch = { estado:'confirmada' }; tipo = 'confirmar'; }
    else if(a==='cancelar'){ if(!(await window.__amConfirm('Confirmar',{texto:'Recusar/cancelar esta reserva?', ok:'Sim', cancelar:'Não'}))) return; patch = { estado:'cancelada' }; tipo = 'recusar'; }
    if(!patch) return;
    // Abre já o WhatsApp com a resposta pronta (mantém a permissão do toque; o dono só carrega em enviar)
    const url = r ? _waUrl(r, tipo) : '';
    const win = url ? window.open(url, '_blank') : null;
    const { error } = await sb.from('reservas').update(patch).eq('id', id);
    if(error){ alert('Erro: '+error.message); if(win){ try{ win.close(); }catch(e){} } return; }
    carregar();
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  iniciar();
</script>
<script>
/* Janela própria (substitui prompt()/confirm() do sistema) — estilo ÀMesa */
(function(){
  if(window.__amConfirm) return;
  var D='#4a3820', S='#8a7350', L='#e6dcc8', G='#a8712f', GE='#7a5320';
  var ov=document.createElement('div'); ov.id='amModal';
  ov.style.cssText='position:fixed;inset:0;z-index:12000;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);padding:0;opacity:0;transition:opacity .28s ease;';
  ov.innerHTML='<div id="amCard" style="background:linear-gradient(180deg,#fffdf9,#fff);width:100%;max-width:440px;border-radius:22px 22px 0 0;border-top:3px solid '+G+';box-shadow:0 -12px 40px rgba(0,0,0,.30);padding:20px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .36s cubic-bezier(.2,.9,.3,1);will-change:transform;font-family:inherit;">'
    +'<div id="amTit" style="color:'+D+';font-size:1.12rem;font-weight:800;text-align:center;margin-bottom:6px;"></div>'
    +'<div id="amMsg" style="color:'+S+';font-size:.9rem;line-height:1.4;text-align:center;margin-bottom:12px;white-space:pre-line;"></div>'
    +'<input id="amInput" style="display:none;width:100%;box-sizing:border-box;padding:12px 13px;border:1.5px solid '+L+';border-radius:12px;font-family:inherit;font-size:1rem;color:'+D+';background:#fff;margin-bottom:14px;">'
    +'<div style="display:flex;gap:8px;">'
    +'<button id="amCancel" type="button" style="flex:1;padding:12px;border:1.5px solid '+L+';background:#fff;color:'+D+';border-radius:12px;font-family:inherit;font-weight:700;cursor:pointer;">Cancelar</button>'
    +'<button id="amOk" type="button" style="flex:1;padding:12px;border:none;background:linear-gradient(180deg,'+G+','+GE+');color:#fff;border-radius:12px;font-family:inherit;font-weight:800;cursor:pointer;">OK</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  var card=ov.querySelector('#amCard'),tit=ov.querySelector('#amTit'),msg=ov.querySelector('#amMsg'),inp=ov.querySelector('#amInput'),bOk=ov.querySelector('#amOk'),bC=ov.querySelector('#amCancel');
  var _res=null,_p=false,_hideTimer=null;
  function fechar(v){ ov.style.opacity='0'; card.style.transform='translateY(100%)'; if(_hideTimer) clearTimeout(_hideTimer); _hideTimer=setTimeout(function(){ ov.style.display='none'; _hideTimer=null; },380); var r=_res;_res=null; if(r) r(v); }
  function abrir(){ if(_hideTimer){ clearTimeout(_hideTimer); _hideTimer=null; } ov.style.display='flex'; card.style.transition='none'; card.style.transform='translateY(100%)'; ov.style.opacity='0'; void ov.offsetWidth; card.style.transition='transform .36s cubic-bezier(.2,.9,.3,1)'; requestAnimationFrame(function(){ ov.style.opacity='1'; card.style.transform='translateY(0)'; }); }
  bOk.onclick=function(){ fechar(_p?inp.value:true); };
  bC.onclick=function(){ fechar(_p?null:false); };
  ov.addEventListener('click',function(e){ if(e.target===ov) bC.onclick(); });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); bOk.onclick(); } });
  window.__amConfirm=function(t,o){ o=o||{}; _p=false; tit.textContent=t||'Confirmar'; msg.textContent=o.texto||''; msg.style.display=o.texto?'block':'none'; inp.style.display='none'; bOk.textContent=o.ok||'Sim'; bC.textContent=o.cancelar||'Não'; abrir(); return new Promise(function(r){_res=r;}); };
  window.__amPrompt=function(t,o){ o=o||{}; _p=true; tit.textContent=t||''; msg.textContent=o.texto||''; msg.style.display=o.texto?'block':'none'; inp.style.display='block'; inp.value=(o.valor!=null?o.valor:''); inp.placeholder=o.placeholder||''; inp.type=o.tipo||'text'; bOk.textContent=o.ok||'OK'; bC.textContent=o.cancelar||'Cancelar'; abrir(); setTimeout(function(){ try{inp.focus();inp.select();}catch(e){} },80); return new Promise(function(r){_res=r;}); };
})();
</script>
