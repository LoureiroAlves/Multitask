<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão do negócio</title>

<link rel="apple-touch-icon" href="icon-reservas-180.png">
<link rel="icon" type="image/png" href="icon-reservas-192.png">
<style>
  :root{ --castanho:#3a2c18; --dourado:#a8712f; --dourado-escuro:#6b4a1f; --bege:#f5efe2; --bege-claro:#fbf8f2; --linha:#e3d9c4; --verde:#2e9b57; --vermelho:#c0392b; --azul:#2a5aa8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bege-claro); color:var(--castanho); }
  header.top{ background:linear-gradient(135deg,#6a4e26,#38290f); color:#fff; padding:calc(16px + env(safe-area-inset-top)) 20px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:0 0 20px 20px; box-shadow:0 6px 22px rgba(58,44,24,.22); }
  header.top h1{ font-size:1.2rem; margin:0; font-weight:800; }
  header.top button{ background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:9px; padding:9px 13px; cursor:pointer; font-size:.82rem; font-weight:700; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px; }
  .card{ background:#fff; border:1px solid var(--linha); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 6px 22px rgba(74,56,32,.09); }
  input{ width:100%; padding:10px 12px; border:1.5px solid var(--linha); border-radius:9px; font-family:inherit; font-size:.95rem; margin-bottom:9px; }
  label{ font-size:.82rem; font-weight:600; color:var(--dourado-escuro); display:block; margin:6px 0 4px; }
  button.acao{ background:var(--dourado); color:#fff; border:none; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; }
  .msg{ font-size:.85rem; margin-top:8px; } .msg.erro{ color:var(--vermelho); }
  .hide{ display:none; }

  /* Barra do mês */
  .mes-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .mes-bar button{ background:#fff; border:1px solid var(--linha); border-radius:12px; width:42px; height:42px; font-size:1.2rem; cursor:pointer; color:var(--castanho); box-shadow:0 2px 6px rgba(74,56,32,.06); }
  .mes-bar .mes-nome{ font-weight:800; font-size:1.12rem; text-transform:capitalize; }

  /* Grelha do calendário */
  .cal{ background:#fff; border:1px solid var(--linha); border-radius:18px; padding:12px; box-shadow:0 6px 22px rgba(74,56,32,.09); }
  .cal-cab, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cab{ margin-bottom:6px; }
  .cal-cab div{ text-align:center; font-size:.74rem; font-weight:800; color:#fff; padding:6px 0; border-radius:8px; letter-spacing:.3px; }
  .cal-cab div:nth-child(1){ background:#2a5aa8; }   /* Seg */
  .cal-cab div:nth-child(2){ background:#2e9b57; }   /* Ter */
  .cal-cab div:nth-child(3){ background:#c9971c; }   /* Qua */
  .cal-cab div:nth-child(4){ background:#8e5bd0; }   /* Qui */
  .cal-cab div:nth-child(5){ background:#e0662a; }   /* Sex */
  .cal-cab div:nth-child(6){ background:#c8702f; }   /* Sáb */
  .cal-cab div:nth-child(7){ background:#c0392b; }   /* Dom */
  .dia{ position:relative; aspect-ratio:1/1; border:1.5px solid transparent; border-radius:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.95rem; cursor:default; background:#fbf6ec; transition:transform .06s ease; }
  .dia.vazio{ background:transparent; }
  .dia.fds{ background:#fbeee1; }                                  /* fim de semana */
  .dia.fds .num{ color:#b0532e; }
  .dia.futuro{ background:#eef2fb; }                               /* dias que ainda vêm (tom azulado) */
  .dia.tem{ cursor:pointer; }
  .dia.tem:active{ transform:scale(.95); }
  .dia.tem-pend{ background:#fdf1d2; border-color:#eccd7d; }       /* dia com pendentes */
  .dia.tem-conf{ background:#e2f4e9; border-color:#93d4ac; }       /* dia com confirmadas */
  .dia.passado{ background:#ececea; border-color:transparent; }    /* dias que já passaram (cinzento) */
  .dia.passado .num{ color:#b3ada1; }
  .dia.passado .bar i{ opacity:.35; }
  .dia.passado .promo-tag{ opacity:.4; }
  .dia.hoje{ box-shadow:0 0 0 3px var(--dourado) inset; background:#fdf2d6; }   /* HOJE em destaque */
  .dia.hoje .num{ color:var(--dourado-escuro); font-weight:800; }
  .dia.sel{ background:linear-gradient(145deg,#4a3820,#2f2410); color:#fff; border-color:#2f2410; box-shadow:0 6px 16px rgba(58,44,24,.32); transform:translateY(-1px); }
  .dia.sel .num{ color:#fff; }
  .dia .num{ line-height:1; font-weight:700; }
  .dia .bar{ display:flex; gap:3px; margin-top:5px; height:5px; }
  .dia .bar i{ width:13px; height:5px; border-radius:3px; display:block; }
  .bar i.pend{ background:var(--dourado); }
  .bar i.conf{ background:var(--verde); }
  .dia.sel .bar i.pend{ background:#f2c879; } .dia.sel .bar i.conf{ background:#7ed3a1; }
  .dia .cnt{ position:absolute; top:4px; right:7px; font-size:.6rem; font-weight:800; color:#a86b2c; }
  .dia.tem-conf .cnt{ color:#2e9b57; }
  .dia .promo-tag{ position:absolute; top:4px; left:6px; font-size:.6rem; line-height:1; }
  .dia .fer-tag{ position:absolute; top:3px; right:6px; font-size:.62rem; line-height:1; color:#c0392b; }
  .dia.sel .fer-tag{ color:#ffcf9e; }
  .dia.feriado .num{ text-decoration:underline; text-decoration-color:#c0392b; text-underline-offset:2px; }
  .dia.fechado{ background:repeating-linear-gradient(45deg,#f4dedb,#f4dedb 5px,#fbeeec 5px,#fbeeec 10px); border-color:#e6b7af; }
  .dia.fechado .num{ color:#b23; }
  .dia .fechado-tag{ position:absolute; bottom:3px; right:5px; font-size:.6rem; line-height:1; }
  .dia.sel .cnt{ color:#f0d9b0; }

  .legenda{ display:flex; gap:14px; justify-content:center; margin:14px 0 0; font-size:.76rem; color:#8a7a5c; }
  .legenda span{ display:inline-flex; align-items:center; gap:6px; }
  .legenda i{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  /* Detalhe do dia */
  .dia-tit{ font-weight:800; font-size:1.05rem; text-transform:capitalize; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .dia-tit .chip{ font-size:.68rem; font-weight:800; color:#fff; border-radius:8px; padding:3px 9px; text-transform:uppercase; letter-spacing:.3px; }
  .r{ border:1px solid var(--linha); border-left:5px solid var(--linha); border-radius:14px; padding:13px 14px; margin-bottom:11px; }
  .r.confirmada{ border-left-color:var(--verde); }
  .r.pendente{ border-left-color:var(--dourado); }
  .r.cancelada{ border-left-color:var(--vermelho); opacity:.6; }
  .r-top{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
  .r-quando{ font-weight:800; font-size:1.15rem; }
  .r-nome{ font-size:.95rem; margin-top:5px; font-weight:600; }
  .r-meta{ font-size:.83rem; color:#8a7a5c; margin-top:3px; }
  .r-menu{ font-size:.85rem; color:var(--dourado-escuro); margin-top:6px; font-weight:600; background:#faf4e8; border-radius:8px; padding:6px 9px; }
  .r-acoes{ display:flex; gap:7px; flex-wrap:wrap; margin-top:11px; }
  .r-acoes button, .r-acoes a button{ border:1px solid var(--linha); background:#fff; border-radius:9px; padding:8px 12px; cursor:pointer; font-size:.82rem; font-weight:700; }
  .r-acoes button.ok{ color:#fff; background:var(--verde); border-color:var(--verde); }
  .r-acoes button.no{ color:var(--vermelho); border-color:#e8c4bf; }
  .r-acoes button.wa{ color:#fff; background:#25d366; border-color:#25d366; }
  .r-acoes button.edit{ color:var(--dourado-escuro); border-color:#e7d8b4; }
  .r-acoes button.del{ color:#8a7a5c; border-color:var(--linha); }
  .pill{ font-size:.68rem; font-weight:800; padding:4px 11px; border-radius:30px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.pendente{ background:#fbeecb; color:#8a5a10; }
  .pill.confirmada{ background:#e2f4e9; color:#1e6b3c; }
  .pill.cancelada{ background:#fbe7e4; color:var(--vermelho); }
  /* respostas rápidas às reservas */
  .r-info{ font-size:.83rem; font-weight:700; margin-top:7px; border-radius:8px; padding:6px 9px; background:#f4f1ea; color:#5a4a2e; }
  .r-info.prop{ background:#eef3fb; color:#2a4f86; }
  .r-info.alt{ background:#fff3d6; color:#7a5310; }
  .r-info.ok{ background:#e2f4e9; color:#1e6b3c; }
  .r-info.no{ background:#fbe7e4; color:#a33; }
  .r-acoes button.resp{ color:#2a4f86; border-color:#c9d8ef; background:#f4f8fe; }
  .r-acoes button.wa2{ color:#1e7a43; border-color:#cdeed9; background:#fff; font-weight:600; }
  .r-sino{ font-size:.72rem; font-weight:700; color:#8a7a5c; margin-left:6px; }
  #rsModal .rs-op{ display:block; width:100%; text-align:left; border:1.5px solid var(--linha); background:#fff; border-radius:12px; padding:12px 14px; margin-top:8px; font-weight:800; font-size:.95rem; cursor:pointer; font-family:inherit; color:#3a2c18; }
  #rsModal .rs-op.ok{ background:var(--verde); border-color:var(--verde); color:#fff; }
  #rsModal .rs-op.no{ color:var(--vermelho); border-color:#e8c4bf; }
  #rsModal .rs-sub{ display:none; gap:8px; align-items:center; margin:8px 0 2px; }
  #rsModal .rs-sub input{ flex:1; padding:10px; border:1.5px solid var(--linha); border-radius:9px; font-family:inherit; font-size:1rem; }
  #rsModal .rs-sub button{ border:none; background:#2a4f86; color:#fff; border-radius:9px; padding:11px 14px; font-weight:800; cursor:pointer; font-family:inherit; }
  #rsModal textarea{ width:100%; box-sizing:border-box; padding:10px; border:1.5px solid var(--linha); border-radius:9px; font-family:inherit; margin-top:4px; }
  #rsModal .rs-wa{ width:100%; margin-top:12px; background:none; border:none; color:#1e7a43; font-weight:700; font-size:.85rem; cursor:pointer; padding:6px; text-decoration:underline; }
  #rsToast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(30px); opacity:0; background:#2f2416; color:#fff; padding:11px 16px; border-radius:12px; font-weight:700; font-size:.88rem; z-index:13000; transition:all .3s; max-width:90vw; text-align:center; pointer-events:none; }
  #rsToast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  .r-hist{ margin-top:14px; border:1px dashed #e0cfc9; border-radius:14px; padding:10px 12px; background:#fdf8f6; }
  .r-hist summary{ cursor:pointer; font-weight:800; font-size:.9rem; color:#8a5a50; }
  .r-hist .r{ opacity:.85; }
  .r-motivo{ display:inline-block; font-size:.78rem; font-weight:800; border-radius:8px; padding:4px 8px; margin-top:6px; background:#fbe7e4; color:#a33; }
  .linha-r .motivo{ font-size:.75rem; font-weight:700; color:#a33; }
  .dono-push{ background:#eef3fb; border:1.5px solid #c9d8ef; border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:.86rem; color:#2a4f86; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .dono-push button{ border:none; background:#2a4f86; color:#fff; border-radius:9px; padding:8px 12px; font-weight:800; cursor:pointer; font-family:inherit; }
  /* Separadores Calendário / Painel */
  .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#efe4cf; padding:5px; border-radius:14px; margin-bottom:16px; }
  .tab{ white-space:nowrap; padding:12px 10px; border:none; background:transparent; border-radius:10px; font-weight:800; cursor:pointer; color:#9a7f4f; font-size:.9rem; transition:.15s; }
  .tab.ativo{ background:#fff; color:var(--castanho); box-shadow:0 2px 8px rgba(74,56,32,.12); }
  /* ===== Dashboard moderna (home com cartões) ===== */
  .tabs.hide{ display:none !important; }
  #dashHome{ animation:homeIn .34s ease; }
  @keyframes homeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .home-hi{ font-size:1.3rem; font-weight:800; color:var(--castanho); margin:2px 0 14px; }
  .home-hi span{ color:#8a7a5c; font-weight:600; font-size:.9rem; display:block; margin-top:2px; }
  .home-kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .home-kpi{ background:#fff; border:1px solid #efe4cf; border-radius:14px; padding:12px 14px; box-shadow:0 4px 14px rgba(74,56,32,.06); }
  .home-kpi .n{ font-size:1.5rem; font-weight:800; color:var(--castanho); line-height:1; }
  .home-kpi .l{ font-size:.74rem; color:#8a7a5c; font-weight:700; margin-top:5px; }
  .home-kpi.alerta .n{ color:#e0453a; }
  .cards-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  @media(max-width:1100px){ .cards-grid{ grid-template-columns:repeat(3,1fr); } }
  .dash-card{ text-align:left; cursor:pointer; background:#fff; border:1px solid #ece0c8; border-radius:18px; padding:18px; box-shadow:0 6px 22px rgba(74,56,32,.07); transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s, border-color .18s; display:flex; flex-direction:column; gap:6px; min-height:138px; font-family:inherit; position:relative; overflow:hidden; }
  .dash-card:hover{ transform:translateY(-3px); box-shadow:0 14px 34px rgba(74,56,32,.14); border-color:var(--dourado); }
  .dash-card:active{ transform:translateY(-1px) scale(.995); }
  .dash-card .dc-ico{ font-size:1.7rem; line-height:1; }
  .cal-ico{ display:inline-flex; flex-direction:column; width:40px; height:40px; border-radius:9px; overflow:hidden; background:#fff; border:1px solid #e4d8bf; box-shadow:0 2px 7px rgba(74,56,32,.18); }
  .cal-ico-top{ height:12px; background:#e0453a; display:flex; align-items:center; justify-content:space-between; padding:0 5px; }
  .cal-ico-top i{ width:2px; height:5px; background:#fff; border-radius:1px; margin-top:-2px; opacity:.9; }
  .cal-ico-d{ flex:1; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.2rem; color:var(--castanho); line-height:1; }
  .dash-card .dc-tit{ font-size:1.05rem; font-weight:800; color:var(--castanho); }
  .dash-card.bloq{ background:#f6f2ea; border-style:dashed; box-shadow:none; }
  .dash-card.bloq .dc-ico, .dash-card.bloq .dc-tit, .dash-card.bloq .dc-sub{ opacity:.55; }
  .dash-card .dc-lock{ position:absolute; top:12px; right:12px; font-size:.72rem; font-weight:800; color:#7a5320; background:#fff3d6; border:1px solid #ecd59f; padding:3px 9px; border-radius:999px; }
  .ex-linha{ display:flex; align-items:center; gap:12px; background:#fff; border:1px solid #ece0c8; border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .ex-linha.off{ background:#f8f4ec; }
  .ex-linha .ex-ico{ font-size:1.5rem; width:34px; text-align:center; flex:none; }
  .ex-linha .ex-txt{ flex:1; min-width:0; }
  .ex-linha .ex-nome{ font-weight:800; color:var(--castanho); }
  .ex-linha .ex-desc{ font-size:.8rem; color:#8a7a5c; margin-top:2px; }
  .ex-linha .ex-est{ font-size:.76rem; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .ex-sw{ position:relative; width:46px; height:26px; flex:none; }
  .ex-sw input{ opacity:0; width:0; height:0; }
  .ex-sw span{ position:absolute; inset:0; background:#d9cfbd; border-radius:999px; transition:background .2s; cursor:pointer; }
  .ex-sw span:before{ content:''; position:absolute; left:3px; top:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .ex-sw input:checked + span{ background:#2e9e5b; }
  .ex-sw input:checked + span:before{ transform:translateX(20px); }
  .dash-card .dc-sub{ font-size:.85rem; color:#8a7a5c; font-weight:600; line-height:1.35; }
  .dash-card .dc-badge{ position:absolute; top:14px; right:14px; background:#e0453a; color:#fff; font-size:.76rem; font-weight:800; padding:3px 9px; border-radius:999px; box-shadow:0 2px 8px rgba(224,69,58,.4); }
  .dash-card .dc-seta{ margin-top:auto; color:var(--dourado); font-weight:800; font-size:.84rem; }
  #areaBar{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  #areaBar.hide{ display:none !important; }   /* o seletor de ID vencia o .hide — sem isto a seta "Voltar" ficava visível na home */
  #btnVoltarHome{ border:1px solid #e0d3b5; background:#fff; border-radius:999px; padding:8px 16px; cursor:pointer; font-family:inherit; font-weight:800; color:var(--castanho); font-size:.9rem; box-shadow:0 2px 8px rgba(74,56,32,.08); transition:.15s; }
  #btnVoltarHome:hover{ background:#fbf6ec; transform:translateX(-2px); }
  #areaTit{ font-weight:800; color:var(--castanho); font-size:1.12rem; }
  /* Filtros das encomendas */
  .enc-filtros{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .enc-chip{ border:1px solid #e0d3b5; background:#fff; border-radius:999px; padding:8px 13px; cursor:pointer; font-family:inherit; font-weight:800; font-size:.83rem; color:#9a7f4f; transition:.15s; }
  .enc-chip .cnt{ display:inline-block; margin-left:6px; background:#efe4cf; color:#7a6440; border-radius:999px; padding:0 7px; font-size:.75rem; }
  .enc-chip.on{ color:#fff; }
  .enc-chip.on .cnt{ background:rgba(255,255,255,.28); color:#fff; }
  .enc-chip.f-pendente.on{ background:#e0453a; border-color:#e0453a; }
  .enc-chip.f-confirmada.on{ background:#ef8f22; border-color:#ef8f22; }
  .enc-chip.f-pronta.on{ background:#2ecc71; border-color:#2ecc71; }
  .enc-chip.f-entregue.on{ background:#5a6b5f; border-color:#5a6b5f; }
  @media(max-width:900px){ .cards-grid{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:560px){ .cards-grid{ grid-template-columns:1fr; } }
  /* Painel (dashboard) */
  .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px; }
  .kpi{ border:1px solid var(--linha); border-radius:16px; padding:15px; background:#fff; box-shadow:0 6px 22px rgba(74,56,32,.07); }
  .kpi .ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; margin-bottom:9px; background:#f2ead9; }
  .kpi .n{ font-size:1.8rem; font-weight:800; line-height:1; }
  .kpi .l{ font-size:.76rem; color:#8a7a5c; font-weight:700; margin-top:5px; }
  .kpi-cap{ font-size:1rem; color:#8a7a5c; font-weight:700; }
  .kpi.full{ grid-column:1 / -1; }
  .kpi.a{ background:#eef4fc; border-color:#cfe0f4; } .kpi.a .ic{ background:#d5e5f7; } .kpi.a .n{ color:#2a5aa8; }
  .kpi.c{ background:#fdf6e3; border-color:#eeddb0; } .kpi.c .ic{ background:#f7e6bd; } .kpi.c .n{ color:var(--dourado-escuro); }
  .kpi.b{ background:#eafaf0; border-color:#bfe6cd; } .kpi.b .ic{ background:#cfeeda; } .kpi.b .n{ color:var(--verde); }
  .dash-sec{ margin-bottom:18px; }
  .dash-sec h3{ font-size:.95rem; margin:0 0 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .linha-r{ display:flex; align-items:center; gap:12px; border:1px solid var(--linha); border-radius:14px; padding:11px 13px; margin-bottom:9px; cursor:pointer; background:#fff; box-shadow:0 2px 8px rgba(74,56,32,.05); }

      var hojeIso = (function(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); })();

  // ISO da 2ª feira desta semana (início da semana)
  function _isoSegundaDestaSemana(){
    var d=new Date(); var off=(d.getDay()+6)%7;   // 0=segunda ... 6=domingo
    d.setDate(d.getDate()-off); d.setHours(0,0,0,0);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  // Apaga entradas de semanas anteriores, mas mantém sempre o dia mais recente (para "Copiar do último dia")
  function _purgaMapaAntigo(mapa, segunda){
    if(!mapa || typeof mapa!=='object') return false;
    var antigas=Object.keys(mapa).filter(function(k){ return k < segunda; }).sort();  // crescente
    if(!antigas.length) return false;
    var manter=antigas[antigas.length-1];   // o mais recente das anteriores fica como base para copiar
    var mudou=false;
    antigas.forEach(function(k){ if(k!==manter){ delete mapa[k]; mudou=true; } });
    return mudou;
  }
  // Limpeza automática semanal do prato do dia e das promoções (corre ao abrir a Gestão)
  async function _limparSemanaAntiga(){
    try{
      // lê SEMPRE a config fresca da base de dados (nunca escreve por cima de definições recentes)
      var sel=await sb.from('negocios').select('config').eq('id', negocio.id).maybeSingle();
      if(sel.error) return;
      var cfg=(sel.data&&sel.data.config)||{};
      var seg=_isoSegundaDestaSemana();
      var m1=_purgaMapaAntigo(cfg.pratoDatas, seg);
      if(cfg.pratoDia){ delete cfg.pratoDia; m1=true; }   // limpa também restos legado
      // Promoções: migrar o formato antigo (por data) para a lista, arquivar as passadas há +30 dias e regenerar o espelho promoDatas
      var m2=_prMigrar(cfg); if(_prArquivar(cfg)) m2=true; if(_prEspelho(cfg)) m2=true;
      // Horário semanal: migrar o modelo antigo (dias/horários/turnos + horas do editor) uma vez
      if(cfg.agenda && typeof cfg.agenda==='object' && !window.__amHor.temHorario(cfg.agenda)){ Object.assign(cfg.agenda, window.__amHor.migrar(cfg.agenda, cfg.carrinho||{})); Object.assign(cfg.agenda, window.__amHor.legado(cfg.agenda)); m2=true; }
      if(m1||m2){
        var up=await _updNeg(cfg);
        if(!up.error) negocio.config=cfg;
      } else {
        negocio.config=cfg;   // mantém a cópia local em dia
      }
    }catch(e){}
  }

    // Pedido do cliente por link: abrir a reserva pelo CÓDIGO, já preenchida com a alteração/cancelamento
    if(RID_PARAM){
      const alvoR = reservas.find(function(x){ return String(x.id) === String(RID_PARAM); });
      if(alvoR){
        const dd = new Date(alvoR.data+'T00:00:00');
        vAno = dd.getFullYear(); vMes = dd.getMonth(); diaSel = alvoR.data;
        mostrarVista('cal'); renderCal(); renderDia(alvoR.data);
        if(CANC_PARAM){
          _pedidoCancelamento(alvoR);   // "Cliente X quer cancelar a reserva Y" → aceitar e responder
        } else if(!ALT_PARAM && !_eGrupo(alvoR) && alvoR.estado !== 'cancelada'){
          _abrirAprovacao(alvoR);   // vindo de uma notificação: mostra o pedido com as respostas rápidas
        } else {
          abrirModalEdicao(alvoR.id);
          if(ALT_PARAM){
            if(AP_PARAM) $('mdPessoas').value = AP_PARAM;
            if(AH_PARAM) $('mdHora').value = AH_PARAM;

            $('mdMsg').textContent = '✏️ O cliente pediu esta alteração: ' + (AP_PARAM || alvoR.pessoas) + ' pessoa(s)' + (AH_PARAM ? (' às ' + AH_PARAM) : '') + '. Revê e clica Guardar para confirmar.';
            $('mdMsg').className = 'msg';
          }
        }
        return;
      }

    }
    let alvo = null;
    if(DIA_PARAM){
      const doDia = reservas.filter(function(r){ return r.data === DIA_PARAM && r.estado === 'pendente'; }).sort(_cmpR);
      alvo = doDia[0] || reservas.filter(function(r){ return r.data === DIA_PARAM; }).sort(_cmpR)[0] || null;

  function _encEstadoInfo(est){
    if(est === 'confirmada') return { txt:'A preparar', cor:'#a85d10', bg:'#fff2df' };
    if(est === 'pronta')     return { txt:'Pronta',     cor:'#1e6b3c', bg:'#e6f7ec' };
    if(est === 'entregue')   return { txt:'Entregue',   cor:'#5a6b5f', bg:'#eef1ee' };
    if(est === 'cancelada')  return { txt:'Cancelada',  cor:'#b23',    bg:'#fbe7e4' };
    return { txt:'A chegar', cor:'#c0392b', bg:'#fdeae8' };
  }
  async function _encSetEstado(id, estado){
    const { error } = await sb.from('encomendas').update({ estado: estado }).eq('id', id);
    if(error){ alert('Erro: ' + error.message); return; }
    try{ _encMarcarVisto(id); if(_encAbertaId === id) _encFecharFolha(); }catch(e){}
    try{ _encAvisarCliente(id, estado); }catch(e){}   // avisa o cliente por push (se tiver notificações ativas)
    renderEncomendas();
  }
  // Envia push ao cliente da encomenda quando o estado muda
  async function _encAvisarCliente(id, estado, extra){
    if(['confirmada','pronta','cancelada'].indexOf(estado) < 0) return;
    let ep = '', n = '', enc = null;
    try{
      const { data } = await sb.from('encomendas').select('numero, push_sub, levantamento, itens, total').eq('id', id).maybeSingle();
      enc = data; ep = data && data.push_sub && data.push_sub.endpoint; n = (data && data.numero) ? _encNum(data.numero) : '';
    }catch(e){ return; }
    if(!ep) return;   // o cliente não ativou notificações
    // O telemóvel mostra sempre o nome da app que recebeu o aviso (ex.: "ÀMesa") — por isso o RESTAURANTE vai no título
    const rest = (negocio && negocio.nome) || 'O restaurante';
    const qtd = (enc && Array.isArray(enc.itens)) ? enc.itens.reduce(function(t, it){ return t + (Number(it.qtd) || 1); }, 0) : 0;
    const tot = (enc && Number(enc.total) > 0) ? (Number(enc.total).toFixed(2).replace('.', ',') + ' €') : '';
    const lev = (enc && enc.levantamento) ? _levTxt(enc.levantamento).replace(/<[^>]+>/g, '') : '';
    const resumo = [qtd ? (qtd + (qtd === 1 ? ' artigo' : ' artigos')) : '', tot].filter(Boolean).join(' · ');
    let titulo, corpo, fixa = false;
    if(estado === 'confirmada'){ titulo = '👨‍🍳 ' + rest + ' · nº ' + n + ' aceite!'; corpo = 'Já estamos a preparar a tua encomenda.' + (lev ? (' 🕒 ' + lev.charAt(0).toUpperCase() + lev.slice(1) + '.') : '') + (resumo ? ('\n' + resumo) : ''); }
    else if(estado === 'pronta'){ titulo = '🎉 Está pronta! · ' + rest; corpo = 'A encomenda nº ' + n + ' está à tua espera no balcão. Bom apetite! 🍽️' + (tot ? ('\nA pagar: ' + tot) : ''); fixa = true; }
    else { titulo = '😔 ' + rest + ' · nº ' + n + ' não aceite'; corpo = 'Pedimos desculpa, não conseguimos aceitar esta encomenda.'; }
    if(extra) corpo += (estado === 'cancelada' ? ' Motivo: ' : ' ') + extra;
    if(estado === 'cancelada') corpo += ' Fala connosco se precisares.';
    // foto do restaurante (cabeçalho) como imagem grande do aviso — no Android aparece por baixo do texto
    let foto = '';
    try{ const fs = (negocio && negocio.config && negocio.config.header && negocio.config.header.fotos) || []; const f = fs.find(function(u){ return /^https?:\/\//.test(String(u)) && !/\.(mp4|webm|mov)$/i.test(String(u)); }); if(f) foto = f; }catch(e){}
    try{ await sb.functions.invoke('enviar-push', { body: { negocio: negocio.id, titulo: titulo, corpo: corpo, url: (typeof _linkCardapio === 'function' ? _linkCardapio() : '/'), endpoints: [ep], tag: 'enc-' + id, image: (estado !== 'cancelada' ? foto : ''), fixa: fixa } }); }catch(e){}
  }

  // Classifica um prato como Carne/Peixe por palavras-chave no nome (best-effort; vazio se não reconhecer)
  function _tipoCarnePeixe(nome){
    const s = (nome||'').toLowerCase();
    const peixe = ['peixe','bacalhau','robalo','dourada','polvo','atum','salm','sardinh','pescada','lula','choco','camar','marisco','amêijoa','ameijoa','gamba','sapateira','linguado','cherne','corvina','truta','enguia','raia','tamboril','carapau','faneca','safio','mexilh','lingueir','perceb','lagosta','lavagante','arroz de marisco','cataplana','açorda de marisco'];
    const carne = ['carne','bife','frango','vitela','porco','costel','entrecosto','febra','picanha','alheira','chouri','salsicha','borrego','cabrito','coelho','pato','peru','bitoque','francesinha','hambúrg','hamburg','naco','posta de carne','leitã','leita','secreto','pluma','panado','rojõ','rojo','maminha','picadinho','tornedó','tornedo','feijoada','cozido','dobrada','tripas','moelas','salpic','presunto','bifana'];
    for(let i=0;i<peixe.length;i++){ if(s.indexOf(peixe[i])>=0) return 'Peixe'; }
    for(let i=0;i<carne.length;i++){ if(s.indexOf(carne[i])>=0) return 'Carne'; }
    return '';
  }

  // Exportar as encomendas entregues em PDF — escopo 'dia' (hoje) ou 'mes' (mês atual). Agrega por prato com Carne/Peixe e soma final.
  async function _exportEntreguesPDF(escopo){
    const todas = (_encCache || []).filter(function(e){ return (e.estado||'') === 'entregue'; });   // inclui arquivadas
    const hoje0 = new Date((_encDia || _encHojeIso()) + 'T00:00:00'); const hojeIso = _encIsoDe(hoje0);
    const mesPref = hoje0.getFullYear() + '-' + String(hoje0.getMonth()+1).padStart(2,'0');
    const arr = todas.filter(function(e){
      const iso = _encDiaDe(e);
      return escopo === 'dia' ? (iso === hojeIso) : (iso.indexOf(mesPref) === 0);
    });
    if(!arr.length){ alert('Não há encomendas entregues ' + (escopo === 'dia' ? 'neste dia' : 'neste mês') + '.'); return; }
    const mapa = {}; let totalGeral = 0, qtdGeral = 0;
    arr.forEach(function(e){ (Array.isArray(e.itens)?e.itens:[]).forEach(function(it){
      const nome = (it.nome||'').trim(); if(!nome) return;
      const qtd = Number(it.qtd)||1, preco = Number(it.preco)||0;
      if(!mapa[nome]) mapa[nome] = { tipo:_tipoCarnePeixe(nome), qtd:0, total:0 };
      mapa[nome].qtd += qtd; mapa[nome].total += preco*qtd;
    }); });
    const nomes = Object.keys(mapa).sort(function(a,b){ return a.localeCompare(b); });

      await _carregarJsPDF();
      const JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      const pdf = new JsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const M = 14, W = 210, BOTTOM = 285; let y = 18;
      const eur = function(n){ return Number(n).toFixed(2).replace('.', ',') + ' €'; };
      const ensure = function(h){ if(y + h > BOTTOM){ pdf.addPage(); y = 18; } };
      pdf.setFont('helvetica','bold'); pdf.setFontSize(16); pdf.setTextColor(58,44,24);
      pdf.text((negocio && negocio.nome) || 'Encomendas', M, y); y += 7;

      const per = (escopo === 'dia') ? ('Dia ' + hoje0.getDate() + ' de ' + MESES[hoje0.getMonth()] + ' ' + hoje0.getFullYear()) : (MESES[hoje0.getMonth()] + ' ' + hoje0.getFullYear());
      pdf.text('Encomendas entregues · ' + per, M, y); y += 6;
      pdf.setFontSize(10); pdf.text(arr.length + ' encomenda(s) entregue(s)', M, y); y += 6;
      // cabeçalho da tabela
      pdf.setDrawColor(205,185,150); pdf.setFillColor(244,238,222); pdf.rect(M, y-4, W-2*M, 8, 'F');
      pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5); pdf.setTextColor(58,44,24);
      pdf.text('Prato', M+2, y+1.5); pdf.text('Tipo', 120, y+1.5); pdf.text('Qtd', 150, y+1.5, {align:'right'}); pdf.text('Total', W-M-2, y+1.5, {align:'right'});
      y += 9;
      pdf.setFont('helvetica','normal'); pdf.setFontSize(10); pdf.setTextColor(40,30,20);
      nomes.forEach(function(n){ const m = mapa[n]; ensure(7); totalGeral += m.total; qtdGeral += m.qtd;
        pdf.text(String(n), M+2, y, { maxWidth: 100 });
        pdf.setTextColor(120,100,70); pdf.text(m.tipo || '—', 120, y); pdf.setTextColor(40,30,20);
        pdf.text(String(m.qtd), 150, y, {align:'right'});
        pdf.text(eur(m.total), W-M-2, y, {align:'right'});
        y += 6; pdf.setDrawColor(232,224,204); pdf.line(M, y-3.5, W-M, y-3.5);
      });

      pdf.setDrawColor(180,150,90); pdf.line(M, y-3, W-M, y-3);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(11.5); pdf.setTextColor(58,44,24);
      pdf.text('TOTAL', M+2, y+3); pdf.text(String(qtdGeral), 150, y+3, {align:'right'}); pdf.text(eur(totalGeral), W-M-2, y+3, {align:'right'});
      const suf = (escopo === 'dia') ? (hoje0.getFullYear() + String(hoje0.getMonth()+1).padStart(2,'0') + String(hoje0.getDate()).padStart(2,'0')) : mesPref;
      const fich = 'entregues-' + escopo + '-' + suf + '.pdf';

  const _CDNS_JSPDF = [
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
    'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
  ];
  let _jspdfP = null;
  function _temJsPDF(){ return (window.jspdf && window.jspdf.jsPDF) || window.jsPDF; }
  function _carregarJsPDF(){
    if(_jspdfP) return _jspdfP;
    _jspdfP = new Promise(function(resolve, reject){
      if(_temJsPDF()){ resolve(); return; }
      let i = 0;
      (function tentar(){
        if(_temJsPDF()){ resolve(); return; }
        if(i >= _CDNS_JSPDF.length){ reject(new Error('Não foi possível carregar a biblioteca de PDF.')); return; }
        const s = document.createElement('script'); s.src = _CDNS_JSPDF[i++];
        s.onload = function(){ _temJsPDF() ? resolve() : tentar(); }; s.onerror = tentar;
        document.head.appendChild(s);
      })();
    });
    return _jspdfP;
  }
  async function exportarPdf(){
    const btn = $('btnPdf'); const _t = btn.textContent; btn.disabled = true; btn.textContent = 'A gerar PDF...';
    try{
      await _carregarJsPDF();
      const JsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
      const pdf = new JsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
      const mesPrefix = vAno + '-' + String(vMes+1).padStart(2,'0');
      const doMes = reservas.filter(function(r){ return String(r.data).indexOf(mesPrefix) === 0 && r.estado !== 'cancelada'; }).sort(_cmpR);
      const totalPax = doMes.reduce(function(s,r){ return s + (Number(r.pessoas)||0); }, 0);
      const M = 14, W = 210, BOTTOM = 285; let y = 18;
      const ensure = function(h){ if(y + h > BOTTOM){ pdf.addPage(); y = 18; } };
      pdf.setFont('helvetica','bold'); pdf.setFontSize(16); pdf.setTextColor(58,44,24);
      pdf.text((negocio && negocio.nome) || 'Reservas', M, y); y += 7;
      pdf.setFont('helvetica','normal'); pdf.setFontSize(12); pdf.setTextColor(120,110,90);
      pdf.text('Reservas · ' + MESES[vMes] + ' ' + vAno, M, y); y += 6;
      pdf.setFontSize(10);
      pdf.text(doMes.length + ' reserva(s) · ' + totalPax + ' pessoa(s)', M, y); y += 5;
      pdf.setDrawColor(205,185,150); pdf.line(M, y, W - M, y); y += 7;
      if(!doMes.length){ pdf.setTextColor(120,110,90); pdf.text('Sem reservas neste mês.', M, y); }
      let lastDay = null;
      const WD = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
      doMes.forEach(function(r){
        if(r.data !== lastDay){
          lastDay = r.data;
          const d = new Date(r.data+'T00:00:00');
          ensure(12);
          pdf.setFillColor(244,238,222); pdf.rect(M, y - 4, W - 2*M, 8, 'F');
          pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(58,44,24);
          pdf.text(WD[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase(), M + 2, y + 1.5);
          pdf.setFontSize(10); pdf.setTextColor(90,74,40);
          pdf.text(_pessoasDia(r.data) + ' pessoa(s)', W - M - 2, y + 1.5, { align:'right' });
          y += 10;
        }
        ensure(8);
        pdf.setFont('helvetica','bold'); pdf.setFontSize(10); pdf.setTextColor(40,30,20);
        pdf.text(String(r.hora || '—'), M + 2, y);
        pdf.setFont('helvetica','normal'); pdf.setTextColor(40,30,20);
        let linha = (r.nome || '') + '  ·  ' + (Number(r.pessoas)||1) + ' pax';
        if(r.telefone) linha += '  ·  ' + r.telefone;
        pdf.text(linha, M + 18, y, { maxWidth: W - M - 18 - 26 });
        if(r.estado === 'confirmada'){ pdf.setTextColor(46,139,87); } else { pdf.setTextColor(160,110,20); }
        pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
        pdf.text((r.estado || '').toUpperCase(), W - M - 2, y, { align:'right' });
        y += 5;
        if(r.obs){ pdf.setFont('helvetica','italic'); pdf.setFontSize(8.5); pdf.setTextColor(120,100,70); pdf.text('   ' + String(r.obs), M + 18, y, { maxWidth: W - M - 18 }); y += 4; }
        y += 1.5;
      });
      const fich = 'reservas-' + mesPrefix + '.pdf';
      try{ pdf.save(fich); }catch(e){ const nova = window.open(pdf.output('bloburl'), '_blank'); if(!nova) alert('O navegador bloqueou o PDF. Ativa os pop-ups.'); }
    }catch(err){ alert(err.message || 'Não foi possível gerar o PDF.'); }
    finally{ btn.disabled = false; btn.textContent = _t; }
  }

  // ===== Cópia de segurança guardada na app (dentro de config.__bkp) =====
  async function _bkFazer(){
    var msg=$('dfBkMsg'), b=$('dfBkFazer'); if(b) b.disabled=true; if(msg){ msg.textContent='A guardar cópia...'; msg.className='msg'; }
    try{
      var sel=await sb.from('negocios').select('config').eq('id',negocio.id).maybeSingle();
      if(sel.error) throw sel.error;
      var cfg=(sel.data&&sel.data.config)||{};
      var snap=JSON.parse(JSON.stringify(cfg)); delete snap.__bkp;   // não guardar cópia dentro da cópia
      cfg.__bkp={ ts:new Date().toISOString(), config:snap };
      var up=await _updNeg(cfg);
      if(up.error) throw up.error;
      negocio.config=cfg;
      if(msg){ msg.textContent='Cópia de segurança guardada ✓ ('+new Date(cfg.__bkp.ts).toLocaleString('pt-PT')+')'; msg.className='msg'; }
      renderDefinicoes();
    }catch(e){ if(b) b.disabled=false; if(msg){ msg.textContent='Erro ao guardar cópia: '+(e.message||e); msg.className='msg erro'; } }
  }
  async function _bkRepor(){
    var msg=$('dfBkMsg');
    try{
      var sel=await sb.from('negocios').select('config').eq('id',negocio.id).maybeSingle();
      if(sel.error) throw sel.error;
      var cfg=(sel.data&&sel.data.config)||{};
      var bk=cfg.__bkp;
      if(!bk||!bk.config){ if(msg){ msg.textContent='Ainda não há cópia guardada.'; msg.className='msg erro'; } return; }
      var quando = bk.ts ? new Date(bk.ts).toLocaleString('pt-PT') : '';
      if(!(await window.__amConfirm('Confirmar',{texto:'Repor todas as definições da cópia de '+quando+'?\n\nSubstitui as definições atuais. As reservas e encomendas já feitas não são afetadas.', ok:'Sim', cancelar:'Não'}))) return;
      var nova=JSON.parse(JSON.stringify(bk.config));
      nova.__bkp=cfg.__bkp;   // manter a cópia para poderes repor de novo
      var up=await _updNeg(nova);
      if(up.error) throw up.error;
      negocio.config=nova;
      if(msg){ msg.textContent='Definições repostas da cópia de '+quando+' ✓'; msg.className='msg'; }
      renderDefinicoes(); renderCal();
    }catch(e){ if(msg){ msg.textContent='Erro ao repor: '+(e.message||e); msg.className='msg erro'; } }
  }

      }
      if(!cfgNova) throw new Error('ficheiro inválido');

  function renderCal(){
    $('mesNome').textContent = MESES[vMes] + ' ' + vAno;
    const primeiro = new Date(vAno, vMes, 1);
    const arranque = (primeiro.getDay() + 6) % 7;   // segunda = 0
    const dias = new Date(vAno, vMes+1, 0).getDate();
    const hojeIso = isoLocal(hoje);
    let html = '';
    for(let i=0;i<arranque;i++) html += '<div class="dia vazio"></div>';
    for(let d=1; d<=dias; d++){
      const iso = vAno + '-' + String(vMes+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const rs = (porDia[iso] || []).filter(function(r){ return r.estado !== 'cancelada'; });
      const nPend = rs.filter(function(r){ return r.estado==='pendente'; }).length;
      const nConf = rs.filter(function(r){ return r.estado==='confirmada'; }).length;
      const temPromo = !!_prResolver(_prLista(), iso);
      const fer = _feriado(iso) || _ferMunicipal(iso);
      const fechado = _encerrado(iso);
      const wd = new Date(iso+'T00:00:00').getDay();
      let cls = 'dia';
      if(fer) cls += ' feriado';
      if(fechado) cls += ' fechado';
      if(wd===0 || wd===6) cls += ' fds';
      if(iso < hojeIso) cls += ' passado';
      else if(iso > hojeIso) cls += ' futuro';
      if(rs.length) cls += ' tem';
      if(nConf) cls += ' tem-conf'; else if(nPend) cls += ' tem-pend';
      if(iso===hojeIso) cls += ' hoje';
      if(iso===diaSel) cls += ' sel';
      let bar = '';
      if(nPend) bar += '<i class="pend"></i>';
      if(nConf) bar += '<i class="conf"></i>';
      const _ttl = fechado ? ' title="Encerrado"' : (fer ? (' title="Feriado: '+esc(fer)+'"') : '');
      html += '<div class="'+cls+'" data-dia="'+iso+'"'+_ttl+'>'
            + (temPromo ? '<span class="promo-tag">🏷️</span>' : '')
            + (fer ? '<span class="fer-tag">★</span>' : '')
            + (fechado ? '<span class="fechado-tag">🔒</span>' : '')
            + '<span class="num">'+d+'</span>'
            + '<span class="bar">'+bar+'</span></div>';
    }
    $('grid').innerHTML = html;
    $('grid').querySelectorAll('.dia:not(.vazio)').forEach(function(el){ el.onclick = function(){
      const g = $('grid');
      const prev = g.querySelector('.dia.sel'); if(prev && prev !== el) prev.classList.remove('sel');
      el.classList.add('sel');
      diaSel = el.getAttribute('data-dia');
      renderDia(diaSel);
    }; });
  }

    const casa = (negocio && negocio.nome) ? negocio.nome : 'o restaurante';
    // link para o cliente gerir (alterar/cancelar) a reserva dele
    let _gerir = '';
    try{ if(SLUG){ _gerir = '\nGerir a tua reserva (alterar ou cancelar): ' + location.origin + '/cardapio.html?n=' + SLUG + '&rgerir=1' + (r.id ? ('&rid=' + encodeURIComponent(r.id)) : '') + '&rn=' + encodeURIComponent(nome) + '&rd=' + (r.data||'') + '&rh=' + encodeURIComponent(r.hora||'') + '&rp=' + (Number(r.pessoas)||1); } }catch(e){}
    let msg;

      msg = 'Olá' + (nome ? ' '+nome : '') + '! A sua reserva em ' + casa + ' para ' + quando + ' (' + pessoas + ') está confirmada. Até já! 🍽️' + _gerir;
    } else if(tipo==='pendente'){
      msg = 'Olá' + (nome ? ' '+nome : '') + '! Recebemos o seu pedido de reserva em ' + casa + ' para ' + quando + ' (' + pessoas + '). Confirmamos em breve. Obrigado!' + _gerir;
    } else if(tipo==='proposta'){
      msg = 'Olá' + (nome ? ' '+nome : '') + '! Para a sua reserva em ' + casa + ' (' + quando + ', ' + pessoas + ') conseguimos: ' + (extra || '') + '. Diga-nos se lhe serve.' + _gerir;
    } else if(tipo==='altnao'){
      msg = 'Olá' + (nome ? ' '+nome : '') + '! Infelizmente não conseguimos alterar a sua reserva em ' + casa + '. Mantém-se ' + quando + ' (' + pessoas + ').' + _gerir;

      // O CLIENTE pediu para cancelar e o restaurante aceitou
      msg = 'Olá' + (nome ? ' '+nome : '') + '! O seu cancelamento da reserva em ' + casa + ' para ' + quando + ' foi aceite. Obrigado por avisar — até uma próxima! 👋';

      msg = 'Olá' + (nome ? ' '+nome : '') + '. Lamentamos, mas não conseguimos confirmar a sua reserva em ' + casa + ' para ' + quando + '. Contacte-nos para encontrarmos uma alternativa.';
    }

  }
  // Avisar o cliente por WhatsApp a QUALQUER momento (mensagem conforme o estado atual da reserva)
  function _avisarCliente(r){
    if(!r){ return; }
    const tipo = (r.estado==='confirmada') ? 'confirmar' : (r.estado==='cancelada' ? 'recusar' : 'pendente');
    const url = _waUrl(r, tipo);

  // Pedido de cancelamento vindo do cliente (link &canc=1): mostra "Cliente X quer cancelar a reserva Y"

  async function _pedidoCancelamento(r){
    if(!r) return;

    var nome = (r.nome || 'O cliente').trim();
    var sim = await window.__amConfirm('Pedido de cancelamento', {
      texto: nome + ' quer cancelar a reserva de ' + quando + ' (' + (Number(r.pessoas)||1) + ' pessoa(s)).\n\nAceitar o cancelamento e avisar o cliente?',
      ok: 'Aceitar e avisar', cancelar: 'Agora não'

    if(error){ alert('Erro: ' + error.message); if(win){ try{ win.close(); }catch(e){} } return; }

  // ============================================================
  // RESPOSTAS RÁPIDAS (reservas normais): a resposta fica na ÀMesa e o cliente recebe uma notificação.

  function _eGrupo(r){ return /^Menu:/i.test(String((r && r.obs) || '').trim()); }
  function _quandoR(r, hora){ const d = new Date(r.data+'T00:00:00'); const h = hora || r.hora; return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) + (h ? (' às ' + h) : ''); }
  function _casa(){ return (negocio && negocio.nome) ? negocio.nome : 'O restaurante'; }
  function _infoResposta(r){
    let h = '';
    if(r.alt_hora || r.alt_pessoas){
      const mud = [];
      if(r.alt_hora && r.alt_hora !== r.hora) mud.push('hora: das <b>' + esc(r.hora||'?') + '</b> para as <b>' + esc(r.alt_hora) + '</b>');

    if(r.resposta_cliente === 'aceitou') h += '<div class="r-info ok">✅ O cliente aceitou a proposta</div>';
    else if(r.resposta_cliente === 'recusou') h += '<div class="r-info no">❌ O cliente não aceitou a proposta</div>';

  }
  function _toastR(t){ let el = $('rsToast'); if(!el){ el = document.createElement('div'); el.id = 'rsToast'; document.body.appendChild(el); } el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 3200); }
  async function _pushCliente(r, titulo, corpo){
    if(!r || !r.push_endpoint) return false;
    try{
      const res = await sb.functions.invoke('enviar-push', { body:{ negocio:negocio.id, titulo:titulo, corpo:corpo, url: location.origin + '/cardapio.html?n=' + encodeURIComponent(SLUG) + '&rver=' + encodeURIComponent(r.id), endpoints:[r.push_endpoint], tag:'res-' + r.id } });
      return !!(res && !res.error && res.data && res.data.enviados > 0);

  // Depois de responder: se o cliente não tem notificações, oferece o WhatsApp (último recurso)
  async function _depoisResposta(r, enviado, tipoWa, extra){
    if(enviado){ _toastR('✓ Cliente avisado por notificação'); return; }

  }
  function _erroColunas(error){ const m = String((error && error.message) || error || ''); return /column|coluna|proposta|nota|alt_|donos_push|dono_push/i.test(m) ? 'Falta correr no Supabase o ficheiro reservas-respostas.sql.' : ('Erro: ' + m); }
  // Respostas (confirmar / sem disponibilidade / proposta / alteração)
  async function _resp(r, tipo, o){
    o = o || {};

    let patch, titulo, corpo, tipoWa, extra = '';
    const casa = _casa();
    if(tipo === 'confirmar'){
      patch = { estado:'confirmada', proposta_hora:null, proposta_pessoas:null };
      titulo = '✅ Reserva confirmada'; corpo = casa + ': ' + _quandoR(r) + ' · ' + (Number(r.pessoas)||1) + ' pessoa(s). Até já!';
      tipoWa = 'confirmar';
    } else if(tipo === 'cancelar'){
      patch = { estado:'cancelada', proposta_hora:null, proposta_pessoas:null };
      titulo = '❌ Sem disponibilidade'; corpo = casa + ' não tem mesa para ' + _quandoR(r) + '. Pedimos desculpa.';
      tipoWa = 'recusar';
    } else if(tipo === 'proposta'){
      const h = o.hora || null, p = o.pessoas ? Math.max(1, parseInt(o.pessoas, 10) || 1) : null;
      if(!h && !p) return;
      patch = { estado:'pendente', proposta_hora:h, proposta_pessoas:p };
      const oq = (p ? (p + ' pessoa(s)') : '') + (h ? ((p ? ' ' : '') + 'às ' + h) : '');
      titulo = '🕘 ' + casa + ' propõe outra opção'; corpo = 'Para ' + _quandoR(r) + ' conseguimos: ' + oq + '. Toca para aceitar ou recusar.';
      tipoWa = 'proposta'; extra = oq;
    } else if(tipo === 'altok'){
      const nh = r.alt_hora || r.hora, np = r.alt_pessoas || r.pessoas;
      patch = { estado:'confirmada', hora:nh, pessoas:np, alt_hora:null, alt_pessoas:null, proposta_hora:null, proposta_pessoas:null };
      titulo = '✅ Alteração aceite'; corpo = casa + ': ' + _quandoR(r, nh) + ' · ' + (Number(np)||1) + ' pessoa(s). Até já!';
      tipoWa = 'confirmar';
    } else if(tipo === 'altnao'){
      patch = { alt_hora:null, alt_pessoas:null };
      titulo = '❌ Não foi possível alterar'; corpo = casa + ': mantém-se ' + _quandoR(r) + ' · ' + (Number(r.pessoas)||1) + ' pessoa(s).';
      tipoWa = 'altnao';
    } else return;
    if(o.nota !== undefined) patch.nota = nota;
    const notaFinal = (o.nota !== undefined) ? nota : r.nota;
    if(notaFinal && tipo !== 'altnao') corpo += ' Nota: ' + notaFinal;
    _toastR('A guardar…');
    const { error } = await sb.from('reservas').update(patch).eq('id', r.id);
    if(error){ alert(_erroColunas(error)); return; }
    const novo = Object.assign({}, r, patch);
    carregar();   // a Gestão atualiza logo; o aviso ao cliente segue a seguir
    _toastR(novo.push_endpoint ? 'Guardado ✓ — a avisar o cliente…' : 'Guardado ✓');
    const enviado = await Promise.race([_pushCliente(novo, titulo, corpo), new Promise(function(ok){ setTimeout(function(){ ok(false); }, 10000); })]);
    await _depoisResposta(novo, enviado, tipoWa, extra);
  }
  // Janela "Responder ao cliente"
  function _responder(r){
    if(!r) return;
    let ov = $('rsModal'); if(ov) ov.remove();
    ov = document.createElement('div'); ov.id = 'rsModal'; ov.className = 'modal-bg';
    ov.innerHTML = '<div class="modal"><button class="fechar" id="rsFechar" type="button" aria-label="Fechar">✕</button>'
      + '<h3>Responder ao cliente</h3>'
      + '<div class="ap-card"><div class="ap-hora">' + esc(_quandoR(r)) + ' · ' + (Number(r.pessoas)||1) + ' pessoa(s)</div><div class="ap-nome">' + esc(r.nome||'') + '</div></div>'
      + '<div style="font-size:.8rem;color:#8a7a5c;margin:6px 0 2px;">' + (r.push_endpoint ? '🔔 O cliente recebe a resposta por notificação.' : 'O cliente vê a resposta quando abrir o menu (não tem notificações ligadas).') + '</div>'
      + (r.estado !== 'confirmada' ? '<button type="button" class="rs-op ok" data-rs="confirmar">✅ Confirmar</button>' : '')
      + '<button type="button" class="rs-op" data-rs="hora">🕘 Propor outra hora</button>'
      + '<div class="rs-sub" id="rsSubHora"><input type="time" id="rsHora" value="' + esc(r.hora||'') + '"><button type="button" data-rs="envHora">Enviar proposta</button></div>'
      + '<button type="button" class="rs-op" data-rs="pessoas">👥 Propor nº de pessoas</button>'
      + '<div class="rs-sub" id="rsSubPes"><input type="number" min="1" id="rsPes" value="' + (Number(r.pessoas)||1) + '"><button type="button" data-rs="envPes">Enviar proposta</button></div>'
      + (r.estado !== 'cancelada' ? '<button type="button" class="rs-op no" data-rs="cancelar">❌ Sem disponibilidade</button>' : '')
      + '<label style="display:block;margin-top:12px;font-size:.82rem;font-weight:700;">📝 Nota para o cliente <span style="font-weight:400;color:#8a7a5c;">(opcional — vai com a resposta)</span></label>'
      + '<textarea id="rsNota" rows="2" maxlength="200" placeholder="Ex.: Ficam na esplanada · Tragam o cartão de fidelidade">' + esc(r.nota||'') + '</textarea>'
      + '<button type="button" class="rs-wa" data-rs="wa">📲 Último recurso: falar por WhatsApp</button>'
      + '</div>';
    document.body.appendChild(ov); document.body.style.overflow = 'hidden';
    const fechar = function(){ ov.remove(); document.body.style.overflow = ''; };
    $('rsFechar').onclick = fechar;
    ov.addEventListener('click', function(e){ if(e.target === ov) fechar(); });
    ov.querySelectorAll('[data-rs]').forEach(function(b){ b.onclick = async function(){
      const k = b.getAttribute('data-rs'), nota = $('rsNota').value;
      if(k === 'hora'){ $('rsSubHora').style.display = 'flex'; $('rsSubPes').style.display = 'none'; $('rsHora').focus(); return; }
      if(k === 'pessoas'){ $('rsSubPes').style.display = 'flex'; $('rsSubHora').style.display = 'none'; $('rsPes').focus(); return; }
      if(k === 'wa'){ _avisarCliente(r); return; }
      if(k === 'cancelar' && !(await window.__amConfirm('Sem disponibilidade', { texto:'Recusar esta reserva? O cliente é avisado.', ok:'Sim, recusar', cancelar:'Não' }))) return;
      const o = { nota:nota };
      if(k === 'envHora'){ if(!$('rsHora').value){ $('rsHora').focus(); return; } o.hora = $('rsHora').value; }
      if(k === 'envPes'){ o.pessoas = $('rsPes').value; }
      fechar();
      await _resp(r, (k === 'envHora' || k === 'envPes') ? 'proposta' : k, o);
    }; });
  }

  // ---- avisos de reservas para o dono (notificações neste telemóvel) ----
  const _VAPID_PUB = 'BOXUnQlON7ETx2-D9E9A3nPONd4xdujOUp2UFFpMGe_0V00njcbxAL-4ETDVpHG7s68Jz1tARbDJ83X75-2irg4';
  function _b64u8(b){ const pad = '='.repeat((4 - b.length % 4) % 4); const raw = atob((b + pad).replace(/-/g,'+').replace(/_/g,'/')); const a = new Uint8Array(raw.length); for(let i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i); return a; }
  function _pushOk(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }

  async function _donoPushAtivo(){
    try{
      if(!_pushOk() || Notification.permission !== 'granted') return false;

  async function _donoPushLigar(){

      if(!_pushOk()){ alert('Este navegador não suporta notificações.'); return false; }

  }
  async function _pintarDonoPush(){
    const c = $('calResumo'); if(!c || !negocio) return;

  }

  // ---- vigia das reservas com a Gestão aberta: som + atualiza quando há novidades ----
  let _resSig = null;
  async function _resVigiar(){
    try{
      if(!negocio || !negocio.id || document.hidden) return;
      const hojeIso = isoLocal(new Date());

      if(error || !data) return;
      const sig = {}; data.forEach(function(r){ sig[r.id] = [r.estado, r.resposta_cliente || '', r.respondido_em || '', r.alt_hora || '', r.alt_pessoas || ''].join('|'); });
      if(_resSig !== null){
        let novidade = false;

          if(antes === undefined && r.estado === 'pendente') novidade = true;                  // pedido novo

          try{ _beep(); if(navigator.vibrate) navigator.vibrate([120,80,120]); }catch(e){}

  document.addEventListener('visibilitychange', function(){ if(!document.hidden) _resVigiar(); });

  async function accao(id, a){
    const r = reservas.find(function(x){ return String(x.id)===String(id); });
    if(a==='avisar'){ _avisarCliente(r); return; }
    if(a==='responder'){ _responder(r); return; }
    if(r && !_eGrupo(r) && (a==='confirmar' || a==='cancelar' || a==='altok' || a==='altnao')){
      if(a==='cancelar' && !(await window.__amConfirm('Sem disponibilidade',{texto:'Recusar esta reserva? O cliente é avisado.', ok:'Sim, recusar', cancelar:'Não'}))) return;
      await _resp(r, a);
      return;
    }
    if(a==='editar'){ abrirEdicao(id); return; }
    if(a==='apagar'){
      if(!(await window.__amConfirm('Confirmar',{texto:'Apagar esta reserva definitivamente? Esta ação não pode ser anulada.', ok:'Sim', cancelar:'Não'}))) return;
      const { error } = await sb.from('reservas').delete().eq('id', id);
      if(error){ alert('Erro: '+error.message); return; }
      carregar();
      return;
    }
    let patch = null, tipo = null;
    if(a==='confirmar'){ patch = { estado:'confirmada' }; tipo = 'confirmar'; }
    else if(a==='cancelar'){ if(!(await window.__amConfirm('Confirmar',{texto:'Recusar/cancelar esta reserva?', ok:'Sim', cancelar:'Não'}))) return; patch = { estado:'cancelada' }; tipo = 'recusar'; }

    const url = r ? _waUrl(r, tipo) : '';
    const win = url ? window.open(url, '_blank') : null;

    if(error){ alert('Erro: '+error.message); if(win){ try{ win.close(); }catch(e){} } return; }
    carregar();
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  iniciar();

    +'<input id="amInput" style="display:none;width:100%;box-sizing:border-box;padding:12px 13px;border:1.5px solid '+L+';border-radius:12px;font-family:inherit;font-size:1rem;color:'+D+';background:#fff;margin-bottom:14px;">'
    +'<div style="display:flex;gap:8px;">'
    +'<button id="amCancel" type="button" style="flex:1;padding:12px;border:1.5px solid '+L+';background:#fff;color:'+D+';border-radius:12px;font-family:inherit;font-weight:700;cursor:pointer;">Cancelar</button>'
    +'<button id="amOk" type="button" style="flex:1;padding:12px;border:none;background:linear-gradient(180deg,'+G+','+GE+');color:#fff;border-radius:12px;font-family:inherit;font-weight:800;cursor:pointer;">OK</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  var card=ov.querySelector('#amCard'),tit=ov.querySelector('#amTit'),msg=ov.querySelector('#amMsg'),inp=ov.querySelector('#amInput'),bOk=ov.querySelector('#amOk'),bC=ov.querySelector('#amCancel');
  var _res=null,_p=false,_hideTimer=null;
  function fechar(v){ ov.style.opacity='0'; card.style.transform='translateY(100%)'; if(_hideTimer) clearTimeout(_hideTimer); _hideTimer=setTimeout(function(){ ov.style.display='none'; _hideTimer=null; },380); var r=_res;_res=null; if(r) r(v); }
  function abrir(){ if(_hideTimer){ clearTimeout(_hideTimer); _hideTimer=null; } ov.style.display='flex'; card.style.transition='none'; card.style.transform='translateY(100%)'; ov.style.opacity='0'; void ov.offsetWidth; card.style.transition='transform .36s cubic-bezier(.2,.9,.3,1)'; requestAnimationFrame(function(){ ov.style.opacity='1'; card.style.transform='translateY(0)'; }); }
  bOk.onclick=function(){ fechar(_p?inp.value:true); };
  bC.onclick=function(){ fechar(_p?null:false); };
  ov.addEventListener('click',function(e){ if(e.target===ov) bC.onclick(); });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); bOk.onclick(); } });
  window.__amConfirm=function(t,o){ o=o||{}; _p=false; tit.textContent=t||'Confirmar'; if(o.html){ msg.innerHTML=o.html; msg.style.display='block'; msg.style.maxHeight='60vh'; msg.style.overflow='auto'; } else { msg.textContent=o.texto||''; msg.style.display=o.texto?'block':'none'; msg.style.maxHeight=''; msg.style.overflow=''; } inp.style.display='none'; bOk.textContent=o.ok||'Sim'; bC.textContent=o.cancelar||'Não'; bC.style.display=(o.cancelar===null)?'none':''; abrir(); return new Promise(function(r){_res=r;}); };
  window.__amPrompt=function(t,o){ o=o||{}; _p=true; tit.textContent=t||''; msg.textContent=o.texto||''; msg.style.display=o.texto?'block':'none'; inp.style.display='block'; inp.value=(o.valor!=null?o.valor:''); inp.placeholder=o.placeholder||''; inp.type=o.tipo||'text'; bOk.textContent=o.ok||'OK'; bC.textContent=o.cancelar||'Cancelar'; abrir(); setTimeout(function(){ try{inp.focus();inp.select();}catch(e){} },80); return new Promise(function(r){_res=r;}); };

<!-- ===== Estilos de Promoção do dia (partilhado: cardápio + calendário) ===== -->
<style>
  .pd-card{ position:relative; font-family:var(--fonte-titulo,"Helvetica Neue",Arial,sans-serif); }
  .pd-card .pd-selo{ display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
  .pd-card .pd-big{ font-weight:900; line-height:1; text-transform:uppercase; }
  .pd-card .pd-msg{ font-weight:700; font-size:.92rem; margin-top:5px; }
  /* 1 · autocolante */
  .pd-autocolante{ background:linear-gradient(135deg,var(--pd-cor2,#ff5a8a),var(--pd-cor,#e0245e)); border:4px solid #fff; border-radius:20px; padding:16px 18px; transform:rotate(-2.4deg); box-shadow:0 14px 26px -6px var(--pd-cor,#e0245e),0 4px 0 rgba(0,0,0,.12); color:#fff; overflow:visible; }
  .pd-autocolante .pd-emoji{ position:absolute; top:-24px; left:-12px; font-size:2.8rem; transform:rotate(-14deg); filter:drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  .pd-autocolante .pd-selo{ background:rgba(255,255,255,.25); padding:3px 9px; border-radius:20px; }
  .pd-autocolante .pd-big{ font-size:calc(2.1rem * var(--pd-escala,1)); margin:6px 0 2px; text-shadow:0 3px 0 rgba(0,0,0,.16); }
  .pd-autocolante .pd-hora{ display:inline-block; margin-top:8px; background:#fff; color:var(--pd-cor,#e0245e); font-weight:800; font-size:.78rem; padding:3px 11px; border-radius:20px; transform:rotate(1.5deg); }
  /* 2 · fita */
  .pd-fita{ position:relative; background:#1e1e24; border-radius:16px; padding:20px 18px; color:#fff; overflow:hidden; }
  .pd-fita::before{ content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--pd-cor2,#7b2ff7),var(--pd-cor,#e0245e)); opacity:.92; }
  .pd-fita > *{ position:relative; }
  .pd-fita .pd-fita-lbl{ display:inline-block; background:#111; color:#fff; font-weight:900; letter-spacing:1px; text-transform:uppercase; font-size:.72rem; padding:5px 14px; transform:skewX(-10deg); box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .pd-fita .pd-big{ font-size:calc(2.3rem * var(--pd-escala,1)); margin:10px 0 2px; }
  .pd-fita .pd-hora{ font-weight:700; font-size:.8rem; opacity:.95; margin-top:6px; display:block; }
  /* 3 · etiqueta */
  .pd-etiqueta{ position:relative; background:linear-gradient(135deg,var(--pd-cor2,#ffb020),var(--pd-cor,#ff7a18)); color:#fff; border-radius:14px; padding:16px 20px 16px 40px; box-shadow:0 10px 22px -6px var(--pd-cor,#ff7a18); overflow:visible; }
  .pd-etiqueta::before{ content:''; position:absolute; left:18px; top:50%; width:16px; height:16px; margin-top:-8px; background:#fff; border-radius:50%; box-shadow:inset 0 0 0 3px rgba(0,0,0,.18); }
  .pd-etiqueta .pd-selo{ opacity:.9; }
  .pd-etiqueta .pd-big{ font-size:calc(2.5rem * var(--pd-escala,1)); margin:2px 0; text-shadow:0 2px 4px rgba(0,0,0,.15); }
  .pd-etiqueta .pd-hora{ display:inline-block; margin-top:6px; background:rgba(0,0,0,.18); font-weight:800; font-size:.78rem; padding:2px 10px; border-radius:20px; }
  /* 4 · cupão */
  .pd-cupao{ position:relative; background:#fff; border:2px dashed var(--pd-cor,#e0245e); border-radius:14px; padding:16px 22px; color:#4a3820; overflow:visible; }
  .pd-cupao::before,.pd-cupao::after{ content:''; position:absolute; top:50%; width:22px; height:22px; margin-top:-11px; background:var(--pd-fundo,#fbf7ef); border-radius:50%; }
  .pd-cupao::before{ left:-13px; } .pd-cupao::after{ right:-13px; }
  .pd-cupao .pd-selo{ color:var(--pd-cor,#e0245e); }
  .pd-cupao .pd-big{ font-size:calc(2rem * var(--pd-escala,1)); color:var(--pd-cor,#e0245e); margin:4px 0 2px; }
  .pd-cupao .pd-msg{ color:#7a6a4c; }
  .pd-cupao .pd-hora{ display:inline-block; margin-top:8px; border:1.5px solid var(--pd-cor,#e0245e); color:var(--pd-cor,#e0245e); font-weight:800; font-size:.76rem; padding:3px 12px; border-radius:6px; }
  /* 5 · néon */
  .pd-neon{ position:relative; background:#0f1020; border:2px solid var(--pd-cor,#19e9ff); border-radius:16px; padding:18px; color:#eafcff; box-shadow:0 0 14px -2px var(--pd-cor,#19e9ff),inset 0 0 16px -4px var(--pd-cor,#19e9ff); }
  .pd-neon .pd-selo{ color:var(--pd-cor,#19e9ff); text-shadow:0 0 8px var(--pd-cor,#19e9ff); }
  .pd-neon .pd-big{ font-size:calc(2.1rem * var(--pd-escala,1)); color:#fff; margin:6px 0 2px; text-shadow:0 0 10px var(--pd-cor,#19e9ff); }
  .pd-neon .pd-msg{ color:#cfe9ef; }
  .pd-neon .pd-hora{ display:inline-block; margin-top:8px; color:var(--pd-cor,#19e9ff); border:1.5px solid var(--pd-cor,#19e9ff); font-weight:800; font-size:.76rem; padding:3px 11px; border-radius:20px; box-shadow:0 0 8px -2px var(--pd-cor,#19e9ff); }
  /* 6 · urgência */
  .pd-urgencia{ position:relative; background:linear-gradient(135deg,var(--pd-cor2,#ff4d2d),var(--pd-cor,#c81d00)); border-radius:16px; padding:16px 18px; color:#fff; overflow:hidden; }
  .pd-urgencia .pd-alerta{ display:inline-flex; align-items:center; gap:7px; background:#ffe100; color:#7a1500; font-weight:900; letter-spacing:1px; text-transform:uppercase; font-size:.72rem; padding:4px 12px; border-radius:20px; }
  .pd-urgencia .pd-dot{ width:8px; height:8px; border-radius:50%; background:var(--pd-cor,#c81d00); animation:pdPisca 1s infinite; }
  @keyframes pdPisca{ 0%,100%{opacity:1;}50%{opacity:.25;} }
  .pd-urgencia .pd-big{ font-size:calc(2.2rem * var(--pd-escala,1)); margin:9px 0 2px; }
  .pd-urgencia .pd-hora{ font-weight:800; font-size:.8rem; margin-top:6px; display:inline-block; background:rgba(0,0,0,.2); padding:3px 11px; border-radius:20px; }
  /* 7 · selo redondo */
  .pd-seloR{ display:flex; align-items:center; gap:16px; background:var(--pd-fundo,#fff7ef); border-radius:16px; padding:14px 18px; }
  .pd-seloR .pd-med{ flex:0 0 auto; width:116px; height:116px; border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--pd-cor2,#ff5a8a),var(--pd-cor,#e0245e)); color:#fff; display:flex; align-items:center; justify-content:center; text-align:center; transform:rotate(-8deg); box-shadow:0 8px 18px -4px var(--pd-cor,#e0245e); border:3px dashed rgba(255,255,255,.75); }
  .pd-seloR .pd-med-v{ font-size:calc(1.7rem * var(--pd-escala,1)); font-weight:900; line-height:1; padding:0 6px; }
  .pd-seloR .pd-med-txt .pd-msg{ color:#4a3820; margin:0; font-size:1.05rem; }
  .pd-seloR .pd-med-txt .pd-hora{ display:inline-block; margin-top:8px; background:var(--pd-cor,#e0245e); color:#fff; font-weight:800; font-size:.74rem; padding:3px 11px; border-radius:20px; }
  /* 8 · oval / pílula */
  .pd-oval{ background:linear-gradient(135deg,var(--pd-cor2,#00b894),var(--pd-cor,#0984e3)); color:#fff; border-radius:999px; padding:24px 34px; text-align:center; box-shadow:0 14px 28px -8px var(--pd-cor,#0984e3); }
  .pd-oval .pd-selo{ opacity:.9; }
  .pd-oval .pd-big{ font-size:calc(2rem * var(--pd-escala,1)); margin:5px 0 2px; text-shadow:0 2px 6px rgba(0,0,0,.18); }
  .pd-oval .pd-hora{ display:inline-block; margin-top:8px; background:rgba(255,255,255,.25); font-weight:800; font-size:.76rem; padding:3px 13px; border-radius:20px; }
  /* Neon à volta (opcional, qualquer estilo) — intensidade por --pd-neonF */
  .pd-card.pd-neon-on{ box-shadow:0 0 calc(9px * var(--pd-neonF,1)) var(--pd-neonCor,#19e9ff), 0 0 calc(26px * var(--pd-neonF,1)) var(--pd-neonCor,#19e9ff) !important; }
  /* ===== Vida & profundidade — só transform/opacity; respeita prefers-reduced-motion ===== */
  .pd-card{ animation:pdEnter .45s ease both; }
  @keyframes pdEnter{ from{opacity:0} to{opacity:1} }
  @keyframes pdBigPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes pdFloatTilt{ 0%,100%{transform:rotate(-2.4deg) translateY(0)} 50%{transform:rotate(-2.4deg) translateY(-5px)} }
  @keyframes pdEmojiWob{ 0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(-5deg) scale(1.06)} }
  @keyframes pdMedBreath{ 0%,100%{transform:rotate(-8deg) scale(1)} 50%{transform:rotate(-8deg) scale(1.05)} }
  @keyframes pdShine{ 0%{transform:translateX(-160%) skewX(-18deg)} 55%,100%{transform:translateX(360%) skewX(-18deg)} }
  @media (prefers-reduced-motion: no-preference){
    .pd-card .pd-big{ transform-origin:left center; animation:pdBigPulse 2.4s ease-in-out infinite; }
    .pd-oval .pd-big{ transform-origin:center; }
    .pd-autocolante{ animation:pdEnter .45s ease both, pdFloatTilt 3.4s ease-in-out .6s infinite; }
    .pd-autocolante .pd-emoji{ animation:pdEmojiWob 2.6s ease-in-out infinite; }
    .pd-seloR .pd-med{ animation:pdMedBreath 2.8s ease-in-out infinite; }
    .pd-fita > *, .pd-urgencia > *{ position:relative; z-index:1; }
    .pd-fita::after, .pd-urgencia::after{ content:''; position:absolute; top:0; left:0; width:38%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); pointer-events:none; z-index:0; animation:pdShine 3.6s ease-in-out infinite; }
  }
  @media (prefers-reduced-motion: reduce){ .pd-card, .pd-card *{ animation:none !important; } }
</style>
<script>
(function(){
  function _lighten(hex, amt){ try{ var h=String(hex).replace('#',''); if(h.length===3) h=h.split('').map(function(c){return c+c;}).join(''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt); return 'rgb('+r+','+g+','+b+')'; }catch(e){ return hex; } }
  function _esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  window.__AM_PROMO_ESTILOS = [
    { id:'autocolante', nome:'Autocolante' }, { id:'fita', nome:'Fita' }, { id:'etiqueta', nome:'Etiqueta' },
    { id:'cupao', nome:'Cupão' }, { id:'neon', nome:'Néon' }, { id:'urgencia', nome:'Urgência' },
    { id:'selo', nome:'Selo redondo' }, { id:'oval', nome:'Oval' }
  ];
  window.__amPromoCard = function(p){
    p = p || {};
    var estilo = p.estilo || 'autocolante';
    var cor = p.cor || '#e0245e';
    var escala = Math.max(0.7, Math.min(1.6, parseFloat(p.escala)||1));
    var vars = '--pd-cor:'+cor+';--pd-cor2:'+_lighten(cor,0.42)+';--pd-escala:'+escala+';';
    var linhas = String(p.texto||'').split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
    var big = _esc(linhas.shift() || 'Promoção');
    var msg = _esc(linhas.join(' '));
    var emoji = _esc((p.emoji && String(p.emoji).trim()) || '🔥');
    var seloP = _esc(String(p.selo || '').trim().slice(0, 28));   // texto do selo escolhido pelo restaurante
    var selo = seloP || 'Promoção de hoje';
    var hora = (p.horaIni && p.horaFim) ? ('🕒 '+_esc(p.horaIni)+' – '+_esc(p.horaFim)) : '';
    var horaH = hora ? '<span class="pd-hora">'+hora+'</span>' : '';
    var msgH = msg ? '<div class="pd-msg">'+msg+'</div>' : '';
    var neonCls = ''; if(p.neon){ vars += '--pd-neonCor:'+(p.neonCor||'#19e9ff')+';--pd-neonF:'+(Math.max(0.3, Math.min(2.5, parseFloat(p.neonForca)||1)))+';'; neonCls = ' pd-neon-on'; }
    function card(cls, inner){ return '<div class="pd-card '+cls+neonCls+'" style="'+vars+'">'+inner+'</div>'; }
    switch(estilo){
      case 'fita':     return card('pd-fita','<span class="pd-fita-lbl">'+selo+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
      case 'etiqueta': return card('pd-etiqueta','<span class="pd-selo">'+selo+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
      case 'cupao':    return card('pd-cupao','<span class="pd-selo">'+(seloP||'Vale de hoje')+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
      case 'neon':     return card('pd-neon','<span class="pd-selo">'+selo+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
      case 'urgencia': return card('pd-urgencia','<span class="pd-alerta"><span class="pd-dot"></span> '+(seloP||'Só hoje')+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
      case 'selo':     return card('pd-seloR','<div class="pd-med"><span class="pd-med-v">'+big+'</span></div><div class="pd-med-txt">'+(msg?('<div class="pd-msg">'+msg+'</div>'):('<div class="pd-msg">'+selo+'</div>'))+horaH+'</div>');
      case 'oval':     return card('pd-oval','<span class="pd-selo">'+selo+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
      default:         return card('pd-autocolante','<span class="pd-emoji">'+emoji+'</span><span class="pd-selo">'+selo+'</span><div class="pd-big">'+big+'</div>'+msgH+horaH);
    }
  };
})();
</script>


<!-- Detetor de versão: se o servidor tiver um ficheiro mais recente do que o carregado (cache iOS/PWA), recarrega uma vez com cache-busting -->
<script>
(function(){
  try{
    if(window.__PREVIEW) return;
    var mine = Date.parse(document.lastModified); if(!mine) return;
    fetch(location.pathname + "?_v=" + Date.now(), { method:"HEAD", cache:"no-store" }).then(function(r){
      var lm = r.headers.get("last-modified"); if(!lm) return;
      var srv = Date.parse(lm); if(!srv) return;
      if(srv - mine > 60000){
        var k = "amVerReload:" + srv;
        try{ if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k, "1"); }catch(e){}
        var q = location.search.replace(/^\?/,"").split("&").filter(function(p){ return p && p.indexOf("_cb=")!==0 && p.indexOf("_v=")!==0; });
        q.push("_cb=" + Date.now());
        location.replace(location.pathname + "?" + q.join("&") + location.hash);
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>

<!-- Caixa preta: regista erros JS não tratados na tabela "erros" (máx. 5 por sessão, sem repetidos, sem ruído) -->
<script>
(function(){
  var MAX = 5, n = 0, vistos = {};
  function cli(){ try{ if(typeof sbC!=="undefined" && sbC) return sbC; }catch(e){} try{ if(typeof sb!=="undefined" && sb) return sb; }catch(e){} try{ if(typeof sbc!=="undefined" && sbc) return sbc; }catch(e){} return null; }
  function slug(){ try{ return (new URLSearchParams(location.search).get("n")) || (typeof SLUG!=="undefined" ? (SLUG||"") : "") || ""; }catch(e){ return ""; } }
  function reg(msg, stack){
    try{
      if(!msg) return; msg = String(msg).slice(0,500);
      if(/ResizeObserver|^Script error\.?$|Load failed|NetworkError|AbortError|The operation was aborted/i.test(msg)) return;
      var k = msg.slice(0,120); if(vistos[k]) return; vistos[k] = 1;
      if(n++ >= MAX) return;
      var c = cli(); if(!c || !c.from) return;
      c.from("erros").insert({ slug: slug().slice(0,80), pagina: (location.pathname.split("/").pop()||"").slice(0,80), mensagem: msg, stack: String(stack||"").slice(0,2000), url: location.href.slice(0,300), agente: navigator.userAgent.slice(0,200) }).then(function(){}, function(){});
    }catch(e){}
  }
  window.addEventListener("error", function(e){ reg(e.message || (e.error && e.error.message), e.error && e.error.stack); });
  window.addEventListener("unhandledrejection", function(e){ var r = e && e.reason; reg((r && r.message) || String(r), r && r.stack); });
  window.__amErro = reg;   // para registar erros manualmente: window.__amErro("mensagem")
})();
</script>
