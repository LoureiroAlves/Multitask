<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<script>/* Domínio oficial: se abrir pelo GitHub Pages, salta para o amesadigital.pt */(function(){try{if(/github\.io$/i.test(location.hostname)){location.replace('https://amesadigital.pt'+location.pathname.replace(/^\/Multitask/i,'')+location.search+location.hash);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário de reservas</title>
<style>
  :root{ --castanho:#3a2c18; --dourado:#a8712f; --dourado-escuro:#6b4a1f; --bege:#f5efe2; --bege-claro:#fbf8f2; --linha:#e3d9c4; --verde:#2e9b57; --vermelho:#c0392b; --azul:#2a5aa8; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bege-claro); color:var(--castanho); }
  header.top{ background:linear-gradient(135deg,#5a4423,#3a2c18); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 10px rgba(58,44,24,.25); }
  header.top h1{ font-size:1.1rem; margin:0; }
  header.top button{ background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:.82rem; }
  .wrap{ max-width:760px; margin:0 auto; padding:16px; }
  .card{ background:#fff; border:1px solid var(--linha); border-radius:14px; padding:16px; margin-bottom:14px; }
  input{ width:100%; padding:10px 12px; border:1.5px solid var(--linha); border-radius:9px; font-family:inherit; font-size:.95rem; margin-bottom:9px; }
  label{ font-size:.82rem; font-weight:600; color:var(--dourado-escuro); display:block; margin:6px 0 4px; }
  button.acao{ background:var(--dourado); color:#fff; border:none; border-radius:10px; padding:11px 16px; font-weight:700; cursor:pointer; }
  .msg{ font-size:.85rem; margin-top:8px; } .msg.erro{ color:var(--vermelho); }
  .hide{ display:none; }

  /* Barra do mês */
  .mes-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .mes-bar button{ background:#fff; border:1px solid var(--linha); border-radius:9px; width:40px; height:40px; font-size:1.2rem; cursor:pointer; color:var(--castanho); }
  .mes-bar .mes-nome{ font-weight:800; font-size:1.05rem; text-transform:capitalize; }

  /* Grelha do calendário */
  .cal{ background:#fff; border:1px solid var(--linha); border-radius:14px; padding:10px; }
  .cal-cab, .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cab{ margin-bottom:6px; }
  .cal-cab div{ text-align:center; font-size:.74rem; font-weight:800; color:#fff; padding:6px 0; border-radius:8px; background:var(--dourado); letter-spacing:.3px; }
  .cal-cab div:nth-child(6){ background:#c8702f; }   /* Sábado */
  .cal-cab div:nth-child(7){ background:#b0532e; }   /* Domingo */
  .dia{ position:relative; aspect-ratio:1/1; border:1.5px solid transparent; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.92rem; cursor:default; background:#faf6ee; transition:transform .06s ease; }
  .dia.vazio{ background:transparent; }
  .dia.fds{ background:#fbeee2; }                                  /* fim de semana */
  .dia.fds .num{ color:#b0532e; font-weight:700; }
  .dia.tem{ cursor:pointer; border-color:var(--linha); }
  .dia.tem:active{ transform:scale(.96); }
  .dia.tem-pend{ background:#fdf0cf; border-color:#e7c877; }       /* dia com pendentes */
  .dia.tem-conf{ background:#dff3e6; border-color:#8fd3aa; }       /* dia com confirmadas */
  .dia.hoje{ outline:2.5px solid var(--dourado); outline-offset:-2px; }
  .dia.sel{ background:var(--castanho); color:#fff; border-color:var(--castanho); box-shadow:0 4px 12px rgba(58,44,24,.3); }
  .dia.sel .num{ color:#fff; }
  .dia .num{ line-height:1; font-weight:600; }
  .dia .pts{ display:flex; gap:3px; margin-top:4px; height:7px; align-items:center; }
  .dia .pt{ width:8px; height:8px; border-radius:50%; }
  .pt.pend{ background:var(--dourado); }
  .pt.conf{ background:var(--verde); }
  .dia.sel .pt.pend{ background:#f2c879; } .dia.sel .pt.conf{ background:#7ed3a1; }
  .dia .cnt{ position:absolute; top:3px; right:6px; font-size:.62rem; font-weight:800; color:#a86b2c; }
  .dia.tem-conf .cnt{ color:#2e9b57; }
  .dia .promo-tag{ position:absolute; top:2px; left:4px; font-size:.62rem; line-height:1; }
  .dia.sel .cnt{ color:#f0e3c8; }

  .legenda{ display:flex; gap:14px; justify-content:center; margin:10px 0 0; font-size:.76rem; color:#8a7a5c; }
  .legenda span{ display:inline-flex; align-items:center; gap:5px; }
  .legenda i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* Detalhe do dia */
  .r{ border:1px solid var(--linha); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .r.confirmada{ border-left:4px solid var(--verde); }
  .r.pendente{ border-left:4px solid var(--dourado); }
  .r.cancelada{ border-left:4px solid var(--vermelho); opacity:.6; }
  .r-top{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:baseline; }
  .r-quando{ font-weight:800; font-size:1.05rem; }
  .r-nome{ font-size:.95rem; margin-top:2px; }
  .r-meta{ font-size:.82rem; color:#8a7a5c; margin-top:3px; }
  .r-menu{ font-size:.85rem; color:var(--dourado-escuro); margin-top:4px; font-weight:600; }
  .r-acoes{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .r-acoes button, .r-acoes a button{ border:1px solid var(--linha); background:#fff; border-radius:8px; padding:7px 11px; cursor:pointer; font-size:.82rem; }
  .r-acoes button.ok{ color:#fff; background:var(--verde); border-color:var(--verde); }
  .r-acoes button.no{ color:var(--vermelho); border-color:#e8c4bf; }
  .r-acoes button.edit{ color:var(--dourado-escuro); border-color:#e7d8b4; }
  .r-acoes button.del{ color:#8a7a5c; border-color:var(--linha); }
  .pill{ font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:20px; }
  .pill.pendente{ background:#f6ecd6; color:var(--dourado-escuro); }
  .pill.confirmada{ background:#e6f4ea; color:var(--verde); }
  .pill.cancelada{ background:#fbe7e4; color:var(--vermelho); }
  /* Separadores Calendário / Painel */
  .tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab{ flex:1; padding:10px; border:1px solid var(--linha); background:#fff; border-radius:10px; font-weight:800; cursor:pointer; color:#8a7a5c; font-size:.9rem; }
  .tab.ativo{ background:var(--castanho); color:#fff; border-color:var(--castanho); }
  /* Painel (dashboard) */
  .kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  .kpi{ border:1px solid var(--linha); border-radius:12px; padding:14px; background:#fff; }
  .kpi .n{ font-size:1.7rem; font-weight:800; line-height:1; }
  .kpi .l{ font-size:.76rem; color:#8a7a5c; font-weight:700; margin-top:5px; }
  .kpi.pend{ background:#fffaf0; border-color:#e7d8b4; } .kpi.pend .n{ color:var(--dourado-escuro); }
  .kpi.conf .n{ color:var(--verde); }
  .dash-sec{ margin-bottom:18px; }
  .dash-sec h3{ font-size:.95rem; margin:0 0 9px; }
  .linha-r{ display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--linha); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; }
  .linha-r:hover{ background:#fffaf0; }
  .linha-r .quando{ font-weight:800; font-size:.85rem; }
  .linha-r .quem{ font-size:.82rem; color:#5a4c39; margin-top:2px; }
  .vazio-msg{ color:#8a7a5c; font-size:.9rem; }
  /* Pop-up de edição */
  .modal-bg{ position:fixed; inset:0; background:rgba(45,33,17,.5); display:flex; align-items:center; justify-content:center; padding:16px; z-index:60; }
  .modal-bg.hide{ display:none; }
  .modal{ background:#fff; border-radius:16px; padding:18px 18px 16px; width:100%; max-width:420px; max-height:90vh; overflow:auto; box-shadow:0 14px 44px rgba(0,0,0,.28); }
  .modal h3{ margin:0 0 12px; font-size:1.05rem; }
  .modal .fechar{ float:right; border:none; background:none; font-size:1.25rem; cursor:pointer; color:#8a7a5c; line-height:1; padding:0; }
  /* Nova reserva manual */
  .dia:not(.vazio){ cursor:pointer; }
  .nova-btn{ width:100%; border:1.5px dashed var(--dourado); background:#fff; color:var(--dourado-escuro); border-radius:12px; padding:12px; cursor:pointer; font-weight:800; font-size:.92rem; margin-bottom:12px; }
  .nova-btn:hover{ background:#fffaf0; }
  .nova-form{ border:1px solid var(--linha); border-radius:12px; padding:14px; margin-bottom:14px; background:#fffdf8; }
  .nova-form label{ display:block; font-size:.76rem; color:#8a7a5c; font-weight:800; margin:9px 0 3px; }
  .nova-form input, .nova-form select, .nova-form textarea{ width:100%; padding:9px 10px; border:1.5px solid var(--linha); border-radius:8px; font-family:inherit; font-size:.9rem; box-sizing:border-box; background:#fff; }
  .nova-form .lin{ display:flex; gap:8px; } .nova-form .lin > div{ flex:1; }
  .nova-form .acts{ display:flex; gap:8px; margin-top:13px; }
  .nova-form .acts button{ flex:1; border-radius:8px; padding:10px; cursor:pointer; font-weight:800; font-size:.88rem; border:1px solid var(--linha); background:#fff; }
  .nova-form .acts button.guardar{ background:var(--verde); color:#fff; border-color:var(--verde); }
  .promo-btn{ width:100%; border:1.5px dashed #e0245e; background:#fff; color:#c01e50; border-radius:12px; padding:12px; cursor:pointer; font-weight:800; font-size:.92rem; margin-bottom:12px; }
  .promo-btn:hover{ background:#fff5f8; }
</style>
</head>
<body>
<header class="top">
  <h1 id="topTit">Calendário de reservas</h1>
  <button class="hide" id="btnSair">Sair</button>
</header>
<div class="wrap">
  <div class="card" id="loginCard">
    <h2 style="margin:0 0 8px; font-size:1.05rem;">Entrar</h2>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username">
    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">
    <button class="acao" id="btnEntrar">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <div id="painel" class="hide">
    <div class="tabs">
      <button id="tabCal" class="tab ativo" type="button">📅 Calendário</button>
      <button id="tabDash" class="tab" type="button">📊 Painel</button>
    </div>
    <div id="vistaCal">
      <div class="mes-bar">
        <button id="mesPrev" aria-label="Mês anterior">‹</button>
        <div class="mes-nome" id="mesNome"></div>
        <button id="mesNext" aria-label="Mês seguinte">›</button>
      </div>
      <div class="cal">
        <div class="cal-cab"><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div><div>Dom</div></div>
        <div class="cal-grid" id="grid"></div>
      </div>
      <div class="legenda"><span><i style="background:var(--dourado)"></i> Pendente</span><span><i style="background:var(--verde)"></i> Confirmada</span></div>
      <div id="detalhe" style="margin-top:14px;"></div>
    </div>
    <div id="vistaDash" class="hide"></div>
  </div>
</div>

<div id="modalEdit" class="modal-bg hide">
  <div class="modal">
    <button class="fechar" id="mdFechar" type="button" aria-label="Fechar">✕</button>
    <h3>Editar reserva</h3>
    <div class="nova-form" style="border:none; padding:0; background:none; margin:0;">
      <div class="lin"><div><label>Hora</label><input type="time" id="mdHora"></div>
      <div><label>Pessoas</label><input type="number" id="mdPessoas" min="1"></div></div>
      <label>Nome</label><input type="text" id="mdNome">
      <label>Telefone</label><input type="text" id="mdTel" inputmode="tel">
      <label>Menu / notas</label><textarea id="mdObs" rows="2"></textarea>
      <label>Estado</label><select id="mdEstado"><option value="confirmada">Confirmada</option><option value="pendente">Pendente</option><option value="cancelada">Cancelada</option></select>
      <div class="acts"><button id="mdApagar" type="button" style="color:var(--vermelho); border-color:#e8c4bf;">🗑 Apagar</button><button class="guardar" id="mdGuardar" type="button">Guardar</button></div>
      <div class="msg" id="mdMsg" style="margin-top:8px;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPA_URL = 'https://zewiijcrkyxjkhudlplk.supabase.co';
  const SUPA_KEY = 'sb_publishable_6LP7x2v5c-c9DQkQslnUmA_g13SEjp3';
  const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  const SLUG = ((new URLSearchParams(location.search)).get('n') || '').toLowerCase().replace(/[^a-z0-9]/g,'');
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const $ = id => document.getElementById(id);
  let negocio = null, reservas = [], porDia = {};
  const hoje = new Date(); let vAno = hoje.getFullYear(), vMes = hoje.getMonth(), diaSel = null;

  function isoLocal(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  $('btnEntrar').onclick = entrar;
  $('pass').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });
  $('btnSair').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('mesPrev').onclick = () => { vMes--; if(vMes<0){ vMes=11; vAno--; } diaSel=null; $('detalhe').innerHTML=''; renderCal(); };
  $('mesNext').onclick = () => { vMes++; if(vMes>11){ vMes=0; vAno++; } diaSel=null; $('detalhe').innerHTML=''; renderCal(); };
  $('tabCal').onclick = () => mostrarVista('cal');
  $('tabDash').onclick = () => mostrarVista('dash');
  $('mdFechar').onclick = fecharModal;
  $('mdGuardar').onclick = guardarModal;
  $('mdApagar').onclick = apagarModal;
  $('modalEdit').onclick = (e) => { if(e.target === $('modalEdit')) fecharModal(); };

  async function entrar(){
    const email = $('email').value.trim(), pass = $('pass').value;
    if(!email || !pass){ $('loginMsg').textContent='Preenche email e password.'; $('loginMsg').className='msg erro'; return; }
    $('btnEntrar').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password:pass });
    $('btnEntrar').disabled = false;
    if(error){ $('loginMsg').textContent='Erro: '+error.message; $('loginMsg').className='msg erro'; return; }
    iniciar();
  }

  async function iniciar(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return;
    if(!SLUG){ $('loginMsg').textContent='Falta ?n=slug no endereço.'; $('loginMsg').className='msg erro'; return; }
    const { data:neg } = await sb.from('negocios').select('id,nome,slug,config').eq('slug', SLUG).maybeSingle();
    if(!neg){ $('loginMsg').textContent='Negócio não encontrado.'; $('loginMsg').className='msg erro'; return; }
    negocio = neg;
    $('topTit').textContent = 'Reservas · ' + neg.nome;
    $('loginCard').classList.add('hide'); $('painel').classList.remove('hide'); $('btnSair').classList.remove('hide');
    carregar();
  }

  async function carregar(){
    const { data, error } = await sb.from('reservas').select('*').eq('negocio_id', negocio.id).order('hora');
    if(error){ $('detalhe').innerHTML = '<div class="msg erro">Erro: '+error.message+'</div>'; return; }
    reservas = data || [];
    porDia = {};
    reservas.forEach(function(r){ (porDia[r.data] = porDia[r.data] || []).push(r); });
    renderCal();
    if(diaSel) renderDia(diaSel);
    if(!$('vistaDash').classList.contains('hide')) renderDashboard();
  }

  function mostrarVista(qual){
    const cal = (qual === 'cal');
    $('vistaCal').classList.toggle('hide', !cal);
    $('vistaDash').classList.toggle('hide', cal);
    $('tabCal').classList.toggle('ativo', cal);
    $('tabDash').classList.toggle('ativo', !cal);
    if(!cal) renderDashboard();
  }

  function _cmpR(a,b){ return (a.data + (a.hora||'')).localeCompare(b.data + (b.hora||'')); }
  function _kpi(n, l, cls){ return '<div class="kpi '+(cls||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  function _fmtDataCurta(iso){ const d = new Date(iso+'T00:00:00'); return d.getDate() + ' ' + MESES[d.getMonth()].slice(0,3); }
  function _linhaReserva(r){
    return '<div class="linha-r" data-id="'+r.id+'">'
      + '<div><div class="quando">'+_fmtDataCurta(r.data)+' · '+esc(r.hora||'')+'</div>'
      + '<div class="quem">'+esc(r.nome||'')+' · '+(Number(r.pessoas)||1)+' pessoa(s)</div></div>'
      + '<span class="pill '+r.estado+'">'+r.estado+'</span></div>';
  }
  function irParaDia(iso){
    const d = new Date(iso+'T00:00:00');
    vAno = d.getFullYear(); vMes = d.getMonth(); diaSel = iso;
    mostrarVista('cal');
    renderCal(); renderDia(iso);
    const det = $('detalhe'); if(det) det.scrollIntoView({ behavior:'smooth', block:'start' });
  }
  function renderDashboard(){
    const dash = $('vistaDash');
    const hojeIso = isoLocal(hoje);
    const ativas = reservas.filter(function(r){ return r.estado !== 'cancelada'; });
    const futuras = ativas.filter(function(r){ return r.data >= hojeIso; }).sort(_cmpR);
    const futConf = futuras.filter(function(r){ return r.estado === 'confirmada'; });
    const futPend = futuras.filter(function(r){ return r.estado === 'pendente'; });
    const pessoasFut = futConf.reduce(function(s,r){ return s + (Number(r.pessoas)||0); }, 0);
    const hojeR = ativas.filter(function(r){ return r.data === hojeIso; }).sort(_cmpR);

    let html = '<div class="kpis">'
      + _kpi(futuras.length, 'Reservas por vir', '')
      + _kpi(pessoasFut, 'Pessoas esperadas', 'conf')
      + _kpi(futPend.length, 'Por responder', 'pend')
      + _kpi(hojeR.length, 'Reservas hoje', '')
      + '</div>';

    html += '<div class="dash-sec"><h3>⏳ A precisar de resposta</h3>'
      + (futPend.length ? futPend.map(_linhaReserva).join('') : '<div class="vazio-msg">Nada pendente. 👍</div>')
      + '</div>';

    html += '<div class="dash-sec"><h3>📆 Hoje</h3>'
      + (hojeR.length ? hojeR.map(_linhaReserva).join('') : '<div class="vazio-msg">Sem reservas para hoje.</div>')
      + '</div>';

    const prox = futuras.slice(0, 30);
    html += '<div class="dash-sec"><h3>➡️ Próximas reservas</h3>'
      + (prox.length ? prox.map(_linhaReserva).join('') : '<div class="vazio-msg">Sem reservas futuras.</div>')
      + '</div>';

    dash.innerHTML = html;
    dash.querySelectorAll('.linha-r').forEach(function(el){ el.onclick = function(){ abrirModalEdicao(el.getAttribute('data-id')); }; });
  }

  let _mdId = null;
  function abrirModalEdicao(id){
    const r = reservas.find(function(x){ return String(x.id)===String(id); });
    if(!r) return;
    _mdId = id;
    $('mdHora').value = r.hora || '';
    $('mdPessoas').value = Number(r.pessoas)||1;
    $('mdNome').value = r.nome || '';
    $('mdTel').value = r.telefone || '';
    $('mdObs').value = r.obs || '';
    $('mdEstado').value = r.estado || 'pendente';
    $('mdMsg').textContent = ''; $('mdMsg').className = 'msg';
    $('modalEdit').classList.remove('hide');
  }
  function fecharModal(){ $('modalEdit').classList.add('hide'); _mdId = null; }
  async function guardarModal(){
    if(!_mdId) return;
    const nome = ($('mdNome').value||'').trim();
    const tel  = ($('mdTel').value||'').trim();
    const hora = ($('mdHora').value||'').trim();
    const pessoas = Math.max(1, parseInt($('mdPessoas').value,10)||1);
    const obs  = ($('mdObs').value||'').trim();
    const estado = $('mdEstado').value || 'pendente';
    const msg = $('mdMsg');
    if(!nome){ msg.textContent='Falta o nome.'; msg.className='msg erro'; return; }
    if(!hora){ msg.textContent='Falta a hora.'; msg.className='msg erro'; return; }
    const g = $('mdGuardar'); g.disabled = true; msg.textContent='A guardar...'; msg.className='msg';
    const { error } = await sb.from('reservas').update({
      hora: hora, nome: nome, telefone: tel, pessoas: pessoas, obs: obs || null, estado: estado
    }).eq('id', _mdId);
    g.disabled = false;
    if(error){ msg.textContent = 'Erro: ' + error.message; msg.className='msg erro'; return; }
    fecharModal(); carregar();
  }
  async function apagarModal(){
    if(!_mdId) return;
    if(!confirm('Apagar esta reserva definitivamente? Esta ação não pode ser anulada.')) return;
    const { error } = await sb.from('reservas').delete().eq('id', _mdId);
    if(error){ alert('Erro: '+error.message); return; }
    fecharModal(); carregar();
  }

  function renderCal(){
    $('mesNome').textContent = MESES[vMes] + ' ' + vAno;
    const primeiro = new Date(vAno, vMes, 1);
    const arranque = (primeiro.getDay() + 6) % 7;   // segunda = 0
    const dias = new Date(vAno, vMes+1, 0).getDate();
    const hojeIso = isoLocal(hoje);
    let html = '';
    for(let i=0;i<arranque;i++) html += '<div class="dia vazio"></div>';
    for(let d=1; d<=dias; d++){
      const iso = vAno + '-' + String(vMes+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const rs = (porDia[iso] || []).filter(function(r){ return r.estado !== 'cancelada'; });
      const nPend = rs.filter(function(r){ return r.estado==='pendente'; }).length;
      const nConf = rs.filter(function(r){ return r.estado==='confirmada'; }).length;
      const temPromo = !!(((negocio && negocio.config && negocio.config.promoDatas) || {})[iso]);
      const wd = new Date(iso+'T00:00:00').getDay();
      let cls = 'dia';
      if(wd===0 || wd===6) cls += ' fds';
      if(rs.length) cls += ' tem';
      if(nConf) cls += ' tem-conf'; else if(nPend) cls += ' tem-pend';
      if(iso===hojeIso) cls += ' hoje';
      if(iso===diaSel) cls += ' sel';
      let pts = '';
      if(nPend) pts += '<span class="pt pend"></span>';
      if(nConf) pts += '<span class="pt conf"></span>';
      html += '<div class="'+cls+'" data-dia="'+iso+'">'
            + (temPromo ? '<span class="promo-tag">🏷️</span>' : '')
            + (rs.length ? '<span class="cnt">'+rs.length+'</span>' : '')
            + '<span class="num">'+d+'</span>'
            + '<span class="pts">'+pts+'</span></div>';
    }
    $('grid').innerHTML = html;
    $('grid').querySelectorAll('.dia:not(.vazio)').forEach(function(el){ el.onclick = function(){ diaSel = el.getAttribute('data-dia'); renderCal(); renderDia(diaSel); }; });
  }

  function _formNovaHTML(){
    return '<div class="nova-form hide" id="novaForm">'
      + '<div class="lin"><div><label>Hora</label><input type="time" id="nvHora" value="20:00"></div>'
      + '<div><label>Pessoas</label><input type="number" id="nvPessoas" min="1" value="2"></div></div>'
      + '<label>Nome</label><input type="text" id="nvNome" placeholder="Nome do cliente">'
      + '<label>Telefone</label><input type="text" id="nvTel" placeholder="ex: 912 345 678" inputmode="tel">'
      + '<label>Menu / notas (opcional)</label><textarea id="nvObs" rows="2" placeholder="ex: 8× Menu 1"></textarea>'
      + '<label>Estado</label><select id="nvEstado"><option value="confirmada">Confirmada</option><option value="pendente">Pendente</option></select>'
      + '<div class="acts"><button id="nvCancelar" type="button">Cancelar</button><button class="guardar" id="nvGuardar" type="button">Guardar reserva</button></div>'
      + '<div class="msg" id="nvMsg" style="margin-top:8px;"></div>'
      + '</div>';
  }
  function _wireNova(iso){
    const btn = $('btnNova'), form = $('novaForm');
    if(btn && form) btn.onclick = function(){ form.classList.toggle('hide'); if(!form.classList.contains('hide')){ var n=$('nvNome'); if(n) n.focus(); } };
    const c = $('nvCancelar'); if(c) c.onclick = function(){ if(form) form.classList.add('hide'); };
    const g = $('nvGuardar'); if(g) g.onclick = function(){ guardarNova(iso); };
  }
  async function guardarNova(iso){
    const nome = ($('nvNome').value||'').trim();
    const tel  = ($('nvTel').value||'').trim();
    const hora = ($('nvHora').value||'').trim();
    const pessoas = Math.max(1, parseInt($('nvPessoas').value,10)||1);
    const obs  = ($('nvObs').value||'').trim();
    const estado = $('nvEstado').value || 'confirmada';
    const msg = $('nvMsg');
    if(!nome){ msg.textContent='Falta o nome.'; msg.className='msg erro'; return; }
    if(!hora){ msg.textContent='Falta a hora.'; msg.className='msg erro'; return; }
    const g = $('nvGuardar'); g.disabled = true; msg.textContent='A guardar...'; msg.className='msg';
    const { error } = await sb.from('reservas').insert({
      negocio_id: negocio.id, data: iso, hora: hora, nome: nome,
      telefone: tel, pessoas: pessoas, obs: obs || null, estado: estado
    });
    g.disabled = false;
    if(error){ msg.textContent = 'Erro: ' + error.message; msg.className='msg erro'; return; }
    carregar();
  }

  function _formEditarHTML(r){
    const est = r.estado || 'pendente';
    const sel = function(v){ return est===v ? ' selected' : ''; };
    return '<div class="card"><div style="font-weight:800; margin-bottom:10px;">Editar reserva</div>'
      + '<div class="nova-form">'
      + '<div class="lin"><div><label>Hora</label><input type="time" id="edHora" value="'+esc(r.hora||'')+'"></div>'
      + '<div><label>Pessoas</label><input type="number" id="edPessoas" min="1" value="'+(Number(r.pessoas)||1)+'"></div></div>'
      + '<label>Nome</label><input type="text" id="edNome" value="'+esc(r.nome||'')+'">'
      + '<label>Telefone</label><input type="text" id="edTel" value="'+esc(r.telefone||'')+'" inputmode="tel">'
      + '<label>Menu / notas</label><textarea id="edObs" rows="2">'+esc(r.obs||'')+'</textarea>'
      + '<label>Estado</label><select id="edEstado"><option value="confirmada"'+sel('confirmada')+'>Confirmada</option><option value="pendente"'+sel('pendente')+'>Pendente</option><option value="cancelada"'+sel('cancelada')+'>Cancelada</option></select>'
      + '<div class="acts"><button id="edVoltar" type="button">Voltar</button><button class="guardar" id="edGuardar" type="button">Guardar alterações</button></div>'
      + '<div class="msg" id="edMsg" style="margin-top:8px;"></div>'
      + '</div></div>';
  }
  function abrirEdicao(id){
    const r = reservas.find(function(x){ return String(x.id)===String(id); });
    if(!r) return;
    $('detalhe').innerHTML = _formEditarHTML(r);
    $('edVoltar').onclick = function(){ renderDia(diaSel); };
    $('edGuardar').onclick = function(){ guardarEdicao(id); };
  }
  async function guardarEdicao(id){
    const nome = ($('edNome').value||'').trim();
    const tel  = ($('edTel').value||'').trim();
    const hora = ($('edHora').value||'').trim();
    const pessoas = Math.max(1, parseInt($('edPessoas').value,10)||1);
    const obs  = ($('edObs').value||'').trim();
    const estado = $('edEstado').value || 'pendente';
    const msg = $('edMsg');
    if(!nome){ msg.textContent='Falta o nome.'; msg.className='msg erro'; return; }
    if(!hora){ msg.textContent='Falta a hora.'; msg.className='msg erro'; return; }
    const g = $('edGuardar'); g.disabled = true; msg.textContent='A guardar...'; msg.className='msg';
    const { error } = await sb.from('reservas').update({
      hora: hora, nome: nome, telefone: tel, pessoas: pessoas, obs: obs || null, estado: estado
    }).eq('id', id);
    g.disabled = false;
    if(error){ msg.textContent = 'Erro: ' + error.message; msg.className='msg erro'; return; }
    carregar();
  }

  function renderDia(iso){
    const d = new Date(iso + 'T00:00:00');
    const rs = (porDia[iso] || []).slice().sort(function(a,b){ return (a.hora||'').localeCompare(b.hora||''); });
    let html = '<div class="card"><div style="font-weight:800; margin-bottom:10px; text-transform:capitalize;">'+d.getDate()+' de '+MESES[d.getMonth()].toLowerCase()+'</div>';
    html += '<button class="nova-btn" id="btnNova" type="button">➕ Nova reserva</button>' + _formNovaHTML();
    html += _promoDoDiaHTML(iso);
    if(!rs.length) html += '<div style="color:#8a7a5c; font-size:.9rem;">Sem reservas neste dia.</div>';
    html += '</div>';
    rs.forEach(function(r){
      let acoes = '';
      if(r.estado!=='confirmada') acoes += '<button class="ok" data-a="confirmar" data-id="'+r.id+'">✔ Confirmar</button>';
      if(r.estado!=='cancelada') acoes += '<button class="no" data-a="cancelar" data-id="'+r.id+'">✕ Recusar</button>';
      acoes += '<a href="tel:'+esc(r.telefone||'')+'"><button>📞 Ligar</button></a>';
      acoes += '<button class="edit" data-a="editar" data-id="'+r.id+'">✏️ Editar</button>';
      acoes += '<button class="del" data-a="apagar" data-id="'+r.id+'">🗑 Apagar</button>';
      const menu = r.obs ? ('<div class="r-menu">🍽 '+esc(r.obs)+'</div>') : '';
      html += '<div class="r '+r.estado+'">'
        + '<div class="r-top"><span class="r-quando">'+esc(r.hora||'')+'</span><span class="pill '+r.estado+'">'+r.estado+'</span></div>'
        + '<div class="r-nome">'+esc(r.nome||'')+' · '+(Number(r.pessoas)||1)+' pessoa(s)</div>'
        + '<div class="r-meta">📱 '+esc(r.telefone||'')+'</div>'
        + menu
        + '<div class="r-acoes">'+acoes+'</div></div>';
    });
    $('detalhe').innerHTML = html;
    _wireNova(iso);
    _wirePromo(iso);
    $('detalhe').querySelectorAll('[data-a]').forEach(function(btn){ btn.onclick = function(){ accao(btn.getAttribute('data-id'), btn.getAttribute('data-a')); }; });
  }

  function _promoDoDiaHTML(iso){
    const p = ((negocio && negocio.config && negocio.config.promoDatas) || {})[iso] || null;
    const tem = !!(p && (p.texto||'').toString().trim());
    const texto = tem ? esc(p.texto) : '';
    const cor = (p && p.cor) ? esc(p.cor) : '#e0245e';
    const tam = (p && p.tamanho) ? (parseInt(p.tamanho,10)||16) : 16;
    const horOn = !!(p && p.horaIni && p.horaFim);
    const hi = horOn ? esc(p.horaIni) : '12:00';
    const hf = horOn ? esc(p.horaFim) : '15:00';
    return '<div class="promo-wrap">'
      + '<button class="promo-btn" id="btnPromo" type="button">🏷️ Promoção deste dia'+(tem?' ✓':'')+'</button>'
      + '<div class="nova-form '+(tem?'':'hide')+'" id="promoForm">'
      + '<div style="font-size:.78rem; color:#8a7a5c; margin-bottom:4px;">Aparece na montra do amesadigital só neste dia (tem prioridade sobre a promoção normal).</div>'
      + '<label>Texto da promoção</label><input type="text" id="pmTexto" maxlength="70" value="'+texto+'" placeholder="Ex.: Menu de Natal · 25€">'
      + '<div class="lin"><div><label>Cor</label><input type="color" id="pmCor" value="'+cor+'" style="height:40px; padding:3px;"></div>'
      + '<div><label>Tamanho (px)</label><input type="number" id="pmTam" min="11" max="30" value="'+tam+'"></div></div>'
      + '<label style="display:flex; gap:8px; align-items:center; font-weight:800; margin-top:10px;"><input type="checkbox" id="pmHorarioOn"'+(horOn?' checked':'')+' style="width:auto;"> Só num horário</label>'
      + '<div class="lin '+(horOn?'':'hide')+'" id="pmHorarioBox" style="margin-top:6px;"><div><label>Entra às</label><input type="time" id="pmHoraIni" value="'+hi+'"></div>'
      + '<div><label>Sai às</label><input type="time" id="pmHoraFim" value="'+hf+'"></div></div>'
      + '<div class="acts">'+(tem?'<button id="pmRemover" type="button">Remover</button>':'')+'<button class="guardar" id="pmGuardar" type="button">Guardar promoção</button></div>'
      + '<div class="msg" id="pmMsg" style="margin-top:8px;">'+(tem?'Promoção ativa neste dia.':'')+'</div>'
      + '</div></div>';
  }
  function _wirePromo(iso){
    const btn = $('btnPromo'), form = $('promoForm');
    if(btn && form) btn.onclick = function(){ form.classList.toggle('hide'); };
    const h = $('pmHorarioOn'); if(h) h.onchange = function(){ const b=$('pmHorarioBox'); if(b) b.classList.toggle('hide', !h.checked); };
    const g = $('pmGuardar'); if(g) g.onclick = function(){ guardarPromo(iso); };
    const r = $('pmRemover'); if(r) r.onclick = function(){ removerPromo(iso); };
  }
  async function _gravarPromoData(iso, promo){
    const { data, error } = await sb.from('negocios').select('config').eq('id', negocio.id).maybeSingle();
    if(error) return error;
    const cfg = (data && data.config) || {};
    cfg.promoDatas = cfg.promoDatas || {};
    if(promo) cfg.promoDatas[iso] = promo; else delete cfg.promoDatas[iso];
    const up = await sb.from('negocios').update({ config: cfg }).eq('id', negocio.id);
    if(up.error) return up.error;
    negocio.config = cfg;   // manter a cópia local em sincronia
    return null;
  }
  async function guardarPromo(iso){
    const texto = ($('pmTexto').value||'').trim();
    const cor = $('pmCor').value || '#e0245e';
    const tam = Math.max(11, Math.min(30, parseInt($('pmTam').value,10)||16));
    const horOn = $('pmHorarioOn').checked;
    const msg = $('pmMsg');
    if(!texto){ msg.textContent='Escreve o texto da promoção.'; msg.className='msg erro'; return; }
    const promo = { texto: texto, cor: cor, tamanho: tam, ativo: true };
    if(horOn){ promo.horaIni = $('pmHoraIni').value||''; promo.horaFim = $('pmHoraFim').value||''; }
    const g = $('pmGuardar'); g.disabled = true; msg.textContent='A guardar...'; msg.className='msg';
    const err = await _gravarPromoData(iso, promo);
    g.disabled = false;
    if(err){ msg.textContent='Erro: '+err.message; msg.className='msg erro'; return; }
    renderDia(iso);
  }
  async function removerPromo(iso){
    if(!confirm('Remover a promoção deste dia?')) return;
    const err = await _gravarPromoData(iso, null);
    if(err){ const msg=$('pmMsg'); if(msg){ msg.textContent='Erro: '+err.message; msg.className='msg erro'; } return; }
    renderDia(iso);
  }

  function _telWA(t){
    let d = String(t||'').replace(/\D/g,'');
    if(!d) return '';
    if(d.length===9) d = '351' + d;          // número PT sem indicativo
    else if(d.indexOf('00')===0) d = d.slice(2);  // 00351... → 351...
    return d;
  }
  function _dataPt(iso){ const d = new Date(iso+'T00:00:00'); return d.getDate() + ' de ' + MESES[d.getMonth()]; }
  function _waUrl(r, tipo){
    const tel = _telWA(r.telefone);
    if(!tel) return '';
    const nome = (r.nome||'').trim();
    const quando = _dataPt(r.data) + (r.hora ? (' às ' + r.hora) : '');
    const pessoas = (Number(r.pessoas)||1) + ' pessoa(s)';
    const casa = (negocio && negocio.nome) ? negocio.nome : 'o restaurante';
    let msg;
    if(tipo==='confirmar'){
      msg = 'Olá' + (nome ? ' '+nome : '') + '! A sua reserva em ' + casa + ' para ' + quando + ' (' + pessoas + ') está confirmada. Até já! 🍽️';
    } else {
      msg = 'Olá' + (nome ? ' '+nome : '') + '. Lamentamos, mas não conseguimos confirmar a sua reserva em ' + casa + ' para ' + quando + '. Contacte-nos para encontrarmos uma alternativa.';
    }
    return 'https://wa.me/' + tel + '?text=' + encodeURIComponent(msg);
  }

  async function accao(id, a){
    const r = reservas.find(function(x){ return String(x.id)===String(id); });
    if(a==='editar'){ abrirEdicao(id); return; }
    if(a==='apagar'){
      if(!confirm('Apagar esta reserva definitivamente? Esta ação não pode ser anulada.')) return;
      const { error } = await sb.from('reservas').delete().eq('id', id);
      if(error){ alert('Erro: '+error.message); return; }
      carregar();
      return;
    }
    let patch = null, tipo = null;
    if(a==='confirmar'){ patch = { estado:'confirmada' }; tipo = 'confirmar'; }
    else if(a==='cancelar'){ if(!confirm('Recusar/cancelar esta reserva?')) return; patch = { estado:'cancelada' }; tipo = 'recusar'; }
    if(!patch) return;
    // Abre já o WhatsApp com a resposta pronta (mantém a permissão do toque; o dono só carrega em enviar)
    const url = r ? _waUrl(r, tipo) : '';
    const win = url ? window.open(url, '_blank') : null;
    const { error } = await sb.from('reservas').update(patch).eq('id', id);
    if(error){ alert('Erro: '+error.message); if(win){ try{ win.close(); }catch(e){} } return; }
    carregar();
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  iniciar();
</script>
</body>
</html>
