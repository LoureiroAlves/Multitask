<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2F4A33">
<title>Repor password · 4Trevo</title>
<link rel="icon" type="image/png" href="/trevo-64.png">
<link rel="apple-touch-icon" href="/apple-icon-trevo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  /* 4Trevo — repor a password da gestão de um negócio (salões…). Não é usada pela àMesa. */
  :root{ --ac:#2F4A33; --ink:#1F1C1A; --suave:#6B625C; --linha:#E6E0DA; --borda:#DDD6D0; --fundo:#F6F4F2; --ok:#3F5A47; --erro:#A33; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; font-family:Manrope, system-ui, -apple-system, sans-serif; background:var(--fundo); color:var(--ink); }
  .card{ width:100%; max-width:400px; background:#fff; border:1px solid var(--linha); border-radius:18px; padding:24px 22px; box-shadow:0 8px 24px rgba(31,28,26,.08); animation:entra .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entra{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:none; } }
  .marca{ display:flex; align-items:center; justify-content:center; gap:4px; color:var(--ac); }
  .marca span{ font:700 20px 'Space Grotesk', Manrope, sans-serif; letter-spacing:1px; }
  .negocio{ text-align:center; font-weight:800; font-size:15px; margin-top:6px; color:var(--suave); }
  h1{ font-size:20px; margin:14px 0 4px; text-align:center; }
  p{ color:var(--suave); font-size:14px; text-align:center; margin:0 0 14px; line-height:1.45; }
  label{ display:block; font-weight:700; font-size:14px; margin:12px 0 5px; }
  input{ width:100%; padding:12px; border:1.5px solid var(--borda); border-radius:12px; font-size:16px; font-family:inherit; }
  input:focus{ outline:none; border-color:var(--ac); }
  button{ width:100%; margin-top:16px; border:none; border-radius:12px; padding:14px; font-weight:800; font-size:15px; cursor:pointer; color:#fff; background:var(--ac); font-family:inherit; transition:transform .12s ease; }
  button:active{ transform:scale(.98); }
  button:disabled{ opacity:.6; }
  .msg{ margin-top:12px; font-size:14px; text-align:center; min-height:1em; }
  .msg.erro{ color:var(--erro); font-weight:700; } .msg.ok{ color:var(--ok); font-weight:700; }
  .hide{ display:none !important; }
  a{ color:var(--ac); font-weight:700; }
  .voltar{ display:block; text-align:center; margin-top:14px; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="marca" aria-label="4Trevo">
    <svg width="34" height="28" viewBox="22 70 220 182" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g transform="translate(150,160) rotate(60)" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M0,-4 C-4,-12 -18,-14 -30,-28 C-44,-44 -42,-68 -22,-76 C-4,-82 14,-72 18,-54 C22,-38 12,-18 0,-4Z" stroke-width="6"/><path d="M4,0 C12,-4 14,-18 28,-30 C44,-44 68,-42 76,-22 C82,-4 72,14 54,18 C38,22 18,12 4,0Z" stroke-width="6"/><path d="M0,4 C4,12 18,14 30,28 C44,44 42,68 22,76 C4,82 -14,72 -18,54 C-22,38 -12,18 0,4Z" stroke-width="6"/><path d="M-4,0 C-12,4 -14,18 -28,30 C-44,44 -68,42 -76,22 C-82,4 -72,-14 -54,-18 C-38,-22 -18,-12 -4,0Z" stroke-width="6"/><g stroke-width="1" opacity="0.6"><line x1="2" y1="-2" x2="44" y2="-44"/><line x1="2" y1="2" x2="44" y2="44"/><line x1="-2" y1="2" x2="-44" y2="44"/><line x1="-2" y1="-2" x2="-44" y2="-44"/></g><circle cx="0" cy="0" r="4" stroke-width="2"/><path d="M8,82 C10,100 6,120 0,142" stroke-width="6" stroke-linecap="round"/></g></svg>
    <span>4Trevo</span>
  </div>
  <div class="negocio hide" id="nomeNeg"></div>

  <!-- 1) pedir o email com o link -->
  <div id="passoPedir">
    <h1>Esqueci-me da password</h1>
    <p>Escreva o email com que entra na gestão. Enviamos um link para criar uma password nova.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" autocapitalize="off" placeholder="o-seu@email.pt">
    <button id="btnPedir" type="button">Enviar link</button>
  </div>

  <!-- 2) definir a nova password (depois de abrir o link do email) -->
  <div id="passoNova" class="hide">
    <h1>Nova password</h1>
    <p id="novaQuem">Escolha uma password nova para a sua conta.</p>
    <label for="p1">Nova password</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="mínimo 8 caracteres">
    <label for="p2">Repita a password</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button id="btnGuardar" type="button">Guardar nova password</button>
  </div>

  <!-- 3) feito -->
  <div id="passoFeito" class="hide">
    <h1>Password alterada ✓</h1>
    <p>Já pode entrar com a password nova.</p>
    <button id="btnEntrar" type="button">Entrar na gestão</button>
  </div>

  <div class="msg" id="msg" role="status"></div>
  <a class="voltar" id="linkVolta" href="#">← Voltar</a>
</div>

<script>
(function(){
  var SUPA_URL = 'https://zewiijcrkyxjkhudlplk.supabase.co', SUPA_KEY = 'sb_publishable_6LP7x2v5c-c9DQkQslnUmA_g13SEjp3';
  var sb = supabase.createClient(SUPA_URL, SUPA_KEY);
  var q = new URLSearchParams(location.search);
  var SLUG = (q.get('n') || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  var volta = SLUG ? ('salao-gestao.html?n=' + encodeURIComponent(SLUG)) : 'salao-gestao.html';
  function $(id){ return document.getElementById(id); }
  function msg(t, tipo){ var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (tipo ? (' ' + tipo) : ''); }
  function mostra(id){ ['passoPedir','passoNova','passoFeito'].forEach(function(x){ $(x).classList.toggle('hide', x !== id); }); }
  $('linkVolta').href = volta; $('btnEntrar').onclick = function(){ location.href = volta; };
  if(q.get('email')) $('email').value = q.get('email');

  // nome e cor do negócio (só dados públicos)
  if(SLUG){
    fetch(SUPA_URL + '/rest/v1/negocios?slug=eq.' + encodeURIComponent(SLUG) + '&select=nome,config', { headers:{ apikey:SUPA_KEY, Authorization:'Bearer ' + SUPA_KEY } })
      .then(function(r){ return r.json(); }).then(function(rows){ var n = rows && rows[0]; if(!n) return; var s = (n.config && n.config.salao) || {};
        $('nomeNeg').textContent = (s.nome || n.nome || '') + ' · Gestão'; $('nomeNeg').classList.remove('hide');
        if(/^#[0-9a-fA-F]{6}$/.test(s.cor || '')){ document.documentElement.style.setProperty('--ac', s.cor); var mt = document.querySelector('meta[name="theme-color"]'); if(mt) mt.content = s.cor; }
        document.title = 'Repor password · ' + (s.nome || n.nome || '4Trevo'); }).catch(function(){});
  }

  // o link do email traz uma sessão de recuperação — o Supabase lê-a sozinho
  var emRecuperacao = /type=recovery/.test(location.hash) || q.has('code') || /access_token=/.test(location.hash);
  sb.auth.onAuthStateChange(function(ev, sessao){
    if(ev === 'PASSWORD_RECOVERY' || (emRecuperacao && sessao)){
      mostra('passoNova'); msg('');
      if(sessao && sessao.user && sessao.user.email) $('novaQuem').textContent = 'Conta: ' + sessao.user.email;
    }
  });
  if(/error_description=/.test(location.hash)){
    var d = decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' ');
    msg('O link já não é válido (' + d + '). Peça um novo abaixo.', 'erro');
  }

  $('btnPedir').onclick = async function(){
    var email = $('email').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg('Escreva um email válido.', 'erro'); $('email').focus(); return; }
    this.disabled = true; msg('A enviar…');
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + (SLUG ? ('?n=' + encodeURIComponent(SLUG)) : '') });
    this.disabled = false;
    if(r.error){ msg('Erro: ' + r.error.message, 'erro'); return; }
    msg('Se este email tiver conta, recebe um link dentro de 1 a 2 minutos. Veja também o spam.', 'ok');
  };

  $('btnGuardar').onclick = async function(){
    var a = $('p1').value, b = $('p2').value;
    if(a.length < 8){ msg('A password tem de ter pelo menos 8 caracteres.', 'erro'); return; }
    if(a !== b){ msg('As duas passwords não são iguais.', 'erro'); return; }
    this.disabled = true; msg('A guardar…');
    var r = await sb.auth.updateUser({ password: a, data: { senhaDefinida: true } });
    this.disabled = false;
    if(r.error){ msg('Erro: ' + r.error.message + ' — peça um link novo.', 'erro'); return; }
    try{ history.replaceState(null, '', location.pathname + (SLUG ? ('?n=' + encodeURIComponent(SLUG)) : '')); }catch(e){}
    mostra('passoFeito'); msg('');
  };
})();
</script>
</body>
</html>
