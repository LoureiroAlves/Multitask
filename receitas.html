<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>àMesa Receitas</title>
<meta name="description" content="Receitas portuguesas passo a passo, com lista de compras e modo de cozinhar guiado.">
<meta name="theme-color" content="#faf5ec">
<meta property="og:title" content="àMesa Receitas">
<meta property="og:description" content="Receitas passo a passo, com lista de compras e modo de cozinhar guiado.">
<meta property="og:image" content="https://amesadigital.pt/og-amesa.png">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="receitas/receitas.css">
<style>
  html,body{ margin:0; background:var(--r-bg); }
  .topo{ position:sticky; top:0; z-index:50; background:rgba(250,245,236,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--r-linha); padding:calc(10px + env(safe-area-inset-top)) 16px 10px; display:flex; align-items:center; gap:10px; }
  .topo .marca{ width:36px; height:36px; border-radius:50%; background:#c05a3a; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display', serif; font-weight:700; font-size:1.25rem; text-decoration:none; }
  .topo .tit{ font-family:'Playfair Display', serif; font-weight:700; font-size:1.2rem; color:var(--r-ink); text-decoration:none; }
  .topo .tit em{ color:#c05a3a; font-style:italic; }
  .topo .volta{ margin-left:auto; border:none; background:#fff; border-radius:999px; padding:8px 14px; font-weight:900; color:var(--r-ink); box-shadow:0 3px 10px rgba(46,36,24,.08); }
  main{ max-width:760px; margin:0 auto; padding:16px 16px 60px; }
  .ola h1{ font-size:2.1rem; line-height:1.05; margin:10px 0 4px; }
  .ola h1 em{ color:#c05a3a; font-style:italic; }
  .ola p{ margin:0 0 16px; color:var(--r-muted); font-weight:700; }
  .sec{ font-weight:900; font-size:.75rem; letter-spacing:3px; text-transform:uppercase; color:var(--r-muted); margin:22px 2px 10px; }
  .cab-cat{ border-radius:26px; padding:22px 18px; color:#fff; position:relative; overflow:hidden; margin-bottom:14px; background:linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 55%, #2e2418)); }
  .cab-cat h1{ margin:0; font-size:2rem; }
  .cab-cat .e{ position:absolute; right:10px; top:-6px; font-size:5.5rem; transform:rotate(10deg); }
  .cab-cat small{ font-weight:800; opacity:.85; }
  .carregar{ text-align:center; padding:40px; color:var(--r-muted); font-weight:800; }
  .carregar::before{ content:''; display:block; width:34px; height:34px; margin:0 auto 10px; border-radius:50%; border:4px solid var(--r-linha); border-top-color:#c05a3a; animation:gira 0.9s linear infinite; }
  @keyframes gira{ to{ transform:rotate(360deg); } }
  .aviso-rasc{ background:#fff1d6; color:#8a5b00; font-weight:800; border-radius:14px; padding:10px 14px; margin-bottom:12px; font-size:.85rem; }
</style>
</head>
<body class="amr">
<header class="topo"><a class="marca" href="./" aria-label="àMesa">à</a><a class="tit" href="receitas.html">àMesa <em>Receitas</em></a><button type="button" class="volta" id="volta" style="display:none;">← Voltar</button></header>
<main id="app"><div class="carregar">A carregar…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="receitas/modelo.js"></script>
<script src="receitas/dados.js"></script>
<script src="receitas/layouts.js"></script>
<script src="receitas/lista.js"></script>
<script src="receitas/player.js"></script>
<script>
(function(){
  var APP = document.getElementById('app'), VOLTA = document.getElementById('volta');
  var M = AMR.modelo, D = AMR.dados, e = M.esc;
  var CATS = null;   // cache das categorias (são poucas)

  function card(x, cat){
    var c = (cat && cat.cor) || '#c05a3a', em = x.emoji || (cat && cat.emoji) || '🍽️';
    var meta = [M.DIFICULDADES[x.dificuldade], x.tempo_total ? M.tempoTexto(x.tempo_total) : '', x.porcoes ? x.porcoes + ' pax' : ''].filter(Boolean).join(' · ');
    return '<a class="amr-card amr-entra" style="--c:' + e(c) + '" href="?r=' + encodeURIComponent(x.slug) + '" data-r="' + e(x.slug) + '"><span class="ic">' + em + '</span><span class="tx"><b>' + e(x.nome) + (x.publicado === false ? '<span class="amr-badge">RASCUNHO</span>' : '') + '</b><span class="meta">' + e(meta) + '</span></span><span class="ir">Ver →</span></a>';
  }
  function ligaLinks(el){ el.querySelectorAll('a[data-r]').forEach(function(a){ a.onclick = function(ev){ ev.preventDefault(); ir('?r=' + encodeURIComponent(a.dataset.r)); }; }); el.querySelectorAll('[data-c]').forEach(function(b){ b.onclick = function(ev){ ev.preventDefault(); ir('?c=' + encodeURIComponent(b.dataset.c)); }; }); }
  async function categorias(){ if(!CATS) CATS = await D.categorias(); return CATS; }
  function catPorId(id){ return (CATS || []).filter(function(c){ return c.id === id; })[0]; }
  function erro(msg){ APP.innerHTML = '<div class="amr-vazio">😕 ' + e(msg) + '<br><br><a href="receitas.html" style="color:#c05a3a;font-weight:900;">Voltar às receitas</a></div>'; }

  // lista com pesquisa e "carregar mais" (serve para uma categoria ou para a pesquisa geral)
  function listaPaginada(caixa, opc){
    var pagina = 0, termo = '', vez = 0;
    async function carregar(reiniciar){
      var minha = ++vez; if(reiniciar){ pagina = 0; caixa.innerHTML = '<div class="carregar">A procurar…</div>'; }
      try{
        var r = await D.receitas({ categoriaId:opc.categoriaId, pesquisa:termo, pagina:pagina });
        if(minha !== vez) return;
        if(reiniciar) caixa.innerHTML = '';
        var antigo = caixa.querySelector('.amr-mais'); if(antigo) antigo.remove();
        if(!r.lista.length && pagina === 0){ caixa.innerHTML = '<div class="amr-vazio">' + (termo ? 'Nenhuma receita com "' + e(termo) + '".' : 'Ainda não há receitas aqui. Volta em breve! 🍳') + '</div>'; return; }
        var grelha = caixa.querySelector('.amr-lista'); if(!grelha){ grelha = document.createElement('div'); grelha.className = 'amr-lista'; caixa.appendChild(grelha); }
        grelha.insertAdjacentHTML('beforeend', r.lista.map(function(x){ return card(x, catPorId(x.categoria_id)); }).join(''));
        ligaLinks(grelha);
        if((pagina + 1) * r.porPagina < r.total){ var b = document.createElement('button'); b.type = 'button'; b.className = 'amr-mais'; b.textContent = 'Ver mais receitas (' + (r.total - (pagina + 1) * r.porPagina) + ')'; b.onclick = function(){ pagina++; carregar(false); }; caixa.appendChild(b); }
      }catch(err){ caixa.innerHTML = '<div class="amr-vazio">Não foi possível carregar as receitas.</div>'; }
    }
    var t = null;
    opc.input.oninput = function(){ clearTimeout(t); t = setTimeout(function(){ termo = opc.input.value.trim(); if(opc.aoPesquisar) opc.aoPesquisar(termo); if(opc.soComTermo && !termo){ caixa.innerHTML = ''; return; } carregar(true); }, 280); };
    if(!opc.soComTermo) carregar(true);
  }

  async function inicio(){
    VOLTA.style.display = 'none'; document.title = 'àMesa Receitas';
    APP.innerHTML = '<div class="ola amr-entra"><h1>Receitas <em>portuguesas</em></h1><p>Passo a passo, com lista de compras e modo de cozinhar guiado.</p></div>'
      + '<div class="amr-pesq amr-entra"><input id="q" type="search" placeholder="Procurar receitas ou ingredientes…" autocomplete="off"></div>'
      + '<div id="res"></div><div id="blocoCats"><div class="sec">Categorias</div><div class="amr-cats" id="cats"><div class="carregar" style="grid-column:1/-1">A carregar…</div></div></div>';
    try{
      var cs = await categorias();
      var el = document.getElementById('cats'); if(!el) return;
      el.innerHTML = cs.length ? cs.map(function(c){ return '<button type="button" class="amr-cat amr-entra" style="--c:' + e(c.cor) + '" data-c="' + e(c.slug) + '"><span class="e">' + e(c.emoji) + '</span><b>' + e(c.nome) + '</b>' + (c.descricao ? '<small>' + e(c.descricao) + '</small>' : '') + '</button>'; }).join('') : '<div class="amr-vazio" style="grid-column:1/-1">Em breve! 🍳</div>';
      ligaLinks(el);
    }catch(err){ erro('Não foi possível carregar as categorias.'); return; }
    listaPaginada(document.getElementById('res'), { input:document.getElementById('q'), soComTermo:true, aoPesquisar:function(t){ document.getElementById('blocoCats').style.display = t ? 'none' : ''; } });
  }

  async function categoria(slug){
    VOLTA.style.display = '';
    APP.innerHTML = '<div class="carregar">A carregar…</div>';
    try{ await categorias(); var c = await D.categoria(slug); if(!c){ erro('Esta categoria não existe.'); return; }
      document.title = c.nome + ' · àMesa Receitas';
      APP.innerHTML = '<div class="cab-cat amr-entra" style="--c:' + e(c.cor) + '"><span class="e">' + e(c.emoji) + '</span><small>RECEITAS</small><h1>' + e(c.nome) + '</h1>' + (c.descricao ? '<small>' + e(c.descricao) + '</small>' : '') + '</div>'
        + '<div class="amr-pesq"><input id="q" type="search" placeholder="Procurar em ' + e(c.nome) + '…" autocomplete="off"></div><div id="res" style="margin-top:14px;"></div>';
      listaPaginada(document.getElementById('res'), { input:document.getElementById('q'), categoriaId:c.id });
    }catch(err){ erro('Não foi possível carregar esta categoria.'); }
  }

  async function receita(slug){
    VOLTA.style.display = '';
    APP.innerHTML = '<div class="carregar">A carregar a receita…</div>';
    try{
      await categorias();
      var reg = await D.receita(slug); if(!reg){ erro('Esta receita não existe (ou ainda não foi publicada).'); return; }
      var r = M.normalizar(reg.dados || {}).receita;
      var cat = catPorId(reg.categoria_id) || {};
      document.title = r.nome + ' · àMesa Receitas';
      APP.innerHTML = (reg.publicado ? '' : '<div class="aviso-rasc">👁 Pré-visualização de administrador — esta receita ainda é um rascunho.</div>') + '<div id="rec"></div>';
      VOLTA.dataset.cat = cat.slug || '';
      AMR.layouts.render(document.getElementById('rec'), r, {
        categoria:cat,
        aoComecar:function(f){ AMR.player.abrir(r, f); },
        aoLista:function(f){ AMR.lista.abrir(r, f); }
      });
    }catch(err){ erro('Não foi possível carregar a receita.'); }
  }

  function ir(qs){ history.pushState(null, '', 'receitas.html' + qs); rota(); window.scrollTo(0, 0); }
  function rota(){
    var p = new URLSearchParams(location.search);
    VOLTA.dataset.cat = '';
    if(p.get('r')) receita(p.get('r')); else if(p.get('c')) categoria(p.get('c')); else inicio();
  }
  VOLTA.onclick = function(){ var p = new URLSearchParams(location.search); if(p.get('r') && VOLTA.dataset.cat) ir('?c=' + encodeURIComponent(VOLTA.dataset.cat)); else ir(''); };
  window.addEventListener('popstate', rota);
  if(!D.cliente()){ erro('Sem ligação. Verifica a internet e tenta outra vez.'); return; }
  rota();
})();
</script>
</body>
</html>
