<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÀMesa — o vídeo do teu restaurante</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* ÀMesa — vídeo do teu restaurante (amesadigital.pt/video.html?n=slug). Lê o menu verdadeiro e monta um vídeo para as redes. */
  :root{ --bg:#faf5ec; --ink:#2e2418; --muted:#8a7a63; --terra:#c05a3a; --terra-esc:#a3452b; --gold:#c79a3e; --linha:#eaddc8; --verde:#2e9b57; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#1b140c; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; font-family:'Nunito', system-ui, sans-serif; cursor:pointer; }
  #palco{ position:relative; width:1080px; height:1920px; background:var(--bg); overflow:hidden; transform-origin:center; flex:none; }
  .serif{ font-family:'Playfair Display', Georgia, serif; }

  /* fundo com manchas suaves */
  #palco::before{ content:''; position:absolute; inset:-20%; background:radial-gradient(circle at 20% 15%, rgba(192,90,58,.10), transparent 40%), radial-gradient(circle at 85% 80%, rgba(199,154,62,.12), transparent 45%); }

  /* ---------- marca ---------- */
  .mark{ position:absolute; border-radius:50%; background:var(--terra); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display', Georgia, serif; font-weight:700; perspective:1200px; box-shadow:0 30px 80px rgba(192,90,58,.35); }
  .mark .a{ display:inline-block; line-height:1; transform-origin:50% 60%; }
  .mark .ac{ position:absolute; left:50%; background:#fff; border-radius:999px; transform:rotate(-38deg); }
  #topo{ position:absolute; top:90px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:22px; opacity:0; }
  #topo .mk{ position:relative; width:96px; height:96px; }
  #topo .wm{ font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:78px; color:var(--ink); display:flex; }
  #topo .wm span{ display:inline-block; }

  /* ---------- legendas ---------- */
  #legenda{ position:absolute; top:230px; left:60px; right:60px; text-align:center; font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:74px; line-height:1.1; color:var(--ink); min-height:170px; }
  #legenda em{ color:var(--terra); font-style:italic; font-weight:600; }
  #legenda .l{ display:inline-block; opacity:0; transform:translateY(30px); transition:opacity .45s, transform .45s cubic-bezier(.2,1.3,.4,1); }
  #legenda .l.on{ opacity:1; transform:none; }
  #sub{ position:absolute; top:410px; left:80px; right:80px; text-align:center; font-size:38px; font-weight:700; color:var(--muted); opacity:0; transition:opacity .4s; }

  /* ---------- telemóvel ---------- */
  #fone{ position:absolute; left:50%; top:540px; width:640px; height:1300px; margin-left:-320px; border-radius:86px; background:#15100b; padding:20px; box-shadow:0 60px 120px rgba(46,36,24,.35); transform:translateY(1600px); }
  #fone .ilha{ position:absolute; top:34px; left:50%; width:170px; height:44px; margin-left:-85px; background:#000; border-radius:999px; z-index:20; }
  #ecra{ position:relative; width:100%; height:100%; border-radius:68px; overflow:hidden; background:var(--bg); }
  .tela{ position:absolute; inset:0; padding:110px 34px 40px; opacity:0; transform:translateX(60px); transition:opacity .45s, transform .55s cubic-bezier(.2,.9,.3,1); }
  .tela.on{ opacity:1; transform:none; }
  .tela.fora{ opacity:0; transform:translateX(-60px); }
  .barra{ display:flex; align-items:center; gap:12px; margin-bottom:22px; }
  .barra .mini{ width:52px; height:52px; border-radius:50%; background:var(--terra); color:#fff; font-family:'Playfair Display', serif; font-weight:700; font-size:32px; display:flex; align-items:center; justify-content:center; }
  .barra b{ font-family:'Playfair Display', serif; font-size:36px; color:var(--ink); }
  .pesq{ background:#fff; border:2px solid var(--linha); border-radius:999px; padding:20px 26px; font-size:28px; color:var(--muted); margin-bottom:24px; }
  .pesq .cur{ display:inline-block; width:3px; height:30px; background:var(--terra); vertical-align:middle; animation:pisca 1s steps(1) infinite; }
  @keyframes pisca{ 50%{ opacity:0; } }
  .lista{ transition:transform 2.6s cubic-bezier(.45,0,.25,1); }
  .card{ display:flex; gap:20px; align-items:center; background:#fff; border-radius:30px; padding:18px; margin-bottom:20px; box-shadow:0 8px 24px rgba(74,56,32,.08); transition:transform .3s; }
  .card .ft{ width:130px; height:130px; border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:70px; flex:none; }
  .card .t{ font-size:31px; font-weight:900; color:var(--ink); }
  .card .s{ font-size:24px; color:var(--muted); font-weight:700; margin-top:4px; }
  .card .st{ font-size:24px; color:var(--gold); margin-top:6px; }
  .card.toque{ transform:scale(.96); }
  .dedo{ position:absolute; width:90px; height:90px; border-radius:50%; background:rgba(192,90,58,.25); border:4px solid rgba(192,90,58,.7); z-index:30; opacity:0; transform:scale(.4); transition:opacity .2s, transform .25s; pointer-events:none; }
  .dedo.on{ opacity:1; transform:scale(1); }

  /* menu */
  .capa{ margin:-110px -34px 26px; height:360px; background:linear-gradient(160deg,#c05a3a,#7a3a20 60%,#3a2c18); display:flex; flex-direction:column; justify-content:flex-end; padding:34px; color:#fff; position:relative; }
  .capa .n{ font-family:'Playfair Display', serif; font-size:54px; font-weight:700; }
  .capa .f{ font-size:26px; opacity:.85; font-style:italic; }
  .capa .emo{ position:absolute; top:110px; right:40px; font-size:110px; }
  .cats .cat{ background:#fff; border-radius:24px; padding:26px; margin-bottom:16px; text-align:center; font-weight:900; font-size:30px; letter-spacing:1px; color:var(--ink); border-left:8px solid var(--terra); opacity:0; transform:translateY(20px); transition:.4s; }
  .cats .cat.on{ opacity:1; transform:none; }
  .pdia{ border-radius:30px; height:220px; background:linear-gradient(120deg,#e9a23b,#c05a3a); color:#fff; padding:28px; margin-bottom:22px; position:relative; box-shadow:0 0 0 4px #ffd36b, 0 0 30px rgba(255,190,80,.6); transform:scale(.6); opacity:0; transition:.5s cubic-bezier(.2,1.4,.4,1); }
  .pdia.on{ transform:none; opacity:1; }
  .pdia .k{ font-size:24px; font-weight:900; letter-spacing:2px; opacity:.9; }
  .pdia .n{ font-family:'Playfair Display', serif; font-size:46px; font-weight:700; margin-top:6px; }
  .pdia .p{ font-size:28px; margin-top:6px; }
  .pdia .emo{ position:absolute; right:26px; bottom:14px; font-size:110px; }
  .promo{ background:linear-gradient(135deg,#ff5a8a,#e0245e); color:#fff; border:5px solid #fff; border-radius:28px; padding:22px 26px; transform:rotate(-3deg) scale(.5); opacity:0; transition:.5s cubic-bezier(.2,1.5,.4,1); box-shadow:0 14px 30px -6px rgba(224,36,94,.6); position:relative; }
  .promo.on{ transform:rotate(-3deg); opacity:1; }
  .promo .k{ font-size:20px; font-weight:900; letter-spacing:2px; background:rgba(255,255,255,.25); display:inline-block; padding:4px 12px; border-radius:999px; }
  .promo .n{ font-size:52px; font-weight:900; text-transform:uppercase; margin-top:6px; }
  .promo .emo{ position:absolute; top:-40px; left:-16px; font-size:70px; transform:rotate(-14deg); }
  .prato{ display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:24px; padding:24px; margin-bottom:16px; font-size:29px; font-weight:800; color:var(--ink); }
  .prato .pr{ color:var(--terra); font-weight:900; }
  .cor{ font-size:46px; color:#d9cbb3; transition:transform .3s; display:inline-block; }
  .cor.on{ color:#e0245e; animation:batida .6s; }
  @keyframes batida{ 0%{ transform:scale(1); } 35%{ transform:scale(1.6); } 70%{ transform:scale(.9); } 100%{ transform:scale(1); } }

  /* folha de baixo (reservas, carrinho, fidelidade, jogo) */
  .folha{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:50px 50px 0 0; padding:40px 34px 60px; box-shadow:0 -20px 50px rgba(0,0,0,.2); transform:translateY(105%); transition:transform .55s cubic-bezier(.2,.9,.3,1); z-index:10; }
  .folha.on{ transform:none; }
  .folha h3{ font-family:'Playfair Display', serif; font-size:42px; color:var(--ink); text-align:center; margin-bottom:20px; }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:22px; }
  .cal span{ height:66px; border-radius:16px; background:#f6efe2; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:26px; color:var(--ink); transition:.3s; }
  .cal span.sel{ background:var(--terra); color:#fff; transform:scale(1.1); }
  .horas{ display:flex; gap:12px; justify-content:center; margin-bottom:24px; }
  .horas span{ padding:16px 22px; border-radius:999px; border:2px solid var(--linha); font-weight:900; font-size:26px; color:var(--ink); transition:.3s; }
  .horas span.sel{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn{ background:var(--terra); color:#fff; text-align:center; border-radius:24px; padding:26px; font-weight:900; font-size:32px; transition:.3s; }
  .btn.ok{ background:var(--verde); }
  .carrinho{ position:absolute; right:30px; bottom:40px; width:120px; height:120px; border-radius:50%; background:var(--ink); color:#fff; font-size:56px; display:flex; align-items:center; justify-content:center; z-index:9; transform:scale(0); transition:.4s cubic-bezier(.2,1.5,.4,1); }
  .carrinho.on{ transform:scale(1); }
  .carrinho i{ position:absolute; top:-6px; right:-6px; min-width:50px; height:50px; border-radius:999px; background:#e0245e; font-style:normal; font-size:28px; font-weight:900; display:flex; align-items:center; justify-content:center; transform:scale(0); transition:.3s cubic-bezier(.2,1.6,.4,1); }
  .carrinho i.on{ transform:scale(1); }
  .num{ font-family:'Playfair Display', serif; font-size:120px; color:var(--terra); text-align:center; line-height:1; }
  .selos{ display:grid; grid-template-columns:repeat(5,1fr); gap:16px; margin:20px 0 26px; }
  .selos span{ aspect-ratio:1; border-radius:50%; border:3px dashed #d9cbb3; display:flex; align-items:center; justify-content:center; font-size:48px; transition:.3s; }
  .selos span.on{ border:3px solid var(--gold); background:#fff6dd; animation:batida .5s; }
  .ovo{ font-size:180px; text-align:center; display:block; animation:abana 1.2s ease-in-out infinite; }
  @keyframes abana{ 0%,100%{ transform:rotate(-8deg); } 50%{ transform:rotate(8deg); } }

  /* notificação */
  .push{ position:absolute; top:30px; left:24px; right:24px; background:rgba(255,255,255,.96); border-radius:34px; padding:24px 26px; display:flex; gap:20px; align-items:center; box-shadow:0 20px 50px rgba(0,0,0,.25); transform:translateY(-200%); transition:transform .5s cubic-bezier(.2,1.2,.4,1); z-index:25; }
  .push.on{ transform:none; }
  .push .ic{ width:76px; height:76px; border-radius:20px; background:var(--terra); color:#fff; font-family:'Playfair Display', serif; font-weight:700; font-size:46px; display:flex; align-items:center; justify-content:center; flex:none; }
  .push b{ font-size:28px; color:var(--ink); display:block; }
  .push span{ font-size:24px; color:var(--muted); font-weight:700; }

  /* confetes */
  .conf{ position:absolute; top:-30px; width:18px; height:26px; border-radius:4px; z-index:26; animation:cai 2.4s linear forwards; }
  @keyframes cai{ to{ transform:translateY(1400px) rotate(720deg); } }

  /* fim */
  #fim{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; opacity:0; pointer-events:none; }
  #fim .url{ font-family:'Playfair Display', serif; font-weight:700; font-size:86px; color:var(--ink); }
  #fim .chamada{ font-size:44px; font-weight:800; color:var(--muted); text-align:center; padding:0 80px; }
  #qr{ background:#fff; padding:26px; border-radius:36px; box-shadow:0 20px 60px rgba(46,36,24,.15); }
  #qr img, #qr canvas{ display:block; width:300px; height:300px; }

  /* câmara a ler o QR */
  .camara{ position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, #4a3a2a, #15100b 75%); display:flex; align-items:center; justify-content:center; }
  .cartao{ background:#fff; border-radius:30px; padding:34px; width:420px; text-align:center; transform:rotate(-4deg); box-shadow:0 30px 60px rgba(0,0,0,.4); }
  .cartao .ct{ font-family:'Playfair Display', serif; font-weight:700; font-size:32px; color:var(--ink); margin-bottom:18px; }
  .cartao .cu{ font-weight:900; font-size:26px; color:var(--terra); margin-top:16px; }
  .qrf{ display:grid; grid-template-columns:repeat(21,1fr); width:300px; height:300px; margin:0 auto; }
  .mira{ position:absolute; width:500px; height:500px; border-radius:40px; border:6px solid rgba(255,255,255,.9); box-shadow:0 0 0 2000px rgba(0,0,0,.25); animation:mira 1.2s ease-in-out infinite; }
  @keyframes mira{ 50%{ transform:scale(.95); } }
  .pilula{ position:absolute; bottom:180px; left:50%; transform:translate(-50%, 40px); opacity:0; background:#fff; color:var(--ink); font-weight:900; font-size:30px; padding:22px 34px; border-radius:999px; box-shadow:0 14px 30px rgba(0,0,0,.35); transition:.35s cubic-bezier(.2,1.3,.4,1); white-space:nowrap; }
  .pilula.on{ opacity:1; transform:translate(-50%, 0); }

  /* efeitos de troca de tela */
  #ecra{ perspective:1400px; }
  .tela.e-cima{ transform:translateY(90px); } .tela.e-cima.fora{ transform:translateY(-90px); }
  .tela.e-zoom{ transform:scale(.8); filter:blur(10px); transition:opacity .45s, transform .55s cubic-bezier(.2,.9,.3,1), filter .45s; } .tela.e-zoom.fora{ transform:scale(1.18); filter:blur(10px); }
  .tela.e-flip{ transform:rotateY(75deg); transform-origin:left center; } .tela.e-flip.fora{ transform:rotateY(-75deg); transform-origin:right center; }
  .tela.e-cima.on, .tela.e-zoom.on, .tela.e-flip.on{ transform:none; opacity:1; filter:none; }
  /* cortina e palavra gigante */
  #wipe{ position:absolute; inset:0; z-index:50; background:var(--terra); clip-path:circle(0% at 50% 50%); display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #wipe .w{ font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:420px; color:#fff; line-height:1; }
  #grande{ position:absolute; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; pointer-events:none; text-align:center; }
  #grande span{ display:inline-block; font-family:'Playfair Display', Georgia, serif; font-weight:700; font-size:150px; color:var(--ink); line-height:1.05; padding:0 60px; }
  #grande em{ color:var(--terra); font-style:italic; }
  /* realce por baixo das palavras em destaque */
  #legenda em{ background:linear-gradient(transparent 64%, rgba(233,162,59,.5) 64%) no-repeat 0 0 / 0% 100%; transition:background-size .6s .35s; padding:0 4px; }
  #legenda .l.on em{ background-size:100% 100%; }
  #legenda b{ display:inline-flex; width:84px; height:84px; border-radius:50%; background:var(--terra); color:#fff; font-size:50px; align-items:center; justify-content:center; vertical-align:middle; margin-right:6px; }
  /* jogo */
  .seloOvo{ display:flex; gap:20px; align-items:center; background:linear-gradient(135deg,#2a5aa8,#7b3fa0); color:#fff; border-radius:30px; padding:26px; margin-bottom:22px; }
  .seloOvo .o{ font-size:80px; animation:abana 1.2s ease-in-out infinite; }
  .seloOvo b{ font-size:34px; display:block; } .seloOvo small{ font-size:26px; opacity:.9; } .seloOvo .cd{ font-weight:900; font-variant-numeric:tabular-nums; }
  #jIns{ margin-bottom:24px; }
  .conv{ background:#fff7e0; border:2px solid #f2d27a; border-radius:26px; padding:24px; margin-bottom:20px; }
  .conv .ct{ font-weight:800; font-size:30px; color:#5a3d08; }
  .barraC{ height:22px; border-radius:999px; background:#f1e4c2; overflow:hidden; margin:16px 0 12px; }
  .barraC i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#f2b705,#e0245e); border-radius:999px; transition:width .5s cubic-bezier(.2,1.2,.4,1); }
  .conv .cn{ font-weight:900; font-size:28px; color:#3a2c18; }
  .prato.abana{ animation:treme .45s; }
  @keyframes treme{ 20%{ transform:translateX(-12px); } 40%{ transform:translateX(10px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(4px); } }
  .avisoF{ position:absolute; left:50%; bottom:90px; background:#2f2416; color:#fff; font-weight:900; font-size:30px; padding:20px 30px; border-radius:999px; white-space:nowrap; z-index:24; box-shadow:0 14px 30px rgba(0,0,0,.3); }
  .ovoPop{ position:absolute; right:110px; font-size:70px; animation:salta .7s cubic-bezier(.2,1.6,.4,1) both; }
  .prato{ position:relative; }
  @keyframes salta{ 0%{ transform:translateY(30px) scale(0); } 100%{ transform:translateY(-40px) scale(1); } }
  .codigoJ{ text-align:center; font-family:ui-monospace, Menlo, monospace; font-weight:900; font-size:52px; letter-spacing:3px; color:var(--ink); background:#fff6dd; border:3px dashed var(--gold); border-radius:20px; padding:20px; margin-top:10px; }

  /* ===== vídeo para restaurantes: o menu a ser construído no telemóvel fixo ===== */
  #ecra{ background:#f6efe2; }
  .obra{ position:absolute; left:0; right:0; top:0; padding:0 0 60px; transition:transform .9s cubic-bezier(.45,0,.25,1); }
  .sec{ position:relative; margin:0 26px 18px; }
  .vazio{ border:4px dashed #d7c7aa; border-radius:26px; height:130px; display:flex; align-items:center; justify-content:center; color:#b3a17f; font-weight:900; font-size:30px; }
  .surge{ animation:surge .6s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes surge{ 0%{ opacity:0; transform:translateY(40px) scale(.92); } 100%{ opacity:1; transform:none; } }
  .cab{ margin:0 0 22px; height:470px; position:relative; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; padding:40px 36px; transition:background .6s; overflow:hidden; }
  .cab .foto{ position:absolute; inset:0; font-size:260px; display:flex; align-items:center; justify-content:center; opacity:.22; }
  .cab .nm{ position:relative; font-family:'Playfair Display', serif; font-weight:700; font-size:62px; line-height:1.05; min-height:66px; }
  .cab .fr{ position:relative; font-size:28px; font-style:italic; opacity:.9; margin-top:8px; min-height:34px; }
  .cursor{ display:inline-block; width:4px; height:54px; background:#fff; vertical-align:-6px; margin-left:4px; animation:pisca 1s steps(1) infinite; }
  .paleta{ position:absolute; right:22px; top:110px; display:flex; flex-direction:column; gap:12px; z-index:3; }
  .paleta i{ width:58px; height:58px; border-radius:50%; border:5px solid #fff; box-shadow:0 6px 16px rgba(0,0,0,.25); transform:scale(0); transition:transform .35s cubic-bezier(.2,1.5,.4,1); }
  .paleta.on i{ transform:scale(1); }
  .paleta i.sel{ outline:5px solid #2e2418; }
  .modos{ display:flex; gap:14px; justify-content:center; }
  .modos div{ flex:1; background:#fff; border-radius:24px; padding:20px 8px; text-align:center; font-weight:900; font-size:24px; color:var(--ink); box-shadow:0 6px 18px rgba(74,56,32,.08); }
  .modos div span{ display:block; font-size:50px; margin-bottom:6px; }
  .pratoF{ display:flex; gap:18px; align-items:center; background:#fff; border-radius:24px; padding:16px; margin-bottom:14px; box-shadow:0 6px 18px rgba(74,56,32,.06); }
  .pratoF .im{ width:110px; height:110px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:64px; flex:none; }
  .pratoF b{ font-size:30px; color:var(--ink); display:block; } .pratoF small{ font-size:23px; color:var(--muted); font-weight:700; }
  .pratoF .pr{ margin-left:auto; font-weight:900; font-size:30px; color:var(--terra); }
  .tituloCat{ font-weight:900; letter-spacing:2px; font-size:26px; color:var(--terra); margin:6px 4px 14px; }
  .hor{ background:#fff; border-radius:24px; padding:22px 26px; font-size:26px; color:var(--ink); font-weight:700; box-shadow:0 6px 18px rgba(74,56,32,.06); }
  .hor div{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #eadfc6; } .hor div:last-child{ border:none; }
  .hor b{ color:var(--terra); }
  .redes{ display:flex; gap:14px; justify-content:center; margin-top:16px; }
  .redes span{ width:84px; height:84px; border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:42px; color:#fff; font-weight:900; }
  .mapa{ height:330px; border-radius:28px; overflow:hidden; position:relative; background:#e8efe1; box-shadow:0 6px 18px rgba(74,56,32,.08); }
  .mapa svg{ position:absolute; inset:0; width:100%; height:100%; }
  .pino{ position:absolute; left:50%; top:42%; font-size:86px; transform:translate(-50%,-100%); animation:pino .8s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pino{ 0%{ transform:translate(-50%,-400%); opacity:0; } 60%{ opacity:1; } 100%{ transform:translate(-50%,-100%); } }

  var MAPA = '<svg viewBox="0 0 600 330" preserveAspectRatio="xMidYMid slice"><rect width="600" height="330" fill="#e8efe1"/><rect x="40" y="30" width="150" height="90" rx="10" fill="#d9e3cf"/><rect x="250" y="20" width="120" height="110" rx="10" fill="#dfe6d6"/><rect x="420" y="40" width="150" height="80" rx="10" fill="#d4dfc8"/><rect x="60" y="190" width="170" height="110" rx="10" fill="#dfe6d6"/><rect x="380" y="190" width="190" height="110" rx="10" fill="#d9e3cf"/><path d="M0 160 H600" stroke="#fff" stroke-width="30"/><path d="M310 0 V330" stroke="#fff" stroke-width="26"/><path d="M0 60 L600 280" stroke="#fdf6e3" stroke-width="16"/><circle cx="470" cy="250" r="34" fill="#cfe3f5"/></svg>';

  // ---------- dados do restaurante ----------
  var SUPA = 'https://zewiijcrkyxjkhudlplk.supabase.co', CHAVE = 'sb_publishable_6LP7x2v5c-c9DQkQslnUmA_g13SEjp3';

  var R = null;   // dados prontos a usar
  async function carregar(){
    if(!SLUG) throw new Error('sem slug');

    var a = r.ok ? await r.json() : []; var n = a && a[0]; if(!n) throw new Error('não encontrado');
    var c = n.config || {}, h = c.header || {}, m = c.modos || {}, loc = c.local || {}, rod = c.rodape || {}, ft = c.footer || {};
    var cats = ((n.menu || {}).categorias || []).filter(function(k){ return k && (k.grupos || []).some(function(g){ return (g.itens || []).length; }); });
    var lista = cats.map(function(k){

      return y.itens.length - x.itens.length;
    })[0] || null;
    var hoje = new Date().toISOString().slice(0, 10);

  // ---------- o filme ----------

      }
      await espera(700, id);
    }

    // 3) pratos
    if(R.pratos){
      var alvoTile = Array.prototype.find.call(obra.querySelectorAll('.tileV'), function(t){ return t.textContent.indexOf(R.pratos.nome) >= 0; }) || obra.querySelector('.tileV');
      if(alvoTile){ toque(alvoTile); await espera(350, id); }
      legenda('Pratos e <em>preços</em>', R.pratos.nome);
      var it = R.pratos.itens.slice(0, 4);
      var t = tela('<div class="barra" style="background:linear-gradient(135deg,' + R.pratos.c1 + ',' + R.pratos.c2 + ');color:#fff;padding:80px 30px 26px;margin:0 0 20px"><b style="font-size:40px">' + esc(R.pratos.emoji) + ' ' + esc(R.pratos.nome) + '</b></div><div style="padding:0 26px">'
        + it.map(function(p, j){ return '<div class="pratoF surge" style="animation-delay:' + (j * .18) + 's"><div class="im" style="background:' + (p.foto ? ('url(\'' + p.foto.replace(/'/g, '%27') + '\') center/cover') : '#f3ece0') + '">' + (p.foto ? '' : esc(R.pratos.emoji)) + '</div><div><b>' + esc(p.nome) + '</b>' + (p.desc ? ('<small>' + esc(p.desc.slice(0, 40)) + '</small>') : '') + '</div><span class="pr">' + esc(p.preco) + '</span></div>'; }).join('') + '</div>');
