<html lang="pt">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ÀMesa — a tua mesa está à espera</title>
<meta name="theme-color" content="#c05a3a">
<!-- Ecrã cheio quando associado ao ecrã principal (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ÀMesa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="description" content="ÀMesa — descobre restaurantes e abre o menu digital de cada um. Reserva, escolhe, saboreia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fredoka:wght@600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#faf5ec; --ink:#2e2418; --muted:#8a7a63; --terra:#c05a3a; --terra-esc:#a3452b; --gold:#c79a3e; --card:#ffffff; --linha:#eaddc8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Nunito', sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px; }

  header.top{ position:sticky; top:0; z-index:20; background:rgba(250,245,236,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--linha); padding-top:env(safe-area-inset-top); }
  .top-in{ display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo{ display:flex; align-items:center; gap:10px; font-family:'Playfair Display', serif; font-weight:700; font-size:1.5rem; color:var(--ink); }
  .logo .mark{ width:38px; height:38px; border-radius:50%; background:var(--terra); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.25rem; box-shadow:0 4px 12px rgba(192,90,58,.35); }
  .top-cta{ font-weight:700; font-size:.9rem; color:var(--terra-esc); border:1.5px solid var(--terra); border-radius:999px; padding:8px 16px; transition:.15s; }
  .top-cta:hover{ background:var(--terra); color:#fff; }

  .hero{ text-align:center; padding:56px 0 30px; }
  .hero h1{ font-family:'Playfair Display', serif; font-weight:700; font-size:clamp(2.1rem, 6vw, 3.4rem); line-height:1.1; color:var(--ink); }
  .hero h1 em{ font-style:italic; color:var(--terra); }
  .hero p{ margin-top:12px; font-size:1.08rem; color:var(--muted); font-weight:600; }
  .search{ margin:26px auto 0; max-width:520px; position:relative; }
  .search input{ width:100%; padding:15px 18px 15px 48px; border:1.5px solid var(--linha); border-radius:999px; background:#fff; font-family:inherit; font-size:1rem; color:var(--ink); box-shadow:0 6px 20px rgba(120,90,50,.08); }
  .search input:focus{ outline:none; border-color:var(--terra); }
  .search .ico{ position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:1.1rem; }

  .sec-tit{ display:flex; align-items:baseline; justify-content:space-between; margin:34px 0 16px; }
  .sec-tit h2{ font-family:'Playfair Display', serif; font-weight:700; font-size:1.4rem; }
  .sec-tit .cnt{ font-size:.9rem; color:var(--muted); font-weight:700; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:18px; padding-bottom:20px; }
  .card{ position:relative; background:var(--card); border:1px solid var(--linha); border-radius:18px; overflow:hidden; box-shadow:0 6px 18px rgba(120,90,50,.06); transition:transform .16s ease, box-shadow .16s ease; display:flex; flex-direction:column; }
  .card:hover{ transform:translateY(-3px); box-shadow:0 12px 26px rgba(120,90,50,.14); }
  .card{ cursor:pointer; }
  .card .foto{ height:200px; background:var(--terra); background-size:cover; background-position:center; position:relative; display:flex; align-items:center; justify-content:center; }
  .card .foto .inicial{ font-family:'Playfair Display', serif; font-weight:700; font-size:3rem; color:rgba(255,255,255,.9); }
  .card .foto::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.18), transparent 55%); }
  /* Promoção — bem visível para chamar a atenção */
  .card.tem-promo{ border-color:var(--promo-cor,#e0245e); box-shadow:0 0 0 2px var(--promo-cor,#e0245e), 0 12px 28px rgba(0,0,0,.16); }
  .card .foto .promo-band{ position:absolute; left:0; right:0; bottom:0; z-index:3; overflow:hidden; background:var(--promo-cor,#e0245e); color:#fff; font-weight:800; font-size:.98rem; line-height:1.2; padding:11px 12px; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,.35); box-shadow:0 -6px 14px rgba(0,0,0,.25); }
  .card .foto .promo-band::after{ content:''; position:absolute; top:0; bottom:0; left:-60%; width:38%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform:skewX(-20deg); animation:promoBrilho 3.2s ease-in-out infinite; }
  @keyframes promoBrilho{ 0%{ left:-60%; } 55%,100%{ left:135%; } }
  .card .foto .promo-ribbon{ position:absolute; top:16px; left:-42px; width:150px; z-index:4; transform:rotate(-45deg); text-align:center; background:linear-gradient(90deg,#ffb300,#ff7a00); color:#fff; font-size:.66rem; font-weight:800; letter-spacing:1.5px; padding:5px 0; box-shadow:0 3px 8px rgba(0,0,0,.35); animation:promoPulsar 1.8s ease-in-out infinite; }
  @keyframes promoPulsar{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.2); } }
  @media (prefers-reduced-motion: reduce){ .card .foto .promo-band::after{ animation:none; display:none; } .card .foto .promo-ribbon{ animation:none; } }
  .fav-btn{ position:absolute; top:10px; right:10px; z-index:3; width:36px; height:36px; border-radius:50%; border:none; cursor:pointer; background:rgba(255,255,255,.9); box-shadow:0 2px 8px rgba(0,0,0,.2); font-size:1.15rem; line-height:1; display:flex; align-items:center; justify-content:center; color:#c0392b; transition:transform .12s ease; -webkit-tap-highlight-color:transparent; }
  .fav-btn:active{ transform:scale(.85); }
  .fav-btn.on{ background:#c0392b; color:#fff; }
  .card .corpo{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .card .nome{ font-family:'Playfair Display', serif; font-weight:700; font-size:1.15rem; line-height:1.2; }
  .card .sub{ font-size:.86rem; color:var(--muted); font-weight:600; min-height:1.1em; }
  /* Avaliação por estrelas */
  .stars{ margin-top:6px; }
  .stars-row{ display:flex; gap:2px; }
  .stars .star{ border:none; background:transparent; padding:0 1px; cursor:pointer; font-size:1.15rem; line-height:1; color:#d9d2c4; -webkit-tap-highlight-color:transparent; transition:transform .1s ease; }
  .stars .star.on{ color:#f5b301; }
  .stars .star:active{ transform:scale(1.25); }
  .stars-info{ font-size:.74rem; color:var(--muted); font-weight:600; margin-top:2px; }
  .card .acoes{ margin-top:12px; display:flex; gap:8px; }
  .card .btn{ flex:1; text-align:center; padding:10px; border-radius:11px; font-weight:800; font-size:.88rem; }
  .card .btn-menu{ background:var(--terra); color:#fff; }
  .card .btn-menu:hover{ background:var(--terra-esc); }
  .card .btn-res{ border:1.5px solid var(--linha); color:var(--ink); }
  .card .btn-res:hover{ border-color:var(--terra); color:var(--terra-esc); }

  .estado{ text-align:center; padding:60px 20px; color:var(--muted); font-weight:600; }
  .spinner{ width:34px; height:34px; border:3px solid var(--linha); border-top-color:var(--terra); border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  footer{ margin-top:30px; border-top:1px solid var(--linha); background:#fff; }
  .foot-in{ padding:30px 0 calc(40px + env(safe-area-inset-bottom)); text-align:center; color:var(--muted); font-weight:600; font-size:.92rem; }
  .foot-in .cta{ display:inline-block; margin-bottom:14px; background:var(--ink); color:#fff; font-weight:800; padding:12px 22px; border-radius:999px; }
  .foot-in .cta:hover{ background:#000; }
  .foot-in .marca{ font-family:'Playfair Display', serif; font-weight:700; color:var(--ink); }
  /* QR no cabeçalho (leva para o amesadigital.pt) — clicável para ampliar/partilhar */
  .qr-scan{ display:flex; align-items:center; gap:8px; background:none; border:none; padding:0; cursor:pointer; font-family:inherit; flex:0 0 auto; }
  .qr-scan .qr-scan-label{ font-size:.72rem; font-weight:800; letter-spacing:2px; color:var(--terra); }
  .qr-scan:hover .qr-montra{ border-color:var(--terra); }
  .qr-montra{ display:inline-block; padding:4px; background:#fff; border:1px solid var(--linha); border-radius:8px; line-height:0; transition:border-color .15s; }
  .qr-montra img, .qr-montra canvas{ display:block; width:46px; height:46px; }
  /* Modal do QR grande */
  .qr-overlay{ display:none; position:fixed; inset:0; z-index:2000; background:rgba(30,20,10,.6); align-items:center; justify-content:center; padding:20px; -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  .qr-overlay.aberto{ display:flex; }
  .qr-modal{ position:relative; background:#fff; border-radius:22px; padding:26px 24px 24px; text-align:center; width:100%; max-width:330px; box-shadow:0 14px 44px rgba(0,0,0,.32); }
  .qr-close{ position:absolute; top:8px; right:12px; background:none; border:none; font-size:1.3rem; line-height:1; color:var(--muted); cursor:pointer; }
  .qr-modal-tit{ font-size:.95rem; color:var(--muted); font-weight:600; margin-bottom:16px; }
  .qr-big{ display:inline-block; line-height:0; }
  .qr-big img, .qr-big canvas{ display:block; width:240px; height:240px; }
  .qr-url{ margin:16px 0 18px; font-weight:800; color:var(--ink); font-size:1.1rem; }
  .qr-share{ background:var(--terra); color:#fff; border:none; border-radius:999px; padding:12px 28px; font-weight:800; font-size:.95rem; cursor:pointer; }
  .qr-share:hover{ background:var(--terra-esc); }

  .filtros{ display:flex; gap:8px; overflow-x:auto; padding:6px 2px 4px; margin-top:18px; -webkit-overflow-scrolling:touch; }
  .filtros::-webkit-scrollbar{ height:0; }
  .chip{ flex:0 0 auto; padding:8px 15px; border-radius:999px; border:1.5px solid var(--linha); background:#fff; color:var(--ink); font-weight:700; font-size:.9rem; cursor:pointer; white-space:nowrap; transition:.15s; }
  .chip:hover{ border-color:var(--terra); }
  .chip.on{ background:var(--terra); border-color:var(--terra); color:#fff; }

  .card .tag{ align-self:flex-start; margin-top:2px; background:#f3e7d6; color:var(--terra-esc); font-weight:800; font-size:.72rem; letter-spacing:.3px; padding:3px 9px; border-radius:999px; }

  /* Proporção fixa da caixa de publicidade: a imagem preenche sempre (recorte automático), em qualquer ecrã.
     Proporção 3:1 (largura:altura). Construir imagens nesta proporção — ver medidas recomendadas. */
  :root{ --ad-ratio: 3 / 1; }
  .ad-faixa{ position:relative; grid-column:1 / -1; border-radius:16px; overflow:hidden; border:1px dashed var(--gold); aspect-ratio:var(--ad-ratio); display:block; }
  .ad-faixa img{ width:100%; height:100%; object-fit:cover; display:block; }
  /* PNG: sem caixa nem moldura — a imagem aparece solta, na forma natural, com a transparência a mostrar a página */
  .ad-faixa.ad-png{ border:none; border-radius:0; overflow:visible; aspect-ratio:auto; background:transparent; text-align:center; }
  .ad-faixa.ad-png img{ width:var(--adw,100%); max-width:100%; height:auto; object-fit:contain; display:inline-block; margin:0 auto; }
  /* No telemóvel usa a largura própria definida no painel (pode passar de 100%, saindo para fora da coluna) */
  @media (max-width:640px){ .ad-faixa.ad-png img{ width:var(--adwm,100%); max-width:none; } }
  .ad-ph{ position:relative; grid-column:1 / -1; border:1px dashed var(--gold); border-radius:16px; background:repeating-linear-gradient(45deg, #fff8ec 0 12px, #fdf1dc 12px 24px); aspect-ratio:var(--ad-ratio); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#b08a3a; }
  .ad-tag{ position:absolute; top:8px; left:8px; z-index:2; font-size:.62rem; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#fff; background:rgba(0,0,0,0.55); padding:3px 8px; border-radius:6px; pointer-events:none; }
  .ad-slot{ grid-column:1 / -1; transition:opacity .38s ease; }
  .ad-ph .t{ font-family:'Playfair Display', serif; font-weight:700; font-size:1.05rem; }
  .ad-ph .s{ font-size:.82rem; font-weight:700; opacity:.8; }
  .ad-topo{ margin-top:20px; }
</style>

    <div class="qr-modal-tit">Aponta a câmara para abrir o ÀMesa</div>
    <div id="qrBig" class="qr-big"></div>
    <div class="qr-url">amesadigital.pt</div>
    <button id="qrShare" class="qr-share" type="button">Partilhar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // QR code da própria montra (leva para o amesadigital.pt) — pequeno no cabeçalho, grande ao clicar
  (function(){
    try{
      if(!window.QRCode) return;
      var url = location.origin + '/';
      var box = document.getElementById('qrMontra');
      if(box){ new QRCode(box, { text: url, width: 46, height: 46, colorDark: '#c05a3a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H }); }
      var big = document.getElementById('qrBig');
      if(big){ new QRCode(big, { text: url, width: 240, height: 240, colorDark: '#1a1a1a', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H }); }
      var ov = document.getElementById('qrOverlay');
      var btn = document.getElementById('qrScanBtn');
      var fecharBtn = document.getElementById('qrClose');
      var shareBtn = document.getElementById('qrShare');
      function abrir(){ if(ov) ov.classList.add('aberto'); }
      function fechar(){ if(ov) ov.classList.remove('aberto'); }
      if(btn) btn.addEventListener('click', abrir);
      if(fecharBtn) fecharBtn.addEventListener('click', fechar);
      if(ov) ov.addEventListener('click', function(e){ if(e.target === ov) fechar(); });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') fechar(); });
      if(shareBtn) shareBtn.addEventListener('click', async function(){
        var dados = { title: 'ÀMesa', text: 'Descobre restaurantes e menus no ÀMesa', url: url };
        if(navigator.share){ try{ await navigator.share(dados); }catch(e){} }
        else if(navigator.clipboard && navigator.clipboard.writeText){ try{ await navigator.clipboard.writeText(url); shareBtn.textContent = 'Link copiado!'; setTimeout(function(){ shareBtn.textContent = 'Partilhar'; }, 1600); }catch(e){} }
      });
    }catch(e){}
  })();
</script>
<script>
  var FONTES_PROMO = { anton:"'Anton', sans-serif", bebas:"'Bebas Neue', sans-serif", fredoka:"'Fredoka', sans-serif", playfair:"'Playfair Display', serif", pacifico:"'Pacifico', cursive" };
  var SUPA_URL = 'https://zewiijcrkyxjkhudlplk.supabase.co';
  var SUPA_KEY = 'sb_publishable_6LP7x2v5c-c9DQkQslnUmA_g13SEjp3';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  // === Métricas (1 por dispositivo/dia; usa a função inc_metrica do Supabase) ===
  function _hojeStr(){ try{ return new Date().toISOString().slice(0, 10); }catch(e){ return '0'; } }
  function _umaVezDia(chave){ try{ var k = chave + '_' + _hojeStr(); if(localStorage.getItem(k) === '1') return false; localStorage.setItem(k, '1'); return true; }catch(e){ return true; } }
  function incMetrica(slug, tipo){
    if(!slug) return;
    try{
      fetch(SUPA_URL + '/rest/v1/rpc/inc_metrica', {
        method: 'POST',
        headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_slug: slug, p_tipo: tipo }),
        keepalive: true
      }).catch(function(){});
    }catch(e){}
  }
  // Observa os espaços de publicidade e conta uma impressão sempre que um anúncio fica visível
  var adIO = ('IntersectionObserver' in window) ? new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      var sl = en.target;
      sl._vis = en.isIntersecting;
      if(en.isIntersecting && sl._adId && _umaVezDia('adv_' + sl._adId)){ incMetrica('ad:' + sl._adId, 'view'); }
    });
  }, { threshold: 0.4 }) : null;

  function fotoDoConfig(cfg){
    try{
      if(!cfg) return '';
      if(cfg.header && cfg.header.fotosAtivas !== false && cfg.header.fotos && cfg.header.fotos.length) return cfg.header.fotos[0];
      if(cfg.intro && cfg.intro.foto) return cfg.intro.foto;
      if(cfg.footer && cfg.footer.fotos && cfg.footer.fotos.length) return cfg.footer.fotos[0];
      if(cfg.fundo && cfg.fundo.imagem) return cfg.fundo.imagem;
    }catch(e){}
    return '';
  }
  function corDoConfig(cfg){ try{ if(cfg && cfg.header && cfg.header.cor) return cfg.header.cor; }catch(e){} return ''; }
  function subDoConfig(cfg){
    try{
      if(cfg){
        if(cfg.header && cfg.header.subtitulo) return cfg.header.subtitulo;
        if(cfg.footer && cfg.footer.morada) return cfg.footer.morada;
      }
    }catch(e){}
    return '';
  }

  // ---- Favoritos (guardados no telemóvel de cada visitante) ----
  var soFav = false;
  function favGet(){ try{ return JSON.parse(localStorage.getItem('amesaFavNeg') || '[]'); }catch(e){ return []; } }
  function favTem(slug){ return favGet().indexOf(slug) >= 0; }
  function favToggle(slug){ var a = favGet(); var i = a.indexOf(slug); if(i >= 0) a.splice(i,1); else a.push(slug); try{ localStorage.setItem('amesaFavNeg', JSON.stringify(a)); }catch(e){} return i < 0; }

  var TODOS = [];
  var filtroTipo = '';

  // === Publicidade da ÀMesa — gerida no painel (guardada na linha '__amesa__') ===
  // Cada anúncio: { img, titulo, sub, slug (restaurante da ÀMesa) | link (externo) }
  var AMESA_SLUG = '__amesa__';
  var ADS = [];
  var ADS_INT = 5;   // segundos entre trocas (definido no painel)
  var AD_TAG = '<span class="ad-tag">Publicidade</span>';
  function adHTML(ad){
    if(!ad) return '';
    var href = ad.slug ? ('/' + encodeURIComponent(ad.slug)) : (ad.link || '');
    var ext = !ad.slug && !!ad.link;   // link externo abre em nova aba
    var attrs = ext ? ' target="_blank" rel="noopener"' : '';
    if(ad.img){
      var isPng = /\.png(\?|$)/i.test(ad.img) || /^data:image\/png/i.test(ad.img);
      var cls = 'ad-faixa' + (isPng ? ' ad-png' : '');
      var _d = (ad.escala && ad.escala > 0) ? ad.escala : 100;
      var _m = (ad.escalaMob && ad.escalaMob > 0) ? ad.escalaMob : 100;
      var wsty = isPng ? (' style="--adw:' + _d + '%;--adwm:' + _m + '%"') : '';
      var img = AD_TAG + '<img src="' + esc(ad.img) + '" alt="' + esc(ad.titulo || 'Publicidade') + '"' + wsty + '>';
      return href ? ('<a class="' + cls + '" href="' + esc(href) + '"' + attrs + '>' + img + '</a>')
                  : ('<div class="' + cls + '">' + img + '</div>');
    }
    var corpo = AD_TAG + '<div class="t">' + esc(ad.titulo || 'Publicidade') + '</div><div class="s">' + esc(ad.sub || '') + '</div>';
    return href ? ('<a class="ad-ph" href="' + esc(href) + '"' + attrs + ' style="text-decoration:none;">' + corpo + '</a>')
                : ('<div class="ad-ph">' + corpo + '</div>');
  }
  function tipoDoConfig(cfg){ try{ return (cfg && cfg.tipo) ? String(cfg.tipo).trim() : ''; }catch(e){ return ''; } }

  function renderFiltros(){
    var tipos = [];
    TODOS.forEach(function(n){ var t = tipoDoConfig(n.config); if(t && tipos.indexOf(t) < 0) tipos.push(t); });
    tipos.sort(function(a,b){ return a.localeCompare(b); });
    var el = document.getElementById('filtros');
    var temFav = favGet().length > 0;
    var chips = [];
    if(temFav || soFav) chips.push('<button class="chip fav-chip' + (soFav ? ' on' : '') + '" data-fav-chip="1">❤ Favoritos</button>');
    if(temFav || soFav || tipos.length) chips.push('<button class="chip' + (filtroTipo === '' && !soFav ? ' on' : '') + '" data-t="">Todos</button>');
    tipos.forEach(function(t){ chips.push('<button class="chip' + (filtroTipo === t && !soFav ? ' on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</button>'); });
    el.innerHTML = chips.join('');
    el.querySelectorAll('.chip[data-t]').forEach(function(b){ b.onclick = function(){ soFav = false; filtroTipo = b.getAttribute('data-t'); renderFiltros(); aplicar(); }; });
    var _fc = el.querySelector('[data-fav-chip]'); if(_fc) _fc.onclick = function(){ soFav = !soFav; renderFiltros(); aplicar(); };
  }

  // ===== Avaliação por estrelas (média por restaurante, guardada no Supabase) =====
  function ratingDe(n){
    var s = Number(n && n.rating_soma) || 0;
    var c = Number(n && n.rating_contagem) || 0;
    return { soma: s, cont: c, media: c > 0 ? (s / c) : 0 };
  }
  function meuVoto(slug){ try{ var v = parseInt(localStorage.getItem('amesaRating:' + slug), 10); return (v >= 1 && v <= 5) ? v : 0; }catch(e){ return 0; } }
  function estrelasHTML(slug, media, total){
    var meu = meuVoto(slug);
    var cheio = Math.round(media);   // as estrelas mostram SEMPRE a média do negócio (o que as pessoas querem saber); o voto próprio fica assinalado no texto
    var row = '';
    for(var i = 1; i <= 5; i++){
      row += '<button type="button" class="star' + (i <= cheio ? ' on' : '') + '" data-star="' + i + '" data-slug="' + esc(slug) + '" aria-label="' + i + ' de 5 estrelas">★</button>';
    }
    var info = total > 0
      ? (media.toFixed(1) + ' · ' + total + (total === 1 ? ' voto' : ' votos') + (meu ? ' · avaliaste' : ''))
      : 'Sê o primeiro a avaliar';
    return '<div class="stars-row">' + row + '</div><div class="stars-info">' + info + '</div>';
  }
  function estrelasContainer(slug, n){
    var r = ratingDe(n);
    return '<div class="stars" data-slug="' + esc(slug) + '">' + estrelasHTML(slug, r.media, r.cont) + '</div>';
  }
  function votarEstrelas(slug, val){
    if(!slug || !(val >= 1 && val <= 5)) return;
    var anterior = meuVoto(slug);   // se este telemóvel já votou, troca o voto (não soma outro)
    var n = TODOS.find(function(x){ return x && x.slug === slug; });
    var contAtual = n ? (Number(n.rating_contagem) || 0) : 0;
    // Só "troca de voto" se o negócio AINDA tiver votos. Se estiver a 0 (ex.: acabou de ser reposto),
    // o voto guardado no telemóvel já não existe no servidor, por isso conta como voto novo.
    var trocaVoto = (anterior >= 1 && anterior <= 5) && contAtual > 0;
    if(n){
      n.rating_soma = Number(n.rating_soma) || 0;
      n.rating_contagem = contAtual;
      if(trocaVoto){ n.rating_soma += (val - anterior); }
      else { n.rating_soma += val; n.rating_contagem += 1; }
    }
    try{ localStorage.setItem('amesaRating:' + slug, String(val)); }catch(e){}
    // re-desenha as estrelas deste cartão
    var cont = document.querySelector('.stars[data-slug="' + slug.replace(/"/g, '\\"') + '"]');
    if(n && cont){ var rr = ratingDe(n); cont.innerHTML = estrelasHTML(slug, rr.media, rr.cont); }
    // envia ao servidor (p_anterior=0 = voto novo; >0 = trocou de voto, ajusta a soma sem mexer na contagem)
    fetch(SUPA_URL + '/rest/v1/rpc/add_rating', {
      method: 'POST',
      headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_slug: slug, p_estrelas: val, p_anterior: trocaVoto ? anterior : 0 })
    }).catch(function(){});
  }

  function render(lista){
    var grid = document.getElementById('grid');
    var cont = document.getElementById('contador');
    cont.textContent = lista.length ? (lista.length + (lista.length === 1 ? ' restaurante' : ' restaurantes')) : '';
    if(!lista.length){ grid.innerHTML = ''; document.getElementById('estado').innerHTML = 'Ainda não há restaurantes por aqui.'; document.getElementById('estado').style.display = 'block'; return; }
    document.getElementById('estado').style.display = 'none';
    var cards = lista.map(function(n){
      var slug = String(n.slug || '').toLowerCase();
      var nome = n.nome || (n.config && n.config.header && n.config.header.titulo) || 'Restaurante';
      var foto = fotoDoConfig(n.config);
      var cor = corDoConfig(n.config);
      var sub = subDoConfig(n.config);
      var tipo = tipoDoConfig(n.config);
      var inicial = esc((nome.trim()[0] || 'À').toUpperCase());
      // Promoção do dono (grátis) — foto com texto por cima, no cartão da montra
      var promo = (n.config && n.config.promo && n.config.promo.ativo) ? n.config.promo : null;
      var promoTxt = (promo && promo.texto) ? String(promo.texto).trim() : '';
      var promoFoto = (promo && promo.foto) ? promo.foto : '';
      if(!(promoTxt || promoFoto)) promo = null;
      var promoCor = (promo && /^#[0-9a-fA-F]{3,8}$/.test(String(promo.cor||''))) ? promo.cor : '#e0245e';
      var _pt2 = promo ? parseInt(promo.tamanho, 10) : 0;
      var promoTam = (_pt2 >= 11 && _pt2 <= 30) ? _pt2 : 16;
      var promoFonteCss = (promo && FONTES_PROMO[promo.fonte]) ? FONTES_PROMO[promo.fonte] : '';
      var promoBandStyle = 'font-size:' + promoTam + 'px;' + (promoFonteCss ? (' font-family:' + promoFonteCss + ';') : '');
      var fotoCartao = promoFoto || foto;   // se houver foto de promoção, é essa que aparece no cartão
      var estiloFoto = fotoCartao ? ('background-image:url(\'' + esc(fotoCartao) + '\')') : (cor ? ('background:' + esc(cor)) : '');
      var cardapio = '/' + encodeURIComponent(slug);
      var reservas = 'reservas.html?n=' + encodeURIComponent(slug);
      return '' +
        '<article class="card' + (promo ? ' tem-promo' : '') + '"' + (promo ? (' style="--promo-cor:' + promoCor + '"') : '') + ' data-slug="' + esc(slug) + '">' +
          '<button type="button" class="fav-btn' + (favTem(slug) ? ' on' : '') + '" data-fav="' + esc(slug) + '" aria-label="Favorito">' + (favTem(slug) ? '♥' : '♡') + '</button>' +
          '<a class="foto" style="' + estiloFoto + '" href="' + cardapio + '" aria-label="' + esc(nome) + '">' +
            (fotoCartao ? '' : '<span class="inicial">' + inicial + '</span>') +
            (promo ? '<span class="promo-ribbon">PROMO</span>' : '') +
            (promoTxt ? '<div class="promo-band" style="' + promoBandStyle + '">' + esc(promoTxt) + '</div>' : '') +
          '</a>' +
          '<div class="corpo">' +
            '<div class="nome">' + esc(nome) + '</div>' +
            '<div class="sub">' + esc(sub) + '</div>' +
            (tipo ? '<div class="tag">' + esc(tipo) + '</div>' : '') +
            estrelasContainer(slug, n) +
          '</div>' +
        '</article>';
    });
    var out = [];
    var slot = 1;   // 0 é a faixa de topo; os espaços entre cards seguem-se
    cards.forEach(function(c, i){
      out.push(c);
      if((i + 1) % 6 === 0 && (i + 1) < cards.length && ADS.length){ out.push('<div class="ad-slot" data-off="' + (slot++) + '"></div>'); }
    });
    grid.innerHTML = out.join('');
    pintarAds();
  }

  // === Rotação/carrossel de publicidade (intervalo definido no painel) ===
  var adTick = 0, adTimer = null;
  function _adId(ad, idx){ return (ad && ad.id) ? ad.id : ('a' + idx); }
  // Anúncios elegíveis para o bloco B: os marcados para "todos" (ou sem bloco) + os desse bloco
  function _adsDoBloco(B){
    return ADS.filter(function(a){
      var b = (a && a.bloco != null && a.bloco !== '') ? String(a.bloco) : 'todos';
      return b === 'todos' || b === String(B);
    });
  }
  function pintarAds(contar){
    if(!ADS.length) return;
    document.querySelectorAll('.ad-slot').forEach(function(sl){
      var off = parseInt(sl.getAttribute('data-off'), 10) || 0;
      var elig = _adsDoBloco(off);
      if(!elig.length){ sl.innerHTML = ''; sl._adId = null; return; }
      var idx = (off + adTick) % elig.length;
      var ad = elig[idx];
      sl.innerHTML = adHTML(ad);
      sl._adId = _adId(ad, idx);
      if(adIO) adIO.observe(sl);
      if(contar && sl._vis && _umaVezDia('adv_' + sl._adId)){ incMetrica('ad:' + sl._adId, 'view'); }
    });
  }
  function rodarAds(){
    if(adTimer){ clearInterval(adTimer); adTimer = null; }
    if(ADS.length > 1 && ADS_INT > 0){
      adTimer = setInterval(function(){
        var slots = document.querySelectorAll('.ad-slot');
        slots.forEach(function(s){ s.style.opacity = '0'; });
        setTimeout(function(){ adTick++; pintarAds(true); slots.forEach(function(s){ s.style.opacity = '1'; }); }, 380);
      }, ADS_INT * 1000);
    }
  }

  function aplicar(){
    var q = (document.getElementById('busca').value || '').trim().toLowerCase();
    render(TODOS.filter(function(n){
      var nome = (n.nome || (n.config && n.config.header && n.config.header.titulo) || '').toLowerCase();
      var sub = subDoConfig(n.config).toLowerCase();
      var tipo = tipoDoConfig(n.config);
      var okBusca = !q || nome.indexOf(q) >= 0 || sub.indexOf(q) >= 0 || tipo.toLowerCase().indexOf(q) >= 0;
      var okTipo = !filtroTipo || tipo === filtroTipo;
      var okFav = !soFav || favTem(String(n.slug || '').toLowerCase());
      return okBusca && okTipo && okFav;
    }));
  }

  document.getElementById('busca').addEventListener('input', aplicar);

  // Coração: guardar/tirar dos favoritos
  document.addEventListener('click', function(e){
    var fb = e.target && e.target.closest ? e.target.closest('.fav-btn') : null;
    if(!fb) return;
    e.preventDefault(); e.stopPropagation();
    var slug = fb.getAttribute('data-fav');
    var agora = favToggle(slug);
    fb.classList.toggle('on', agora); fb.textContent = agora ? '♥' : '♡';
    renderFiltros();
    if(soFav) aplicar();
  });

  // Estrelas: avaliar o restaurante
  document.addEventListener('click', function(e){
    var st = e.target && e.target.closest ? e.target.closest('.star') : null;
    if(!st) return;
    e.preventDefault(); e.stopPropagation();
    votarEstrelas(st.getAttribute('data-slug'), parseInt(st.getAttribute('data-star'), 10));
  });

  // Cliques: restaurante (via card) e publicidade (via slot). Conta antes de o link navegar.
  document.addEventListener('click', function(e){
    var t = e.target;
    var sl = t.closest ? t.closest('.ad-slot') : null;
    if(sl && sl._adId && (t.closest('a') || t.closest('.ad-faixa') || t.closest('.ad-ph'))){ if(_umaVezDia('adc_' + sl._adId)) incMetrica('ad:' + sl._adId, 'click'); return; }
    var card = t.closest ? t.closest('.card[data-slug]') : null;
    if(card && t.closest('a')){ var _cs = card.getAttribute('data-slug'); if(_umaVezDia('amc_' + _cs)) incMetrica(_cs, 'amesa'); }
  }, true);

  // Cartão todo clicável: clicar em qualquer parte (menos coração, estrelas ou links) abre o menu
  document.addEventListener('click', function(e){
    if(e.target.closest('.fav-btn') || e.target.closest('.stars') || e.target.closest('a')) return;
    var card = e.target.closest ? e.target.closest('.card[data-slug]') : null;
    if(!card) return;
    var cs = card.getAttribute('data-slug');
    if(_umaVezDia('amc_' + cs)) incMetrica(cs, 'amesa');
    location.href = '/' + encodeURIComponent(cs);
  });

  (function(){
    var hdr = { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY } };
    var base = SUPA_URL + '/rest/v1/negocios?order=nome.asc&select=';
    var rico = 'slug,nome,config,apagado_em,rating_soma,rating_contagem';
    var simples = 'slug,nome,config,apagado_em';
    // Tenta com as colunas das estrelas; se ainda não existirem na BD, cai para o select antigo
    return fetch(base + rico, hdr).then(function(r){
      if(r.ok) return r.json();
      return fetch(base + simples, hdr).then(function(r2){ if(!r2.ok) throw new Error(r2.status); return r2.json(); });
    });
  })()
    .then(function(dados){
      dados = dados || [];
      var reservado = dados.find(function(n){ return n && n.slug === AMESA_SLUG; });
      ADS = (reservado && reservado.config && Array.isArray(reservado.config.ads))
        ? reservado.config.ads.filter(function(a){ return a && (a.img || a.titulo); })
        : [];
      ADS_INT = (reservado && reservado.config && reservado.config.adsIntervalo > 0) ? reservado.config.adsIntervalo : 5;
      // Mostra todos os negócios reais por defeito; só esconde os marcados com config.oculto === true
      TODOS = dados.filter(function(n){ return n && n.slug && n.slug !== AMESA_SLUG && !n.apagado_em && !(n.config && n.config.oculto === true); });
      renderFiltros();
      document.getElementById('adTopo').innerHTML = _adsDoBloco(0).length ? '<div class="ad-slot" data-off="0"></div>' : '';
      aplicar();          // renderiza os cards + pinta os anúncios
      pintarAds();        // garante a faixa de topo preenchida
      rodarAds();         // arranca o carrossel se houver mais que um anúncio
    })
    .catch(function(err){
      document.getElementById('estado').innerHTML = 'Não foi possível carregar os restaurantes agora. Tenta atualizar a página.';
    });
</script>
</body>
