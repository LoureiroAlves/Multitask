<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Repor password — ÀMesa</title>
<script>/* Domínio oficial: se abrir pelo GitHub Pages, salta para o amesadigital.pt */(function(){try{if(/github\.io$/i.test(location.hostname)){location.replace('https://amesadigital.pt'+location.pathname.replace(/^\/Multitask/i,'')+location.search+location.hash);}}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --terra:#a8712f; --terra-esc:#7a5320; --linha:#e7d9c4; --ink:#3a2c18; --muted:#8a7a63; --ok:#2f8a4f; --erro:#b3402f; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:linear-gradient(180deg,#fdfaf4,#f4ead9); color:var(--ink); }
  .card{ width:100%; max-width:400px; background:#fff; border:1px solid var(--linha); border-radius:18px; padding:22px 20px; box-shadow:0 8px 22px rgba(120,90,50,.1); }
  .logo{ font-family:Georgia,serif; font-weight:700; font-size:1.5rem; color:var(--terra-esc); text-align:center; }
  h1{ font-size:1.15rem; margin:10px 0 4px; text-align:center; }
  p{ color:var(--muted); font-size:.9rem; text-align:center; margin:0 0 14px; }
  label{ display:block; font-weight:700; font-size:.88rem; margin:12px 0 5px; }
  input{ width:100%; padding:12px; border:1.5px solid var(--linha); border-radius:12px; font-size:1rem; font-family:inherit; }
  input:focus{ outline:none; border-color:var(--terra); }
  button{ width:100%; margin-top:16px; border:none; border-radius:12px; padding:14px; font-weight:800; font-size:1rem; cursor:pointer; color:#fff; background:linear-gradient(180deg,var(--terra),var(--terra-esc)); font-family:inherit; }
  button:disabled{ opacity:.6; }
  .msg{ margin-top:12px; font-size:.88rem; text-align:center; min-height:1em; }
  .msg.erro{ color:var(--erro); font-weight:700; } .msg.ok{ color:var(--ok); font-weight:700; }
  .hide{ display:none; }
  a{ color:var(--terra-esc); font-weight:700; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">ÀMesa</div>

  <!-- 1) pedir o email com o link -->
  <div id="passoPedir">
    <h1>Esqueci-me da password</h1>
    <p>Escreve o email com que entras. Enviamos-te um link para criares uma password nova.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" autocapitalize="off" placeholder="o-teu@email.pt">
    <button id="btnPedir" type="button">Enviar link</button>
  </div>

  <!-- 2) definir a nova password (depois de abrir o link do email) -->
  <div id="passoNova" class="hide">
    <h1>Nova password</h1>
    <p id="novaQuem">Escolhe uma password nova para a tua conta.</p>
    <label for="p1">Nova password</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="mínimo 8 caracteres">
    <label for="p2">Repete a password</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button id="btnGuardar" type="button">Guardar nova password</button>
  </div>

  <!-- 3) feito -->
  <div id="passoFeito" class="hide">
    <h1>Password alterada ✓</h1>
    <p>Já podes entrar com a password nova.</p>
    <a id="linkVolta" href="calendario.html">Voltar para entrar</a>
  </div>

  <div class="msg" id="msg"></div>
</div>

<script>
(function(){
  var sb = supabase.createClient('https://zewiijcrkyxjkhudlplk.supabase.co', 'sb_publishable_6LP7x2v5c-c9DQkQslnUmA_g13SEjp3');
  var q = new URLSearchParams(location.search);
  // para onde voltar no fim (só páginas deste site)
  var volta = (q.get('volta') || '').replace(/[^a-z0-9._\-?=&]/gi, '');
  if(!/^(calendario|painel|editar)\.html/.test(volta)) volta = 'calendario.html';
  function $(id){ return document.getElementById(id); }
  function msg(t, tipo){ var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (tipo ? (' ' + tipo) : ''); }
  function mostra(id){ ['passoPedir','passoNova','passoFeito'].forEach(function(x){ $(x).classList.toggle('hide', x !== id); }); }
  $('linkVolta').href = volta;
  if(q.get('email')) $('email').value = q.get('email');

  // o link do email traz uma sessão de recuperação (no endereço) — o Supabase lê-a sozinho
  var emRecuperacao = /type=recovery/.test(location.hash) || q.has('code') || /access_token=/.test(location.hash);
  sb.auth.onAuthStateChange(function(ev, sessao){
    if(ev === 'PASSWORD_RECOVERY' || (emRecuperacao && sessao)){
      mostra('passoNova'); msg('');
      if(sessao && sessao.user && sessao.user.email) $('novaQuem').textContent = 'Conta: ' + sessao.user.email;
    }
  });
  if(/error_description=/.test(location.hash)){
    var d = decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' ');
    msg('O link já não é válido (' + d + '). Pede um novo abaixo.', 'erro');
  }

  $('btnPedir').onclick = async function(){
    var email = $('email').value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg('Escreve um email válido.', 'erro'); $('email').focus(); return; }
    this.disabled = true; msg('A enviar…');
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + '?volta=' + encodeURIComponent(volta) });
    this.disabled = false;
    if(r.error){ msg('Erro: ' + r.error.message, 'erro'); return; }
    msg('Se este email tiver conta, vai receber um link dentro de 1 a 2 minutos. Vê também o spam.', 'ok');
  };

  $('btnGuardar').onclick = async function(){
    var a = $('p1').value, b = $('p2').value;
    if(a.length < 8){ msg('A password tem de ter pelo menos 8 caracteres.', 'erro'); return; }
    if(a !== b){ msg('As duas passwords não são iguais.', 'erro'); return; }
    this.disabled = true; msg('A guardar…');
    var r = await sb.auth.updateUser({ password: a, data: { senhaDefinida: true } });
    this.disabled = false;
    if(r.error){ msg('Erro: ' + r.error.message + ' — pede um link novo.', 'erro'); return; }
    try{ history.replaceState(null, '', location.pathname + '?volta=' + encodeURIComponent(volta)); }catch(e){}
    mostra('passoFeito'); msg('');
  };
})();
</script>
</body>
</html>
