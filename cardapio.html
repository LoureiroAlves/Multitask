    function comporMoldura(dataUrl){
      const img = new Image();
      img.onload = () => {
        const maxLado = 1080;
        let w = img.width, h = img.height;
        if(Math.max(w,h) > maxLado){ const s = maxLado/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const desenhar = () => { desenharMoldura(ctx, w, h); mostrarResultado(canvas); };
        if(document.fonts && document.fonts.ready) document.fonts.ready.then(desenhar).catch(desenhar);
        else desenhar();
      };
      img.src = dataUrl;
    }

    // Paletas das várias molduras
    const MOLDES = {
      classica: { borda:'#4a3820', linha:'#a8712f', banner:'rgba(74,56,32,0.94)', nome:'#ffffff', social:'#e6dcc8' },
      dourada:  { borda:'#a8712f', linha:'#f0d9a0', banner:'rgba(168,113,47,0.96)', nome:'#fff8e8', social:'#ffeccb' },
      escura:   { borda:'#111318', linha:'', banner:'rgba(10,12,16,0.9)', nome:'#ffffff', social:'#c8cdd6' },
      clara:    { borda:'#ffffff', linha:'#e2d9c6', banner:'rgba(255,255,255,0.94)', nome:'#3a2c18', social:'#8a7a5c' },
      festa:    { borda:'festa', linha:'', banner:'rgba(20,18,30,0.9)', nome:'#ffffff', social:'#ffd5f0' }
    };
    function desenharMoldura(ctx, w, h){
      const min = Math.min(w, h);
      const borda = Math.round(min * 0.035);
      const M = MOLDES[MOLDE] || MOLDES.classica;
      // Borda exterior
      if(M.borda === 'festa'){
        const cores = ['#ff5d8f','#ffb84d','#4dd0e1','#7c4dff','#5cd65c','#ff6b6b'];
        const seg = Math.round((w + h) * 2 / 40);
        ctx.lineWidth = borda; ctx.lineCap = 'butt';
        let i = 0;
        // topo, direita, baixo, esquerda em segmentos coloridos
        const rectPts = [[0,0,w,0],[w,0,w,h],[w,h,0,h],[0,h,0,0]];
        rectPts.forEach(([x1,y1,x2,y2])=>{ const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), n=Math.max(1,Math.round(len/seg)); for(let k=0;k<n;k++){ ctx.strokeStyle=cores[(i++)%cores.length]; ctx.beginPath(); ctx.moveTo(x1+dx*(k/n)+ (dx>0?borda/2:dx<0?-borda/2:0), y1+dy*(k/n)); ctx.lineTo(x1+dx*((k+1)/n), y1+dy*((k+1)/n)); ctx.stroke(); } });
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = borda; ctx.strokeRect(borda/2, borda/2, w-borda, h-borda);
      } else {
        ctx.lineWidth = borda; ctx.strokeStyle = M.borda; ctx.strokeRect(borda/2, borda/2, w - borda, h - borda);
      }
      // Linha interior (se houver)
      if(M.linha){
        const gap = borda * 1.5;
        ctx.lineWidth = Math.max(2, Math.round(min * 0.008));
        ctx.strokeStyle = M.linha;
        ctx.strokeRect(gap, gap, w - gap*2, h - gap*2);
      }
      // Banner inferior com nome + social
      const bannerH = Math.round(h * 0.15);
      const by = h - bannerH - borda;
      ctx.fillStyle = M.banner;
      ctx.fillRect(borda, by, w - borda*2, bannerH);
      ctx.textAlign = 'center';
      ctx.fillStyle = M.nome;
      const fNome = Math.round(bannerH * 0.36);
      ctx.font = '700 ' + fNome + "px 'Fredoka', sans-serif";
      // Nome à prova de falhas: usa o que estiver disponível
      var _nomeUsar = (NOME && String(NOME).trim()) ? NOME : (window.__negNome || window.__nomeRestaurante || (document.title && !/cardápio|pré-visualiza/i.test(document.title) ? document.title : '') || '');
      ctx.fillText(_nomeUsar, w/2, by + bannerH * 0.44, w - borda*3);
      ctx.fillStyle = M.social;
      const fSoc = Math.round(bannerH * 0.20);
      ctx.font = '600 ' + fSoc + "px 'Nunito', sans-serif";
      ctx.fillText(SOCIAL, w/2, by + bannerH * 0.80, w - borda*3);
    }

    function mostrarResultado(canvas){
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      const _nomeFich = (typeof NOME === 'string' && NOME ? NOME.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') : 'foto') + '.jpg';
      function _blobJpeg(){ return new Promise(function(res){ if(canvas.toBlob){ canvas.toBlob(function(b){ res(b); }, 'image/jpeg', 0.85); } else { res(null); } }); }
      async function guardarFoto(){
        const ehMovel = /iphone|ipad|ipod|android/i.test(navigator.userAgent);
        let blob = await _blobJpeg();
        if(blob && ehMovel && navigator.canShare){
          try{
            const file = new File([blob], _nomeFich, { type:'image/jpeg' });
            if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
          }catch(e){ if(e && e.name === 'AbortError') return; }
        }
        const url = blob ? URL.createObjectURL(blob) : dataUrl;
        const a = document.createElement('a'); a.href = url; a.download = _nomeFich;
        document.body.appendChild(a); a.click(); a.remove();
        if(blob) setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      }
      const p = document.getElementById('camPainel');
      p.innerHTML =
        '<h3>A tua foto 📸</h3>' +
        '<img class="preview" src="' + dataUrl + '" alt="Foto com moldura">' +
        '<div class="cam-acoes">' +
        '<button class="cam-guardar" id="camGuardar">⬇️ Guardar na galeria</button>' +
        (navigator.share ? '<button class="cam-partilhar" id="camPartilhar">Partilhar…</button>' : '') +
        '<button class="cam-repetir" id="camRepetir">Tirar outra</button>' +
        '<button class="cam-fechar" id="camFechar">Fechar</button>' +
        '</div>' +
        '<p class="cam-dica">No telemóvel: carrega em <strong>Guardar na galeria</strong> (abre a partilha → "Guardar imagem"). Se não aparecer, <strong>mantém premida a foto acima</strong> e escolhe <strong>Adicionar às Fotos / Guardar imagem</strong>. 💛</p>';

      document.getElementById('camGuardar').onclick = () => { guardarFoto(); };
      const sp = document.getElementById('camPartilhar');
      if(sp) sp.onclick = async () => {
        try{
          const blob = await _blobJpeg();
          const file = blob ? new File([blob], _nomeFich, { type:'image/jpeg' }) : null;
          if(file && navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file] });
          else await navigator.share({ url:(window.__redes && window.__redes.instagram) || location.href });
        }catch(e){}
      };
      document.getElementById('camRepetir').onclick = () => { overlay.classList.remove('aberto'); input.click(); };
      document.getElementById('camFechar').onclick = () => overlay.classList.remove('aberto');
      overlay.classList.add('aberto');
    }
  })();
</script>

<script>
  /* Mantém a publicidade/rodapé sempre abaixo da dobra: se o menu for pequeno,
     estica a capa até o rodapé começar fora do ecrã. Assim só aparece ao fazer scroll. */
  (function(){
    // Modelo Carteira: os cartões (flex:1) crescem para preencher o espaço entre o
    // header e a barra fixa. Com 1–3 secções ficam altos e leem-se bem; com muitas,
    // encolhem até ao mínimo e a página passa a ter scroll. Devolve true se tratou.
    function ajustarCarteira(){
      if(!document.body.classList.contains('modelo-carteira')) return false;
      var grid = document.getElementById('categoriaGrid');
      if(!grid) return true;
      if((window.scrollY || window.pageYOffset || 0) > 4) return true;
      var bar = document.querySelector('.info-fixa');
      var barTop = window.innerHeight;
      if(bar){ var cs = getComputedStyle(bar); if(cs.display !== 'none' && cs.visibility !== 'hidden'){ barTop = bar.getBoundingClientRect().top; } }
      var gridTop = grid.getBoundingClientRect().top;
      var alvo = barTop - gridTop - 8; // pequena folga acima da barra fixa
      grid.style.minHeight = Math.max(0, alvo) + 'px';
      return true;
    }
    // Modelo "Deslizar": a grelha está escondida; o deck é centrado no espaço livre
    // (entre o fim do cabeçalho e a barra fixa), com distância igual em cima e em baixo.
    function ajustarSlider(){
      if(!document.body.classList.contains('modelo-slider')) return false;
      var deck = document.getElementById('menuDeck');
      if(!deck) return true;
      if((window.scrollY || window.pageYOffset || 0) > 4) return true;
      var dots = document.querySelector('.deck-dots');
      deck.style.marginTop = ''; deck.style.marginBottom = ''; if(dots) dots.style.marginBottom = '';
      var bar = document.querySelector('.info-fixa');
      var barSpace = 0;
      if(bar){ var cs = getComputedStyle(bar); if(cs.display !== 'none' && cs.visibility !== 'hidden'){ barSpace = bar.offsetHeight; } }
      var topo = deck.getBoundingClientRect().top;                 // espaço acima do deck (cabeçalho + margens)
      var conteudo = deck.offsetHeight + (dots ? dots.offsetHeight : 0);
      var livre = window.innerHeight - barSpace;                   // altura útil (ecrã menos a barra fixa)
      var folga = Math.max(0, Math.round((livre - topo - conteudo) / 2)); // igual em cima e em baixo
      deck.style.marginTop = folga + 'px';
      if(dots) dots.style.marginBottom = folga + 'px'; else deck.style.marginBottom = folga + 'px';
      return true;
    }
    function ajustarCapa(){
      if(ajustarCarteira()) return; // Carteira tem a sua própria medição
      if(ajustarSlider()) return;   // Deslizar tem a sua própria medição
      var grid = document.getElementById('categoriaGrid');
      var footer = document.getElementById('rodapeFinal');
      if(!grid || !footer) return;
      // Nunca reajustar enquanto o utilizador está a fazer scroll (evita saltos)
      if((window.scrollY || window.pageYOffset || 0) > 4) return;
      grid.style.minHeight = '';
      // Se o rodapé final está desligado, estica a grelha para encher o ecrã até à barra fixa
      // (senão a página fica curta e vê-se o fundo do html por baixo da barra fixa)
      if(getComputedStyle(footer).display === 'none'){
        var bar = document.querySelector('.info-fixa');
        var barTop = window.innerHeight;
        if(bar){ var csb = getComputedStyle(bar); if(csb.display !== 'none' && csb.visibility !== 'hidden'){ barTop = bar.getBoundingClientRect().top; } }
        var gridBottom = grid.getBoundingClientRect().bottom;
        var faltam2 = barTop - gridBottom;
        if(faltam2 > 0){ grid.style.minHeight = (grid.offsetHeight + faltam2) + 'px'; }
        return;
      }
      // posição do topo do rodapé no documento (independente do scroll — evita saltos)
      var footerTopDoc = footer.getBoundingClientRect().top + (window.scrollY || window.pageYOffset || 0);
      var faltam = window.innerHeight - footerTopDoc;
      if(faltam > 0){ grid.style.minHeight = (grid.offsetHeight + faltam + 2) + 'px'; }
    }
    window.__ajustarCapa = ajustarCapa;
    // Só reajusta em mudanças reais (rotação/carregamento), nunca durante o scroll
    window.addEventListener('orientationchange', function(){ setTimeout(ajustarCapa, 250); });
    window.addEventListener('load', ajustarCapa);
    document.addEventListener('DOMContentLoaded', ajustarCapa);
    // o menu e as imagens carregam de forma assíncrona — reajusta algumas vezes
    [200, 700, 1500, 3000].forEach(function(t){ setTimeout(ajustarCapa, t); });
    // Pausa a animação do fundo enquanto há scroll (evita o strobe do Safari com a barra de endereço a animar)
    (function(){ var _st; window.addEventListener('scroll', function(){
      document.body.classList.add('fundo-scroll');
      clearTimeout(_st); _st = setTimeout(function(){ document.body.classList.remove('fundo-scroll'); }, 220);
    }, { passive:true }); })();
  })();
</script>
