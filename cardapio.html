    data-especial-inicio="23:48"
    data-especial-fim="23:50"
    data-especial-l1="4-Feira Prato do Dia"
    data-especial-l2="Francesinha"
    data-especial-l3="Bife na Pucara"
    data-especial-l4="Filetes de Pescada">
    <div class="linha-negrito" id="rodapeLinha1">Contamos contigo!</div>
    <div class="linha" id="rodapeLinha2">De Terça a Domingo — Almoço e Jantar</div>
    <div class="linha" id="rodapeLinha3"></div>
    <div class="linha" id="rodapeLinha4"></div>
  </div>
  <div class="barra-extras" id="barraExtras"></div>
</div>

<script>
  (function(){
    const fotos = document.querySelectorAll('#infoFixaFotos img');
    if(fotos.length <= 1) return;
    let idx = 0;
    setInterval(() => {
      fotos[idx].classList.remove('ativa');
      idx = (idx + 1) % fotos.length;
      fotos[idx].classList.add('ativa');
    }, 3000);
  })();

  // Texto especial por horário na barra fixa — controlado pelo config.json.
  // window.aplicarEspecialRodape é chamado pelo carregarConfig() depois de ler o config.
  // Decide o que a barra fixa mostra (carrossel dentro do horário, ou texto normal)
  function dentroDoHorario(inicio, fim){
    if(!inicio || !fim) return true; // sem horário definido = sempre
    const p = s => { const a = String(s).split(':'); return (parseInt(a[0],10)||0)*60 + (parseInt(a[1],10)||0); };
    const d = new Date(); const agora = d.getHours()*60 + d.getMinutes();
    const ini = p(inicio), f = p(fim);
    if(ini === f) return true;
    if(ini < f) return agora >= ini && agora < f;
    return agora >= ini || agora < f;
  }

  function restaurarTextoNormal(cfg){
    const cont = document.querySelector('.info-fixa-texto');
    if(!cont) return;
    if(!document.getElementById('rodapeLinha1')){
      cont.innerHTML =
        '<div class="linha-negrito" id="rodapeLinha1"></div>' +
        '<div class="linha" id="rodapeLinha2"></div>' +
        '<div class="linha" id="rodapeLinha3"></div>' +
        '<div class="linha" id="rodapeLinha4"></div>';
    }
    const sombraR = cfg.realce !== false ? '0 1px 3px rgba(0,0,0,0.55), 0 0 8px rgba(0,0,0,0.35)' : 'none';
    const _linhaEst = Array.isArray(cfg.linhaEstilos) ? cfg.linhaEstilos : null;
    ['rodapeLinha1','rodapeLinha2','rodapeLinha3','rodapeLinha4'].forEach(function(id, i){
      const el = document.getElementById(id);
      if(!el) return;
      if(cfg.cor) el.style.color = cfg.cor;
      el.style.textShadow = sombraR;
      if(cfg.realce !== false) el.style.fontWeight = '700';
      if(typeof aplicarEstiloTexto === 'function'){
        if(_linhaEst && _linhaEst[i]) aplicarEstiloTexto([el], _linhaEst[i]);
        else if(cfg.estilo) aplicarEstiloTexto([el], cfg.estilo);
      }
    });
    const normal = { 1:cfg.linha1||'', 2:cfg.linha2||'', 3:cfg.linha3||'', 4:cfg.linha4||'' };
    if(window.aplicarEspecialRodape) window.aplicarEspecialRodape(cfg.especial, normal);
  }

  function _temConteudo(s){ return s && (s.titulo || (s.linhas && s.linhas.some(l => l && l.trim()))); }
  // Cartões-base para hoje: modo 'dia' usa a config do dia da semana; senão usa os cartões fixos
  function slidesEfetivos(car){
    if(!car) return [];
    if(car.modo === 'dia'){
      const d = car.dias && car.dias[new Date().getDay()]; // 0=domingo … 6=sábado
      return (d && Array.isArray(d.slides)) ? d.slides : [];
    }
    return Array.isArray(car.slides) ? car.slides : [];
  }
  function slidesComConteudo(car){
    const hoje = new Date().getDay(); // 0 = domingo
    return slidesEfetivos(car).filter(s => _temConteudo(s) && s.ativo !== false && !(s.ocultarDomingo && hoje === 0));
  }

  window.atualizarBarraFixa = function(){
    const cfg = window._rodapeCfg;
    if(!cfg) return;
    const car = cfg.carrossel;
    // Só usa o carrossel se estiver ativo, dentro do horário E tiver cartões com conteúdo para mostrar
    const uteis = slidesComConteudo(car);
    const usar = car && car.ativo && dentroDoHorario(car.inicio, car.fim) && uteis.length > 0;
    const modo = usar ? 'carrossel' : 'normal';
    if(modo === window._barraFixaModo) return; // já no modo certo, não reiniciar
    window._barraFixaModo = modo;
    if(usar){
      window.iniciarCarrosselRodape(uteis, cfg.cor, cfg.realce, car.intervalo);
    } else {
      if(window._carrosselInterval){ clearInterval(window._carrosselInterval); window._carrosselInterval = null; }
      restaurarTextoNormal(cfg);
    }
  };

  // Carrossel da barra fixa (roda em loop pelos slides)
  window.iniciarCarrosselRodape = function(slides, cor, realce, intervaloSeg){
    const cont = document.querySelector('.info-fixa-texto');
    if(!cont || !Array.isArray(slides)) return;
    if(window._carrosselInterval){ clearInterval(window._carrosselInterval); window._carrosselInterval = null; }
    let intervaloMs = (parseInt(intervaloSeg, 10) || 5) * 1000;
    if(intervaloMs < 2000) intervaloMs = 2000;

    const ativos = slides.filter(function(s){ return s; });
    if(ativos.length === 0){ window._barraFixaModo = 'normal'; restaurarTextoNormal(window._rodapeCfg || {}); return; }

    cont.innerHTML = '<div class="carrossel-slide" id="carrosselSlide"></div>';
    const corTxt = cor || '#ffffff';
    const sombra = realce !== false ? '0 1px 3px rgba(0,0,0,0.55), 0 0 8px rgba(0,0,0,0.35)' : 'none';
    let idx = 0;

    const _car = (window._rodapeCfg && window._rodapeCfg.carrossel) || {};
    function render(i){
      const s = ativos[i];
      const el = document.getElementById('carrosselSlide');
      if(!el) return;
      // Tamanho: por cartão (s.tamTitulo/s.tamLinhas) tem prioridade; senão o do slideshow (car.tamTitulo/tamLinhas)
      const tTit = (s.tamTitulo || _car.tamTitulo) ? (';font-size:' + (s.tamTitulo || _car.tamTitulo) + 'rem') : '';
      const tLin = (s.tamLinhas || _car.tamLinhas) ? (';font-size:' + (s.tamLinhas || _car.tamLinhas) + 'rem') : '';
      let html = '';
      if(s.titulo) html += '<div class="carr-titulo" style="color:' + corTxt + ';text-shadow:' + sombra + tTit + ';">' + s.titulo + '</div>';
      (s.linhas || []).forEach(l => { if(l && l.trim()) html += '<div class="carr-linha" style="color:' + corTxt + ';text-shadow:' + sombra + tLin + ';">' + l + '</div>'; });
      el.innerHTML = html;
      el.style.transition = 'none';
      el.classList.remove('sai-esq');
      el.classList.add('entra-dir');
      void el.offsetWidth;
      el.style.transition = '';
      el.classList.remove('entra-dir');
    }

    render(0);
    if(ativos.length > 1){
      window._carrosselInterval = setInterval(() => {
        const el = document.getElementById('carrosselSlide');
        if(!el) return;
        el.classList.add('sai-esq');
        setTimeout(() => { idx = (idx + 1) % ativos.length; render(idx); }, 400);
      }, intervaloMs);
    }
  };

  window.aplicarEspecialRodape = function(especial, normal){
    const linhas = {
      1: document.getElementById('rodapeLinha1'),
      2: document.getElementById('rodapeLinha2'),
      3: document.getElementById('rodapeLinha3'),
      4: document.getElementById('rodapeLinha4')
    };
    if(!linhas[1]) return;
    if(window._especialInterval){ clearInterval(window._especialInterval); window._especialInterval = null; }

    if(!especial || !especial.ativo || !especial.inicio || !especial.fim){
      // Sem especial: mostra sempre o texto normal
      for(const n of [1,2,3,4]) if(linhas[n]) linhas[n].textContent = normal[n] || '';
      return;
    }

    function paraMinutos(hhmm){
      const p = String(hhmm).split(':');
      return (parseInt(p[0],10)||0)*60 + (parseInt(p[1],10)||0);
    }
    function dentroIntervalo(agora, ini, f){
      if(ini === f) return false;
      if(ini < f) return agora >= ini && agora < f;
      return agora >= ini || agora < f;
    }
    const ini = paraMinutos(especial.inicio);
    const f = paraMinutos(especial.fim);
    const esp = { 1:especial.l1||'', 2:especial.l2||'', 3:especial.l3||'', 4:especial.l4||'' };

    function atualizar(){
      const d = new Date();
      const agora = d.getHours()*60 + d.getMinutes();
      const mostrarEspecial = dentroIntervalo(agora, ini, f);
      for(const n of [1,2,3,4]){
        if(linhas[n]) linhas[n].textContent = mostrarEspecial ? (esp[n] || normal[n] || '') : (normal[n] || '');
      }
    }
    atualizar();
    window._especialInterval = setInterval(atualizar, 60000);
  };

  (function(){
    const adPopup = document.getElementById('adPopup');
    const fecharAd = document.getElementById('fecharAdPopup');
    let escondido = false;
    function esconderAd(){
      if(escondido) return;
      escondido = true;
      adPopup.classList.remove('aberto');
    }
    if(false){
      adPopup.classList.add('aberto');
      setTimeout(esconderAd, 6000);
    }
    fecharAd.addEventListener('click', esconderAd);
    adPopup.addEventListener('click', (e) => { if(e.target === adPopup) esconderAd(); });
  })();

  let idiomaAtual = localStorage.getItem('idiomaCardapio') || 'pt';
  const elementosTraduzeis = document.querySelectorAll('[data-en]');
  const langButtons = document.querySelectorAll('#langSwitch button');

  function aplicarIdioma(lang){
    idiomaAtual = lang;
    localStorage.setItem('idiomaCardapio', lang);
    document.documentElement.lang = lang === 'pt' ? 'pt-PT' : lang;

    document.querySelectorAll('[data-en]').forEach(el => {
      if(!el.dataset.pt) el.dataset.pt = (el.tagName === 'INPUT') ? el.placeholder : el.textContent;
      const texto = (lang === 'pt') ? el.dataset.pt : (el.dataset[lang] || el.dataset.pt);
      if(el.tagName === 'INPUT') el.placeholder = texto;
      else el.textContent = texto;
    });

    document.querySelectorAll('.lang-switch button').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === lang); });
  }

  // Delegação: qualquer botão de idioma (mesmo em cópias no rodapé/flutuante) muda o idioma
  document.addEventListener('click', function(e){ var b = (e.target && e.target.closest) ? e.target.closest('.lang-switch button[data-lang]') : null; if(b) aplicarIdioma(b.dataset.lang); });

  aplicarIdioma(idiomaAtual);

  // ===== Menu dinâmico a partir de menu.json =====
  // O menu estático em HTML funciona como fallback: se o menu.json falhar,
  // o cardápio continua a mostrar o menu que está no ficheiro.
  function _mLang(el, t){
    if(!t) return;
    el.textContent = t.pt || '';
    if(t.en) el.setAttribute('data-en', t.en);
    if(t.fr) el.setAttribute('data-fr', t.fr);
    if(t.es) el.setAttribute('data-es', t.es);
  }
  function _mTabela(t){
    const table = document.createElement('table');
    table.className = 'tabela-doses';
    const tr1 = document.createElement('tr');
    (t.doses||[]).forEach(d => { const td=document.createElement('td'); td.className='dose'; td.textContent=d; tr1.appendChild(td); });
    const tr2 = document.createElement('tr');
    (t.precos||[]).forEach(p => { const td=document.createElement('td'); td.className='preco-dose'; td.textContent=p; tr2.appendChild(td); });
    table.appendChild(tr1); table.appendChild(tr2);
    return table;
  }
  function _mItem(it){
    const item = document.createElement('div');
    item.className = 'item';
    if(it.vinho){ item.classList.add('vinho-clicavel'); item.setAttribute('data-vinho', it.vinho); }
    if(it.foto){ item.classList.add('prato-clicavel'); item.setAttribute('data-foto', it.foto); }
    const nomeEl = document.createElement('div');
    nomeEl.className = 'nome';
    _mLang(nomeEl, it.nome);
    if(it.desc){
      const wrap = document.createElement('div');
      const descEl = document.createElement('div');
      descEl.className = 'desc';
      _mLang(descEl, it.desc);
      wrap.appendChild(nomeEl); wrap.appendChild(descEl);
      item.appendChild(wrap);
    } else {
      item.appendChild(nomeEl);
    }
    if(it.preco){
      const p = document.createElement('div');
      p.className = 'preco';
      p.textContent = it.preco;
      item.appendChild(p);
    }
    return item;
  }
  function _mGrupo(g, cls){
    const det = document.createElement('details');
    det.className = cls;
    const sum = document.createElement('summary');
    _mLang(sum, g.summary);
    det.appendChild(sum);
    if(g.subtitulo){ const s=document.createElement('div'); s.className='subtitulo'; _mLang(s, g.subtitulo); det.appendChild(s); }
    const lista = document.createElement('div');
    lista.className = 'card-lista';
    (g.itens||[]).forEach(it => {
      if(it.tabela){
        if(it.nome && (it.nome.pt || it.nome.en || it.nome.fr || it.nome.es)){ const h = document.createElement('div'); h.className = 'vinho-tab-nome'; _mLang(h, it.nome); lista.appendChild(h); }
        lista.appendChild(_mTabela(it.tabela));
      } else {
        lista.appendChild(_mItem(it));
      }
    });
    det.appendChild(lista);
    return det;
  }
  // Renderiza os blocos de conteúdo da página (construtor): título, parágrafo, imagem, botão, separador, espaço
  // ===== Mosaico (bento) — módulo à parte =====
  // Arrastar o texto dentro da caixa (só na pré-visualização); avisa o editor da nova posição
  function _mosDragText(box, el, idx, sec, which){
    el.style.cursor = 'move'; el.style.touchAction = 'none';
    var drag = false, moveu = false, nx = 0, ny = 0;
    el.addEventListener('click', function(ev){ if(moveu){ ev.preventDefault(); ev.stopPropagation(); } });
    el.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); drag = true; moveu = false; try{ el.setPointerCapture(ev.pointerId); }catch(e){} });
    el.addEventListener('pointermove', function(ev){ if(!drag) return; moveu = true; var r = box.getBoundingClientRect(); nx = Math.max(1, Math.min(90, ((ev.clientX - r.left) / r.width) * 100)); ny = Math.max(1, Math.min(92, ((ev.clientY - r.top) / r.height) * 100)); el.style.left = nx + '%'; el.style.top = ny + '%'; });
    el.addEventListener('pointerup', function(ev){ if(!drag) return; drag = false; if(moveu){ try{ parent.postMessage({ type:'mosaico-pos', sec:(sec || null), idx:idx, which:(which || 'tit'), x:Math.round(nx), y:Math.round(ny) }, '*'); }catch(e){} } });
    el.addEventListener('pointercancel', function(){ drag = false; });
  }
  // Arrasto do ícone de WhatsApp da publicidade (na pré-visualização): reposiciona e avisa o editor
  function _anuncioDragWa(box, el){
    if(el._dragOn) return; el._dragOn = true;
    el.style.cursor = 'move'; el.style.touchAction = 'none';
    var drag = false, moveu = false, nx = 50, ny = 88;
    el.addEventListener('click', function(ev){ if(moveu){ ev.preventDefault(); ev.stopPropagation(); } });
    el.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); drag = true; moveu = false; try{ el.setPointerCapture(ev.pointerId); }catch(e){} });
    el.addEventListener('pointermove', function(ev){ if(!drag) return; moveu = true; var r = box.getBoundingClientRect(); nx = Math.max(4, Math.min(96, ((ev.clientX - r.left) / r.width) * 100)); ny = Math.max(6, Math.min(94, ((ev.clientY - r.top) / r.height) * 100)); el.style.left = nx + '%'; el.style.top = ny + '%'; });
    el.addEventListener('pointerup', function(ev){ if(!drag) return; drag = false; if(moveu){ try{ parent.postMessage({ type:'anuncio-wa-pos', x:Math.round(nx), y:Math.round(ny) }, '*'); }catch(e){} } });
    el.addEventListener('pointercancel', function(){ drag = false; });
  }
  // Arrasto livre da imagem que salta da barra fixa (pré-visualização): desloca dx/dy e avisa o editor
  function _mascoteDrag(el){
    if(el._dragOn) return; el._dragOn = true;
    var drag = false, sx = 0, sy = 0, bdx = 0, bdy = 0, dx = 0, dy = 0;
    function _n(v){ return parseFloat(String(v).replace('px','')) || 0; }
    el.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); drag = true; sx = ev.clientX; sy = ev.clientY; bdx = _n(el.style.getPropertyValue('--mas-dx')); bdy = _n(el.style.getPropertyValue('--mas-dy')); try{ el.setPointerCapture(ev.pointerId); }catch(e){} });
    el.addEventListener('pointermove', function(ev){ if(!drag) return; dx = Math.round(bdx + (ev.clientX - sx)); dy = Math.round(bdy + (ev.clientY - sy)); el.style.setProperty('--mas-dx', dx + 'px'); el.style.setProperty('--mas-dy', dy + 'px'); if(el._posHandle) el._posHandle(); });
    el.addEventListener('pointerup', function(ev){ if(!drag) return; drag = false; try{ parent.postMessage({ type:'mascote-pos', dx:dx, dy:dy }, '*'); }catch(e){} });
    el.addEventListener('pointercancel', function(){ drag = false; });
  }
  // Redimensionar a imagem da barra fixa arrastando uma pega de canto (pré-visualização)
  function _mascoteResize(el){
    var bar = el.parentNode; if(!bar) return;
    var handle = document.getElementById('masHandle');
    if(!handle){
      handle = document.createElement('div'); handle.id = 'masHandle';
      handle.style.cssText = 'position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid #2a5aa8; box-shadow:0 1px 4px rgba(0,0,0,0.45); z-index:130; cursor:nwse-resize; touch-action:none; display:none;';
      bar.appendChild(handle);
    }
    function _lado(){ return el.classList.contains('lado-esq') ? 'esq' : (el.classList.contains('lado-centro') ? 'centro' : 'dir'); }
    function pos(){
      var r = el.getBoundingClientRect(), br = bar.getBoundingClientRect();
      var top = r.top - br.top - 4;
      var left = (_lado() === 'dir') ? (r.left - br.left - 4) : (r.right - br.left - 16);
      handle.style.left = left + 'px'; handle.style.top = top + 'px'; handle.style.display = '';
    }
    el._posHandle = pos; pos();
    if(handle._on) return; handle._on = true;
    var rez = false, anchorX = 0, factor = 1, larg = 120;
    handle.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); rez = true; var r = el.getBoundingClientRect(); var l = _lado(); anchorX = (l === 'esq') ? r.left : (l === 'dir' ? r.right : (r.left + r.width / 2)); factor = (l === 'centro') ? 2 : 1; try{ handle.setPointerCapture(ev.pointerId); }catch(e){} });
    handle.addEventListener('pointermove', function(ev){ if(!rez) return; larg = Math.max(40, Math.min(600, Math.round(Math.abs(ev.clientX - anchorX) * factor))); el.style.setProperty('--mas-larg', larg + 'px'); pos(); });
    handle.addEventListener('pointerup', function(ev){ if(!rez) return; rez = false; try{ parent.postMessage({ type:'mascote-size', largura:larg }, '*'); }catch(e){} });
    handle.addEventListener('pointercancel', function(){ rez = false; });
  }
  // Arrasto do banner PNG de uma secção (pré-visualização): desloca dx/dy e avisa o editor (por categoria)
  function _bannerDrag(el){
    if(el._dragOn) return; el._dragOn = true;
    var drag = false, sx = 0, sy = 0, bdx = 0, bdy = 0, dx = 0, dy = 0;
    function _n(v){ return parseFloat(String(v).replace('px','')) || 0; }
    el.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); drag = true; sx = ev.clientX; sy = ev.clientY; bdx = _n(el.style.getPropertyValue('--ban-dx')); bdy = _n(el.style.getPropertyValue('--ban-dy')); try{ el.setPointerCapture(ev.pointerId); }catch(e){} });
    el.addEventListener('pointermove', function(ev){ if(!drag) return; dx = Math.round(bdx + (ev.clientX - sx)); dy = Math.round(bdy + (ev.clientY - sy)); el.style.setProperty('--ban-dx', dx + 'px'); el.style.setProperty('--ban-dy', dy + 'px'); if(el._posHandle) el._posHandle(); });
    el.addEventListener('pointerup', function(ev){ if(!drag) return; drag = false; try{ parent.postMessage({ type:'banner-pos', cat:el.dataset.cat, dx:dx, dy:dy }, '*'); }catch(e){} });
    el.addEventListener('pointercancel', function(){ drag = false; });
  }
  // Redimensionar o banner PNG arrastando uma pega de canto (pré-visualização)
  function _bannerResize(el){
    var box = el.parentNode; if(!box) return;
    var handle = el._rzHandle;
    if(!handle){
      handle = document.createElement('div');
      handle.style.cssText = 'position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid #2a5aa8; box-shadow:0 1px 4px rgba(0,0,0,0.45); z-index:20; cursor:nwse-resize; touch-action:none; display:none;';
      box.appendChild(handle); el._rzHandle = handle;
    }
    function _lado(){ return el.classList.contains('lado-esq') ? 'esq' : (el.classList.contains('lado-centro') ? 'centro' : 'dir'); }
    function pos(){
      var r = el.getBoundingClientRect(), br = box.getBoundingClientRect();
      var top = r.top - br.top - 4;
      var left = (_lado() === 'dir') ? (r.left - br.left - 4) : (r.right - br.left - 16);
      handle.style.left = left + 'px'; handle.style.top = top + 'px'; handle.style.display = '';
    }
    el._posHandle = pos; pos();
    if(handle._on) return; handle._on = true;
    var rez = false, anchorX = 0, factor = 1, larg = 160;
    handle.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); rez = true; var r = el.getBoundingClientRect(); var l = _lado(); anchorX = (l === 'esq') ? r.left : (l === 'dir' ? r.right : (r.left + r.width / 2)); factor = (l === 'centro') ? 2 : 1; try{ handle.setPointerCapture(ev.pointerId); }catch(e){} });
    handle.addEventListener('pointermove', function(ev){ if(!rez) return; larg = Math.max(40, Math.min(700, Math.round(Math.abs(ev.clientX - anchorX) * factor))); el.style.setProperty('--ban-larg', larg + 'px'); if(el._ajustaCaixa) el._ajustaCaixa(); pos(); });
    handle.addEventListener('pointerup', function(ev){ if(!rez) return; rez = false; try{ parent.postMessage({ type:'banner-size', cat:el.dataset.cat, largura:larg }, '*'); }catch(e){} });
    handle.addEventListener('pointercancel', function(){ rez = false; });
  }

  // Calcula as variáveis --az-* de azulejo (a partir de um hex) num elemento
  function azSetVars(el, hex){
    hex = (hex || '#2a5aa8').replace('#',''); if(!/^[0-9a-fA-F]{6}$/.test(hex)) hex = '2a5aa8';
    var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    var st = el.style; var A = function(a){ return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
    st.setProperty('--az-a50', A(.5)); st.setProperty('--az-a42', A(.42)); st.setProperty('--az-a36', A(.36));
    st.setProperty('--az-a30', A(.3)); st.setProperty('--az-a22', A(.22)); st.setProperty('--az-a20', A(.2)); st.setProperty('--az-a14', A(.14));
    var mix = function(c, p){ return Math.round(c * p + 255 * (1 - p)); };
    st.setProperty('--az-bg', 'rgb(' + mix(r,.06) + ',' + mix(g,.06) + ',' + mix(b,.06) + ')');
    st.setProperty('--az-borda', 'rgb(' + mix(r,.30) + ',' + mix(g,.30) + ',' + mix(b,.30) + ')');
    st.setProperty('--az-texto', 'rgb(' + Math.round(r*.55) + ',' + Math.round(g*.55) + ',' + Math.round(b*.55) + ')');
  }
  // Modelo "Deslizar": monta um deck horizontal (capa + uma página por secção, já aberta)
  function montarDeck(){
    const main = document.querySelector('main'); if(!main) return;
    const grid = document.getElementById('categoriaGrid');
    const secs = Array.prototype.slice.call(main.querySelectorAll(':scope > section.categoria')).filter(function(s){ return s.id !== 'jogos'; });
    if(!secs.length) return;
    const deck = document.createElement('div'); deck.id = 'menuDeck'; deck.className = 'menu-deck';
    // Capa
    const capa = document.createElement('div'); capa.className = 'deck-page deck-capa';
    if(window.__sliderCapaFoto){ capa.classList.add('tem-foto'); const cim = document.createElement('img'); cim.className = 'deck-capa-foto'; cim.src = window.__sliderCapaFoto; cim.alt = ''; cim.decoding = 'async'; capa.appendChild(cim); const csh = document.createElement('span'); csh.className = 'deck-capa-shade'; capa.appendChild(csh); }
    else if(window.__sliderCapaAz && window.__sliderCapaAz.tipo){ capa.classList.add('azbg-' + window.__sliderCapaAz.tipo); azSetVars(capa, window.__sliderCapaAz.cor); }
    const ct = document.createElement('div'); ct.className = 'deck-capa-tit'; ct.textContent = 'MENU';
    const cs = document.createElement('div'); cs.className = 'deck-capa-sub';
    cs.setAttribute('data-en','Swipe'); cs.setAttribute('data-fr','Glisser'); cs.setAttribute('data-es','Desliza');
    cs.textContent = 'Desliza'; const seta = document.createElement('span'); seta.className = 'deck-seta'; seta.textContent = '→'; cs.appendChild(seta);
    capa.appendChild(ct); capa.appendChild(cs); deck.appendChild(capa);
    // Uma página por secção (move a secção, mantendo elementos e cliques)
    secs.forEach(function(s){
      const page = document.createElement('div'); page.className = 'deck-page';
      const tileEl = grid ? grid.querySelector('.tile[data-target="' + s.id.replace(/"/g,'\\"') + '"]') : null;
      if(tileEl && tileEl.dataset.cor) page.style.setProperty('--cat-cor', tileEl.dataset.cor);
      if(tileEl && tileEl.dataset.neonon){
        page.classList.add('neon-on');
        if(tileEl.dataset.neoncor) page.style.setProperty('--nfx-cor', tileEl.dataset.neoncor);
        if(tileEl.dataset.neonpisca){ page.classList.add('neon-pisca'); page.style.setProperty('--nfx-dur', tileEl.dataset.neonpisca + 's'); }
      }
      const tl = tileEl ? tileEl.querySelector('.tile-label') : null;
      const titTxt = tl ? tl.textContent : '';
      if(titTxt){ const h = document.createElement('div'); h.className = 'deck-page-tit'; h.textContent = titTxt; page.appendChild(h); }
      page.appendChild(s);
      // banner da secção (se existir) sobe para o topo da página, acima do título
      const _bn = s.querySelector(':scope > .sec-foto-banner'); if(_bn) page.insertBefore(_bn, page.firstChild);
      // secções já abertas: expande os grupos (details) dentro desta página
      s.querySelectorAll('details').forEach(function(d){ d.open = true; });
      // evita duplicar: se o título de um grupo repetir o nome da secção, esconde-o
      if(titTxt){ const alvo = titTxt.trim().toLowerCase(); s.querySelectorAll('.grupo-prato > summary, .grupo-vinho > summary').forEach(function(sm){ if((sm.textContent||'').trim().toLowerCase() === alvo){ sm.style.display = 'none'; } }); }
      deck.appendChild(page);
    });
    // Bolinhas indicadoras
    const dots = document.createElement('div'); dots.className = 'deck-dots';
    const nPag = deck.querySelectorAll('.deck-page').length;
    for(let i=0;i<nPag;i++){ const d = document.createElement('i'); if(i===0) d.className = 'on'; dots.appendChild(d); }
    // Inserir a seguir à grelha (escondida)
    if(grid && grid.parentNode){ grid.parentNode.insertBefore(deck, grid.nextSibling); deck.parentNode.insertBefore(dots, deck.nextSibling); }
    else { main.appendChild(deck); main.appendChild(dots); }
    // Atualizar as bolinhas ao deslizar
    deck.addEventListener('scroll', function(){
      const stride = deck.clientWidth + 14; // largura da página + gap
      const idx = Math.max(0, Math.min(nPag - 1, Math.round(deck.scrollLeft / Math.max(1, stride))));
      dots.querySelectorAll('i').forEach(function(el, j){ el.classList.toggle('on', j === idx); });
    }, { passive:true });
  }

  // Entrada em cascata dos separadores (corre quando o menu fica visível)
  window.__animarEntrada = function(){
    if(window.__entradaFeita) return;
    const tiles = document.querySelectorAll('#categoriaGrid .tile.tile-espera');
    if(!tiles.length) return; // ainda não há separadores; tenta mais tarde
    window.__entradaFeita = true;
    tiles.forEach(function(t, i){
      t.style.animationDelay = (i * 0.055) + 's';
      t.classList.remove('tile-espera');
      t.classList.add('tile-entra');
    });
  };
  // Inclinação 3D dos separadores (só no rato — no telemóvel não interferir com o toque/scroll)
  window.ligarTilt = function(){
    document.querySelectorAll('.tile').forEach(function(t){
      if(t.dataset.tilt) return; t.dataset.tilt = '1';
      t.addEventListener('pointermove', function(e){
        if(e.pointerType && e.pointerType !== 'mouse') return;
        if(t.classList.contains('active')) return;
        const r = t.getBoundingClientRect();
        const x = (e.clientX - r.left)/r.width - 0.5, y = (e.clientY - r.top)/r.height - 0.5;
        t.style.transform = 'perspective(600px) rotateX(' + (-y*9) + 'deg) rotateY(' + (x*9) + 'deg) translateZ(6px)';
      });
      const repor = function(){ t.style.transform = ''; };
      t.addEventListener('pointerleave', repor);
      t.addEventListener('pointercancel', repor);
    });
  };
  // O menu é carregado do Supabase em carregarConfig() (junto do config), por ?n=slug.

  const tiles = document.querySelectorAll('.tile');
  const painel = document.getElementById('categoriaPainel');
  const painelConteudo = document.getElementById('painelConteudo');
  const painelTitulo = document.getElementById('painelTitulo');
  const fecharPainelBtn = document.getElementById('fecharPainel');

  let categoriaAtual = null;
  let categoriaPaiOriginal = null;
  let categoriaProximoOriginal = null;

  function restaurarCategoria(){
    painel.removeEventListener('transitionend', _restaurarPendente);
    painel.style.background = ''; painel.classList.remove('painel-pratodia');
    var mainEl = document.querySelector('main');
    var jogosSec = document.getElementById('jogos');
    function devolver(sec){
      if(!sec) return;
      sec.classList.remove('ativa');
      // Escolhe um pai válido (o original, se ainda estiver no documento; senão o main)
      var pai = (categoriaPaiOriginal && document.contains(categoriaPaiOriginal)) ? categoriaPaiOriginal : mainEl;
      if(!pai) return;
      try{
        if(categoriaProximoOriginal && categoriaProximoOriginal.parentNode === pai){
          pai.insertBefore(sec, categoriaProximoOriginal);
        } else if(pai === mainEl && jogosSec && jogosSec.parentNode === mainEl){
          mainEl.insertBefore(sec, jogosSec);
        } else {
          pai.appendChild(sec);
        }
      }catch(e){
        try{ if(mainEl){ if(jogosSec && jogosSec.parentNode === mainEl) mainEl.insertBefore(sec, jogosSec); else mainEl.appendChild(sec); } }catch(_){}
      }
    }
    if(categoriaAtual){ devolver(categoriaAtual); categoriaAtual = null; categoriaPaiOriginal = null; categoriaProximoOriginal = null; }
    // Segurança: devolve ao menu qualquer secção que tenha ficado presa no painel
    try{
      painelConteudo.querySelectorAll(':scope > section.categoria').forEach(function(s){
        s.classList.remove('ativa');
        if(mainEl){ if(jogosSec && jogosSec.parentNode === mainEl) mainEl.insertBefore(s, jogosSec); else mainEl.appendChild(s); }
      });
    }catch(e){}
  }
  function _restaurarPendente(e){
    if(e.target !== painel) return;
    if(e.propertyName !== 'transform' && e.propertyName !== 'clip-path') return;
    restaurarCategoria();
  }

  // Efeito "Wipe (desporto)": a faixa cobre o ecrã; onCover corre no momento de cobertura total (troca escondida)
  function _wipeTexto(w){
    const nome = (window.__nomeRestaurante || '').trim();
    const modo = w.texto || 'inicial';
    if(modo === 'nome') return nome.toUpperCase();
    if(modo === 'custom') return (w.textoCustom || '').toUpperCase();
    return (nome.charAt(0) || '').toUpperCase();
  }
  window.__playWipe = function(cor, onCover){
    const fx = document.getElementById('wipeFx');
    if(!fx){ if(onCover) onCover(); return; }
    const w = window.__wipeCfg || {};
    const estilos = ['diagonal','vertical','cortina','circulo','suave','diagonal2','barra','diamante','cortinah','stripes','losangos'];
    const estilo = estilos.indexOf(w.estilo) >= 0 ? w.estilo : 'diagonal';
    const dur = Math.max(0.4, Math.min(3, parseFloat(w.duracao) || 1.1));
    let coverFrac = 0.47;
    fx.style.setProperty('--wipe-dur', dur + 's');
    fx.style.setProperty('--wipe-cor', cor || '#a8712f');
    fx.style.setProperty('--wipe-txt', w.corTexto || '#ffffff');
    const palavra = _wipeTexto(w);
    const ini = fx.querySelector('.wf-ini'), nm = fx.querySelector('.wf-nm');
    if((w.texto || 'inicial') === 'inicial'){ ini.style.display = ''; nm.style.display = 'none'; ini.textContent = palavra; }
    else { ini.style.display = 'none'; nm.style.display = ''; nm.textContent = palavra; }
    fx.className = ''; void fx.offsetWidth;
    // Constrói as peças da forma escolhida (barras / losangos). Com foto, cada peça leva a sua fatia da MESMA imagem.
    const comFoto = !!w.foto;
    function _wfBuildForma(){
      if(estilo === 'stripes'){
        const cont = fx.querySelector('.wf-stripes'); cont.innerHTML = ''; let acc = 0;
        [9,15,7,18,11,16,8,16].forEach(function(ww, i){ const b = document.createElement('b'); b.style.width = ww + '%'; b.style.setProperty('--fy', (i % 2 ? '115%' : '-115%'));
          cont.appendChild(b); acc += ww; });
      } else if(estilo === 'losangos'){
        const cont = fx.querySelector('.wf-losangos'); cont.innerHTML = '';
        const cols = 4, rows = 5;
        for(let r = 0; r < rows; r++){ for(let c = 0; c < cols; c++){
          const i = document.createElement('i');
          const lx = (c + 0.5) / cols * 100, ty = (r + 0.5) / rows * 100;
          i.style.left = lx + '%'; i.style.top = ty + '%';
          i.style.animationDelay = ((r + c) * dur * 0.02).toFixed(3) + 's';
          cont.appendChild(i);
        } }
        coverFrac = 0.60;
      }
    }
    if(w.foto){
      // Imagem única repartida pela forma escolhida
      fx.style.setProperty('--wipe-img', "url('" + w.foto + "')");
      fx.classList.add('wf-temfoto');
      _wfBuildForma();
      fx.classList.add('play', 'wf-' + estilo);
    } else if(w.alpha && palavra){
      // Alpha: só a PALAVRA fica visível (na cor escolhida) e tudo à volta transparente — a palavra varre o ecrã
      const esc = palavra.replace(/[&<>]/g, function(c){ return c === '&' ? '&amp;' : c === '<' ? '&lt;' : '&gt;'; });
      const alpha = fx.querySelector('.wf-alpha');
      const _fs = Math.max(9, Math.min(30, 150 / Math.max(1, palavra.length)));
      alpha.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">' +
        '<defs><mask id="wfMask"><rect width="100" height="100" fill="#000"/>' +
        '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" ' +
        'style="font-family:var(--fonte-titulo); font-weight:800; font-size:' + _fs + 'px; fill:#fff">' + esc + '</text></mask></defs>' +
        '<rect width="100" height="100" style="fill:' + (cor || '#a8712f') + '" mask="url(#wfMask)"/></svg>';
      fx.style.setProperty('--wipe-flash', w.flashCor || '#b8b8b8');
      fx.classList.add('play', 'wf-alpha');
      if(w.movimento === 'zoom'){ fx.classList.add('wf-az'); coverFrac = 0.50; }
    } else {
      _wfBuildForma();
      fx.classList.add('play', 'wf-' + estilo);
    }
    if(onCover) setTimeout(onCover, Math.round(dur * 1000 * coverFrac));
    setTimeout(function(){ fx.className = ''; }, Math.round(dur * 1000 * 1.25) + 80);
  };

  function abrirCategoria(tile){
    const target = document.getElementById(tile.dataset.target);
    if(!target) return;
    // Garante que nenhuma secção anterior fica presa no painel (evita conteúdo trocado com toques rápidos)
    restaurarCategoria();
    painel.setAttribute('data-sec', tile.dataset.target);

    const rect = tile.getBoundingClientRect();
    painel.style.setProperty('--origin-x', (rect.left + rect.width / 2) + 'px');
    painel.style.setProperty('--origin-y', (rect.top + rect.height / 2) + 'px');

    document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
    tile.classList.add('active');

    const label = tile.querySelector('.tile-label');
    painelTitulo.textContent = label ? label.textContent : '';

    // Modelo Carteira: cabeçalho do painel na cor da categoria
    if(tile.dataset.cor) painel.style.setProperty('--cat-cor', tile.dataset.cor);
    else painel.style.removeProperty('--cat-cor');
    // Néon por secção dentro do painel: ligar + cor própria + piscar
    if(tile.dataset.neoncor) painel.style.setProperty('--nfx-cor', tile.dataset.neoncor);
    else painel.style.removeProperty('--nfx-cor');
    painel.classList.toggle('neon-on', tile.dataset.neonon === '1');
    if(tile.dataset.neonpisca){ painel.classList.add('neon-pisca'); painel.style.setProperty('--nfx-dur', tile.dataset.neonpisca + 's'); }
    else painel.classList.remove('neon-pisca');

    categoriaAtual = target;
    categoriaPaiOriginal = target.parentNode;
    categoriaProximoOriginal = target.nextSibling;

    target.classList.add('ativa');
    painelConteudo.appendChild(target);
    // Decoração alusiva ao tema (modelo Praia): alterna entre as ativas por secção
    painelConteudo.classList.remove('praia-deco-palmeira','praia-deco-coco','praia-deco-ondas','praia-deco-concha','praia-deco-buzio','praia-deco-none');
    if(document.body.classList.contains('modelo-praia')){

    painelConteudo.classList.remove('italiano-var-1','italiano-var-2','italiano-var-3','italiano-var-4','italiano-var-5','italiano-deco-manjericao','italiano-deco-tomate','italiano-deco-azeitona','italiano-deco-vinho','italiano-deco-none');
    if(document.body.classList.contains('modelo-italiano')){
      const tilesI = Array.prototype.slice.call(document.querySelectorAll('#categoriaGrid .tile'));
      const idxI = Math.max(0, tilesI.indexOf(tile));

      const listI = window.__italianoDeco || [];
      if(listI.length){ painelConteudo.classList.add('italiano-deco-' + listI[idxI % listI.length]); }
      else { painelConteudo.classList.add('italiano-deco-none'); }
    }
    // Modelo Bambu: motivo escolhido + tamanho/posição diferente por secção
    painelConteudo.classList.remove('bambu-var-1','bambu-var-2','bambu-var-3','bambu-var-4','bambu-var-5','bambu-deco-canas','bambu-deco-folha','bambu-deco-lotus','bambu-deco-none');
    if(document.body.classList.contains('modelo-bambu')){
      const tilesB = Array.prototype.slice.call(document.querySelectorAll('#categoriaGrid .tile'));
      const idxB = Math.max(0, tilesB.indexOf(tile));
      painelConteudo.classList.add('bambu-var-' + ((idxB % 5) + 1));
      const listB = window.__bambuDeco || [];
      if(listB.length){ painelConteudo.classList.add('bambu-deco-' + listB[idxB % listB.length]); }
      else { painelConteudo.classList.add('bambu-deco-none'); }
    }
    if(target.classList.contains('sec-pratodia') && target.dataset.pdBg){ painel.style.background = target.dataset.pdBg; painel.classList.add('painel-pratodia'); }
    else { painel.style.background = ''; painel.classList.remove('painel-pratodia'); }

    document.querySelectorAll('.grupo-prato, .grupo-vinho').forEach(det => { det.open = false; });
    const grupo = target.querySelector('.grupo-prato');
    if (grupo) grupo.open = true;

    painelConteudo.scrollTop = 0;
    // Barra fixa, cabeçalho e botões saem (gerido por CSS via classe, para não conflituar com a lógica de cada um)
    document.body.classList.add('secao-aberta', 'cart-oculto');
    if(document.body.classList.contains('abrir-wipe') && window.__playWipe){
      const _wc = (window.__wipeCfg && window.__wipeCfg.cor) || (tile.dataset.cor) || '#a8712f';
      window.__wipeCor = _wc;
      window.__playWipe(_wc, function(){ painel.classList.add('aberto'); });
    } else {
      requestAnimationFrame(() => painel.classList.add('aberto'));
    }

  function fecharCategoria(){
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
    if(document.body.classList.contains('abrir-wipe') && window.__playWipe && !(window.__wipeCfg && window.__wipeCfg.sairNormal)){
      const _d = Math.max(0.4, Math.min(3, parseFloat((window.__wipeCfg && window.__wipeCfg.duracao)) || 1.1)) * 1000;
      window.__playWipe(window.__wipeCor || '#a8712f', function(){ painel.classList.remove('aberto'); });
      setTimeout(restaurarCategoria, _d + 20);
      document.body.classList.remove('secao-aberta');
      setTimeout(function(){ if(!document.body.classList.contains('secao-aberta')) document.body.classList.remove('cart-oculto'); }, 650);
      return;
    }
    // "Sair com o efeito normal": tira o modo wipe só para o fecho (para o zoom normal funcionar) e repõe depois
    if(document.body.classList.contains('abrir-wipe') && window.__wipeCfg && window.__wipeCfg.sairNormal){
      document.body.classList.remove('abrir-wipe');
      setTimeout(function(){ document.body.classList.add('abrir-wipe'); }, 700);
    }
    painel.classList.remove('aberto');
    painel.addEventListener('transitionend', _restaurarPendente);
    // Cabeçalho e barra voltam já (acompanham o fecho); carrinho e fidelidade só reaparecem no fim
    document.body.classList.remove('secao-aberta');
    setTimeout(function(){ if(!document.body.classList.contains('secao-aberta')) document.body.classList.remove('cart-oculto'); }, 650);
  }

  function traduzirInfoVinho(texto, destino){
    return fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=pt&tl='+destino+'&dt=t&q='+encodeURIComponent(texto))
      .then(r => r.ok ? r.json() : null)
      .then(d => (d && d[0]) ? d[0].map(s=>s[0]).join('') : null)
      .catch(() => null);
  }
  function mostrarCampoVinho(info, campo, destino, elemento){
    const base = info[campo];
    if(!base){ elemento.textContent = '—'; return; }
    if(destino === 'pt'){ elemento.textContent = base; return; }
    const manual = info[campo + '_' + destino];
    if(manual){ elemento.textContent = manual; return; }
    // mostra o português enquanto traduz, depois substitui (se ainda estiver nesse idioma)
    elemento.textContent = base;
    traduzirInfoVinho(base, destino).then(t => {
      if(t){ info[campo + '_' + destino] = t; if(idiomaAtual === destino) elemento.textContent = t; }
    });
  }

  function preencherFotos(container, fotos){
    if(!container || !Array.isArray(fotos) || fotos.length === 0) return;
    container.innerHTML = '';
    fotos.forEach((caminho, i) => {
      if(!caminho) return;
      const img = document.createElement('img');
      img.src = RAW_BASE + caminho;
      img.alt = 'Foto ' + (i+1);
      if(i === 0) img.classList.add('ativa');
      container.appendChild(img);
    });
    iniciarRotacao(container);
  }

    const imagens = container.querySelectorAll('img');
    if(imagens.length <= 1) return;
    let idx = 0;
    setInterval(() => {
      imagens[idx].classList.remove('ativa');
      idx = (idx + 1) % imagens.length;
      imagens[idx].classList.add('ativa');
    }, 30000);
  }

  // Clareia (pct>0) ou escurece (pct<0) uma cor hex — usado para derivar tons das cores personalizadas

    }catch(e){ return hex; }

          window.__fazerStripes = function(){
            const cont = document.getElementById('introStripes');
            const ovv = document.getElementById('introOverlay');
            if(!cont){ ovv.style.display = 'none'; return; }
            cont.innerHTML = '';
            const esconderVisuais = function(){
              ovv.style.background = 'transparent';
              const bgd = document.getElementById('introBg'); if(bgd) bgd.style.opacity = '0';
              const shd = document.getElementById('introShade'); if(shd) shd.style.opacity = '0';
              const cnt = document.getElementById('introContent'); if(cnt){ cnt.style.transition = 'opacity .25s'; cnt.style.opacity = '0'; }
            };
            if(window.__introReveal === 'stripes'){
              const N = 6; const pecas = [];
              for(let i=0;i<N;i++){
                const st = document.createElement('div');
                st.style.cssText = 'position:absolute;top:0;height:100%;overflow:hidden;will-change:transform;';
                st.style.left = (i*100/N) + '%'; st.style.width = (100/N) + '%';
                const inner = document.createElement('div');
                inner.style.cssText = 'position:absolute;top:0;height:100%;background-size:cover;background-position:center;';
                inner.style.width = (N*100) + '%'; inner.style.left = (-i*100) + '%';
                inner.style.backgroundImage = window.__introBgImg;
                st.appendChild(inner);
                st.dataset.ty = (i % 2 === 0 ? '-101%' : '101%');
                st.dataset.delay = (i * 0.06);
                pecas.push(st); cont.appendChild(st);
              }
              cont.style.display = 'block'; esconderVisuais();
              requestAnimationFrame(function(){
                pecas.forEach(function(p){ p.style.transition = 'transform .7s cubic-bezier(.7,0,.25,1) ' + p.dataset.delay + 's'; p.style.transform = 'translateY(' + p.dataset.ty + ')'; });
              });
              setTimeout(function(){ ovv.style.display = 'none'; }, 700 + N*60 + 200);
            } else if(window.__introReveal === 'cortina-v'){
              const fazerMetadeV = function(esq){
                const half = document.createElement('div');
                half.style.cssText = 'position:absolute;top:0;height:100%;width:50%;overflow:hidden;will-change:transform;';
                half.style.left = esq ? '0' : '50%';
                const inner = document.createElement('div');
                inner.style.cssText = 'position:absolute;top:0;height:100%;width:200%;background-size:cover;background-position:center;';
                inner.style.backgroundImage = window.__introBgImg;
                inner.style.left = esq ? '0' : '-100%';
                half.appendChild(inner);
                half.dataset.tx = esq ? '-100%' : '100%';
                return half;
              };
              const esq = fazerMetadeV(true), dir = fazerMetadeV(false);
              cont.appendChild(esq); cont.appendChild(dir);
              cont.style.display = 'block'; esconderVisuais();
              requestAnimationFrame(function(){
                [esq, dir].forEach(function(p){ p.style.transition = 'transform .7s cubic-bezier(.7,0,.2,1)'; p.style.transform = 'translateX(' + p.dataset.tx + ')'; });
              });
              setTimeout(function(){ ovv.style.display = 'none'; }, 850);
            } else if(window.__introReveal === 'cubos'){
              const W = window.innerWidth || 360, H = window.innerHeight || 640;
              const cols = 4;
              const rows = Math.max(3, Math.round(H / (W / cols)));
              cont.style.perspective = '900px';
              const tiles = [];
              for(let r=0;r<rows;r++){
                for(let c=0;c<cols;c++){
                  const t = document.createElement('div');
                  t.style.cssText = 'position:absolute; overflow:hidden; will-change:transform,opacity; backface-visibility:hidden;';
                  t.style.left = (c*100/cols) + '%'; t.style.top = (r*100/rows) + '%';
                  t.style.width = (100/cols) + '%'; t.style.height = (100/rows) + '%';
                  const inner = document.createElement('div');
                  inner.style.cssText = 'position:absolute; width:' + (cols*100) + '%; height:' + (rows*100) + '%; left:' + (-c*100) + '%; top:' + (-r*100) + '%; background-size:cover; background-position:center; background-repeat:no-repeat;';
                  inner.style.backgroundImage = window.__introBgImg;
                  t.appendChild(inner);
                  t.dataset.delay = (Math.random()*0.35).toFixed(2);
                  t.dataset.dir = (Math.random() < 0.5 ? -1 : 1);
                  tiles.push(t); cont.appendChild(t);
                }
              }
              cont.style.display = 'block'; esconderVisuais();
              requestAnimationFrame(function(){
                tiles.forEach(function(t){ t.style.animation = 'cubosBounce .9s ease-in-out ' + t.dataset.delay + 's 1'; });
              });
              setTimeout(function(){
                tiles.forEach(function(t){
                  const d = (Math.random()*0.45).toFixed(2);
                  t.style.transition = 'transform .95s cubic-bezier(.35,0,.25,1) ' + d + 's, opacity .8s ease ' + d + 's';
                  t.style.transform = 'translateY(' + (t.dataset.dir*90) + '%) translateZ(70px)';
                  t.style.opacity = '0';
                });
              }, 1000);
              setTimeout(function(){ ovv.style.display = 'none'; }, 2500);
            } else {
              const fazerMetade = function(topo){
                const half = document.createElement('div');
                half.style.cssText = 'position:absolute;left:0;width:100%;height:50%;overflow:hidden;will-change:transform;';
                half.style.top = topo ? '0' : '50%';
                const inner = document.createElement('div');
                inner.style.cssText = 'position:absolute;left:0;width:100%;height:200%;background-size:cover;background-position:center;';
                inner.style.backgroundImage = window.__introBgImg;
                inner.style.top = topo ? '0' : '-100%';
                half.appendChild(inner);
                half.dataset.ty = topo ? '-100%' : '100%';
                return half;
              };
              const cima = fazerMetade(true), baixo = fazerMetade(false);
              cont.appendChild(cima); cont.appendChild(baixo);
              cont.style.display = 'block'; esconderVisuais();
              requestAnimationFrame(function(){
                [cima, baixo].forEach(function(p){ p.style.transition = 'transform .7s cubic-bezier(.7,0,.2,1)'; p.style.transform = 'translateY(' + p.dataset.ty + ')'; });
              });
              setTimeout(function(){ ovv.style.display = 'none'; }, 850);

          // Reveal "zoom": o nome cresce (zoom in) até encher o ecrã e a abertura dissolve-se
          window.__zoomReveal = function(){
            const ovv = document.getElementById('introOverlay');
            const content = document.getElementById('introContent');
            const nomeEl = document.getElementById('introNome');
            const alvo = nomeEl || content;

              alvo.style.transformOrigin = 'center center';
              alvo.style.willChange = 'transform';

              requestAnimationFrame(function(){ alvo.style.transform = 'scale(34)'; });
            }
            // dissolve de toda a abertura (fundo + nome) revelando o menu
            ovv.style.transition = 'opacity .7s ease .8s';
            ovv.style.opacity = '0';
            setTimeout(function(){ ovv.style.display = 'none'; }, 1600);
          };

          ov.classList.add('animar');
          const btn = document.getElementById('introBtn');

          if(btn) btn.addEventListener('click', window.__esconderIntro);

          setTimeout(window.__esconderIntro, dur);
        }
      })();

      // Barra fixa: carrossel (com horário) OU texto normal — gerido por atualizarBarraFixa
      if(config.rodape){
        window._rodapeCfg = config.rodape;
        window._barraFixaModo = null; // forçar reaplicação ao carregar
        if(window.atualizarBarraFixa) window.atualizarBarraFixa();

      // Rodapé final (aparece ao fazer scroll até ao fim)

        // Link do patrocinador — rodapé clicável abre o link

            else if(/^www\./i.test(_lk)) _lk = 'https://' + _lk;
            _rodape.style.cursor = 'pointer';
            _rodape.classList.add('tem-link');
            _rodape.onclick = function(){
              if(window.__PREVIEW) return;

      // ===== Bloco de publicidade (anúncio a outro negócio) =====
      {
        const _abox = document.getElementById('anuncioBox');
        if(_abox){
          const _an = config.anuncio || {};
          const _img = document.getElementById('anuncioImg');
          const _wa = document.getElementById('anuncioWa');
          if(_an.ativo && (_an.foto || window.__PREVIEW)){

            if(_an.foto){
              _img.src = _an.foto; _img.style.display = 'block';
              _img.style.minHeight = ''; _img.style.background = '';
            } else {
              // pré-visualização sem imagem ainda: mostra um espaço para se ver o bloco

              _img.style.minHeight = '170px'; _img.style.background = 'rgba(0,0,0,.06)';
            }
            // Link oculto — SÓ fica clicável se houver link escrito
            let _alk = _an.link && String(_an.link).trim();
            _abox.classList.toggle('tem-link', !!_alk);
            _abox.onclick = null;
            if(_alk){
              if(!/^(https?:|tel:|mailto:|wa\.me|\/)/i.test(_alk) && !/^www\./i.test(_alk)) _alk = 'https://' + _alk;
              else if(/^www\./i.test(_alk)) _alk = 'https://' + _alk;
              _abox.style.cursor = 'pointer';
              _abox.onclick = function(){ if(window.__PREVIEW) return; window.open(_alk, '_blank', 'noopener'); };
            } else {

            // Ícone de WhatsApp — SÓ aparece se houver número escrito
            const _anum = String(_an.whatsapp || '').replace(/\D/g, '').replace(/^00/, '');
            if(_anum){

              _wa.onclick = function(ev){ ev.stopPropagation(); if(window.__PREVIEW) ev.preventDefault(); };
              if(window.__PREVIEW) _anuncioDragWa(_abox, _wa);

            }
            // Métricas: anúncio visto (aparece no ecrã) e clicado (imagem ou WhatsApp)
            if(!window.__PREVIEW && _an.foto && window.__inc){
              if(!_abox._trkView && ('IntersectionObserver' in window)){
                _abox._trkView = true;
                var _aio = new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting && (!window.__umaVezDia || window.__umaVezDia('anv'))) window.__inc('anuncio_view'); }); }, { threshold: 0.4 });
                _aio.observe(_abox);
              }
              if(!_abox._trkClick){

      // Decoração sazonal (desativar se configurado)
      if(config.sazonal === false){ const ov = document.getElementById('sazonalOverlay'); if(ov) ov.remove(); }

      // Decorações por época (novo sistema, manual)
      try{ aplicarDecor(config); }catch(e){}

      // Cartão de fidelidade
      window._fidelidade = (config.fidelidade && config.fidelidade.ativo) ? config.fidelidade : null;
      const fb = document.getElementById('linkFidelidade');
      if(fb) fb.style.display = window._fidelidade ? 'flex' : 'none';

      window.__nomeRestaurante = (config.header && config.header.titulo) || '';

      const agb = document.getElementById('linkAgenda');
      if(agb) agb.style.display = (window._agenda && config.mostrarAgendaIcon !== false) ? 'flex' : 'none';
      // Ícones do topo: câmara e traduções (ligar/desligar pelo dono)
      { const cam = document.getElementById('linkCamera'); if(cam) cam.style.display = (config.mostrarCamera === false) ? 'none' : ''; }
      // A visibilidade/localização dos idiomas é decidida por _colocarExtras (cabeçalho/rodapé/flutuante). Aqui só escondemos se estiver desligado.

  // Pré-abertura publicitária (ecrã cheio, N segundos, estática ou animada) — mostra antes do menu
  function mostrarPreAbertura(cfg){
    return new Promise(function(resolve){
      cfg = cfg || {};
      var ov = document.getElementById('preAbertura');
      if(!ov || !cfg.ativo || !cfg.foto){ resolve(); return; }
      var dur = Math.max(1, Math.min(15, parseInt(cfg.duracao, 10) || 3));
      var _anim = cfg.animacao || 'nenhuma';
      var link = cfg.link && String(cfg.link).trim();
      if(link){ if(!/^(https?:|tel:|mailto:|wa\.me|\/)/i.test(link) && !/^www\./i.test(link)) link = 'https://' + link; else if(/^www\./i.test(link)) link = 'https://' + link; }
      ov.className = 'pa-anim-' + _anim;
      ov.innerHTML =
        '<img class="pa-img" src="' + (typeof RAW_BASE !== 'undefined' ? RAW_BASE : '') + cfg.foto + '" alt="Publicidade">' +
        '<span class="pa-tag">Publicidade</span>' +
        '<button type="button" class="pa-skip" id="paSkip">Saltar ›</button>';
      ov.style.display = 'block';
      void ov.offsetWidth; ov.classList.add('pa-on');
      if(link){ var _im = ov.querySelector('.pa-img'); if(_im){ _im.style.cursor = 'pointer'; _im.addEventListener('click', function(){ window.open(link, '_blank', 'noopener'); }); } }
      var done = false;
      function fechar(){ if(done) return; done = true; ov.classList.add('pa-sair'); setTimeout(function(){ ov.style.display = 'none'; ov.innerHTML = ''; ov.className = ''; resolve(); }, 450); }
      var t = setTimeout(fechar, dur * 1000);
      var sk = document.getElementById('paSkip'); if(sk) sk.addEventListener('click', function(){ clearTimeout(t); fechar(); });
    });
  }

  async function carregarConfig(){
    if(window.__PREVIEW) return; // em pré-visualização, os dados vêm do editor
    if(!sbC || !SLUG){ _limparEstatico(); console.log('[INFO] Sem negócio (?n=slug).'); return; }
    try{
      const { data:neg } = await sbC.from('negocios').select('*').eq('slug', SLUG).maybeSingle();
      if(!neg){ _limparEstatico(); console.log('[INFO] Negócio não encontrado:', SLUG); return; }
      if(neg.ativo === false){ document.body.innerHTML = '<div style="font-family:sans-serif;padding:40px;text-align:center;color:#4a3820;">Este menu está temporariamente indisponível.</div>'; return; }
      const { data:ent } = await sbC.from('entitlements').select('*').eq('negocio_id', neg.id).maybeSingle();
      const funcoes = (ent && ent.funcoes) || {};
      const pub = (ent && ent.publicidade) || {};
      window.__negocioId = neg.id;
      window.__negNome = neg.nome || '';
      const config = neg.config || {};
      aplicarPlano(config, funcoes, pub);
      try{ await mostrarPreAbertura(config.preAbertura); }catch(e){}   // publicidade de ecrã cheio, antes do menu
      aplicarConfig(config);
      try{ document.title = ((config.header && config.header.titulo) || neg.nome || 'Cardápio'); }catch(e){}
      if(window.__semTraducoes){ const ls = document.getElementById('langSwitch'); if(ls) ls.style.display = 'none'; }
      const menu = neg.menu || {};
      if(!Array.isArray(menu.categorias)) menu.categorias = [];
      window._menu = menu;
      try{ construirMenu(menu); }catch(e){ console.warn('menu', e); }
      try{ if(window.__ajustarCapa){ setTimeout(window.__ajustarCapa, 60); setTimeout(window.__ajustarCapa, 500); } }catch(e){}
    }catch(err){
      console.log('[INFO] Erro ao carregar do Supabase:', err.message);
    }
  }

  carregarConfig().finally(function(){ window.__cfgOk = true; window.__menuOk = true; window.__tryReveal(); });

  // ---- Métricas: visitas ao menu e vistas à publicidade (1 por dispositivo/dia) ----
  (function registarMetricas(){
    if(window.__PREVIEW || !sbC || !SLUG) return;
    var hoje; try{ hoje = new Date().toISOString().slice(0,10); }catch(e){ hoje = '0'; }
    function jaContou(k){ try{ return localStorage.getItem(k) === '1'; }catch(e){ return false; } }
    function marcar(k){ try{ localStorage.setItem(k, '1'); }catch(e){} }
    function inc(tipo){ try{ sbC.rpc('inc_metrica', { p_slug: SLUG, p_tipo: tipo }).then(function(){}, function(){}); }catch(e){} }
    window.__inc = inc;   // usado também pelo bloco de anúncio (view/clique)
    // 1 por dispositivo/dia: devolve true só na primeira vez do dia para uma dada chave
    window.__umaVezDia = function(chave){ var k = chave + '_' + SLUG + '_' + hoje; if(jaContou(k)) return false; marcar(k); return true; };
    // Visita ao menu
    var kMenu = 'vm_' + SLUG + '_' + hoje;
    if(!jaContou(kMenu)){ marcar(kMenu); inc('menu'); }
    // Jogos abertos (toque no separador dos jogos)
    var kJog = 'vj_' + SLUG + '_' + hoje;
    document.addEventListener('click', function(e){
      var t = e.target && e.target.closest ? e.target.closest('.tile[data-target="jogos"]') : null;
      if(t && !jaContou(kJog)){ marcar(kJog); inc('jogos'); }
    }, true);
    // Publicidade vista (rodapé final entra no ecrã)
    var kAd = 'va_' + SLUG + '_' + hoje;
    if(!jaContou(kAd) && ('IntersectionObserver' in window)){
      function ligar(){
        var alvo = document.getElementById('rodapeFinal');
        if(!alvo) return;
        var io = new IntersectionObserver(function(ents){
          for(var i=0;i<ents.length;i++){ if(ents[i].isIntersecting){ if(!jaContou(kAd)){ marcar(kAd); inc('ad'); } io.disconnect(); break; } }
        }, { threshold: 0.4 });
        io.observe(alvo);
      }
      if(document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(ligar, 800);
      else window.addEventListener('load', function(){ setTimeout(ligar, 800); });
    }
  })();

    if(velhaBoard[i] || verificarVencedorVelha() || velhaBoard.every(c => c)) return;
    velhaBoard[i] = velhaJogadorAtual;
    if(!verificarVencedorVelha() && !velhaBoard.every(c => c)){
      velhaJogadorAtual = velhaJogadorAtual === 'X' ? 'O' : 'X';
      if(velhaModo === 'ia' && velhaJogadorAtual === 'O') setTimeout(() => { ia_velha(); }, 500);
    }
    renderVelha();
  };
  function ia_velha(){
    // Minimax: joga de forma inteligente (com ~15% de jogadas aleatórias para ser vencível)
    let idx;
    const vazias = velhaBoard.map((c,i)=>c?null:i).filter(i=>i!==null);
    if(Math.random() < 0.15){
      idx = vazias[Math.floor(Math.random() * vazias.length)];
    } else {
      idx = melhorJogadaVelha(velhaBoard.slice(), 'O').idx;
      if(idx == null) idx = vazias[0];

    if(idx != null){ velhaBoard[idx] = 'O'; if(!verificarVencedorVelha()) velhaJogadorAtual = 'X'; }
    renderVelha();

  function vencedorTabuleiro(b){
    const linhas = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for(const [a,b2,c] of linhas){ if(b[a] && b[a] === b[b2] && b[b2] === b[c]) return b[a]; }
    return null;
  }
  function melhorJogadaVelha(b, jogador){
    const venc = vencedorTabuleiro(b);
    if(venc === 'O') return { score: 10 };
    if(venc === 'X') return { score: -10 };
    if(b.every(c => c)) return { score: 0 };
    let melhor = null;
    b.forEach((cel, i) => {
      if(cel) return;
      const nb = b.slice(); nb[i] = jogador;
      const res = melhorJogadaVelha(nb, jogador === 'O' ? 'X' : 'O');
      const score = res.score;
      if(melhor === null ||
         (jogador === 'O' && score > melhor.score) ||
         (jogador === 'X' && score < melhor.score)){
        melhor = { idx: i, score: score };
      }
    });
    return melhor;
  }

  function baralhar(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  const memSimbolos = ['🍕','🍔','🍟','🌭','🍣','🍰','🍺','🍷','🥗','🍩'];
  let memCartas = [], memReveladas = [], memViradas = [], memPares = 0, memJogadas = 0, memBloqueado = false;
  function iniciarMemoria(){

  function renderMemoria(){

    html += '<div class="mem-board">';
    memCartas.forEach((s, i) => {
      const rev = memReveladas[i];
      html += '<button class="mem-carta' + (rev ? ' virada' : '') + '" onclick="virarMem(' + i + ')">' + (rev ? s : '') + '</button>';
    });
    html += '</div>';
    if(memPares === memSimbolos.length){

  let quizSeq = [], quizIdx = 0;
  function prepararPergunta(q){
    const correta = q.o[0];

  }
  function nivelDoIndice(i){
    if(i < quizFacil.length) return 'Fácil';

  function iniciarQuiz(){
    let html = '<p class="jogo-titulo">Escolhe o modo:</p><div class="jogo-menu">' +

      '<button class="jogo-btn" onclick="quizEntrarOuCriar()">👥 Multiplayer</button>' +

  window.iniciarQuizSolo = function(){
    quizSeq = [].concat(
      baralhar(quizFacil.slice()).map(prepararPergunta),
      baralhar(quizMedio.slice()).map(prepararPergunta),
      baralhar(quizDificil.slice()).map(prepararPergunta)
    );

  function renderQuiz(){
    if(quizIdx >= quizSeq.length){
      let html = '<div class="velha-turno velha-fim">🏆 Incrível! Acertaste todas as ' + quizSeq.length + ' perguntas!</div>';
      html += '<div class="jogo-menu"><button class="jogo-btn claro" onclick="iniciarQuizSolo()">Jogar outra vez</button></div>';

      window.mostrarPubJogos(function(){});

    const nivel = nivelDoIndice(quizIdx);
    let html = '<p style="text-align:center;font-size:0.8rem;color:var(--castanho-suave);">Pergunta ' + (quizIdx + 1) + ' · Nível: <strong>' + nivel + '</strong></p>';

  async function qzCriarSala(){
    try{
      qzSala = Math.random().toString(36).substr(2, 4).toUpperCase();
      qzCriador = true;
      const indices = baralhar(quizPoolOnline.map((_, i) => i)).slice(0, 8);
      qzPerguntas = indices.map(i => prepararPergunta(quizPoolOnline[i]));
      await mpPost('quiz_salas', { codigo:qzSala, estado:'lobby', pergunta:0, criador:qzNome, perguntas: JSON.stringify(qzPerguntas) });
      await mpPost('quiz_jogadores', { sala_id:qzSala, nome:qzNome, pontos:0 });
      qzLobby();
    }catch(err){ alert('❌ Erro ao criar sala: ' + err.message); }
  }

  async function qzEntrar(codigo){
    try{
      const salas = await mpGet('quiz_salas', 'codigo=eq.' + encodeURIComponent(codigo));

      qzPerguntas = JSON.parse(salas[0].perguntas || '[]');
      await mpPost('quiz_jogadores', { sala_id:qzSala, nome:qzNome, pontos:0 });
      qzLobby();
    }catch(err){ alert('❌ Erro ao entrar: ' + err.message); }
  }

  function qzMostrarPergunta(idx){
    qzRespondido = false;
    const q = qzPerguntas[idx];
    if(!q){ qzResultados(); return; }
    let html = '<p style="text-align:center;font-size:0.8rem;color:var(--castanho-suave);">Pergunta ' + (idx + 1) + '/' + qzPerguntas.length + '</p>';
    html += '<p id="qzTimer" style="text-align:center;font-size:1.7rem;font-weight:900;color:var(--castanho);margin:4px 0;">' + QZ_TEMPO + '</p>';

    q.o.forEach((op, i) => { html += '<button class="jogo-btn" onclick="qzResponder(' + i + ')">' + op + '</button>'; });
    html += '</div>';
    jogoConteudo.innerHTML = html;
    // contador visual (não decide nada; a progressão é do criador)
    let vt = QZ_TEMPO;
    const vtiv = setInterval(() => {
      vt--;
      const e = document.getElementById('qzTimer');
      if(e && !qzRespondido) e.textContent = vt > 0 ? vt : '⏱';
      if(vt <= 0) clearInterval(vtiv);
    }, 1000);
    qzIntervals.push(vtiv);
  }

    if(qzRespondido) return;
    qzRespondido = true;
    const bts = document.querySelectorAll('#qzOpcoes .jogo-btn');
    bts.forEach(b => { b.style.pointerEvents = 'none'; });
    if(bts[opcao]) bts[opcao].style.background = 'var(--dourado)';
    const t = document.getElementById('qzTimer'); if(t) t.textContent = '✓ Respondido';
    try{ await mpPost('quiz_respostas', { sala_id:qzSala, nome:qzNome, pergunta:qzIdx, opcao:opcao }); }catch(e){}
  };

  function qzPollJogador(){
    qzIntervals.push(setInterval(async () => {
      try{
        const salas = await mpGet('quiz_salas', 'codigo=eq.' + qzSala);
        const s = salas[0]; if(!s) return;
        if(s.estado === 'fim'){ qzLimpar(); qzResultados(); return; }
        if(s.estado === 'pergunta' && s.pergunta !== qzIdx){ qzIdx = s.pergunta; qzMostrarPergunta(qzIdx); }
      }catch(e){}
    }, 800));
  }

  function qzHostTimer(){
    let t = QZ_TEMPO;
    qzTimerHost = setInterval(async () => {
      t--;
      if(t <= 0){ clearInterval(qzTimerHost); qzTimerHost = null; await qzFecharPergunta(qzIdx); }
    }, 1000);

  async function qzFecharPergunta(idx){
    try{
      const q = qzPerguntas[idx];
      const respostas = await mpGet('quiz_respostas', 'sala_id=eq.' + qzSala + '&pergunta=eq.' + idx);
      const jogadores = await mpGet('quiz_jogadores', 'sala_id=eq.' + qzSala);
      for(const r of respostas){
        if(r.opcao === q.c){
          const j = jogadores.find(x => x.nome === r.nome);
          const novos = (j ? j.pontos : 0) + 100;
          await mpPatch('quiz_jogadores', 'sala_id=eq.' + qzSala + '&nome=eq.' + encodeURIComponent(r.nome), { pontos: novos });
        }
      }
      if(idx + 1 < qzPerguntas.length){

        html += '<div class="cart-acoes"><button class="cart-fechar" id="cartFechar">Fechar</button><button class="cart-limpar" id="cartLimpar">Limpar lista</button></div>';

    // Devolve lista de opções [{label, preco}] se o item tiver vários tamanhos/doses; senão null
    function opcoesDoItem(item, precoEl){
      const seg = item.nextElementSibling;
      if(seg && seg.classList && seg.classList.contains('tabela-doses')){
        const doses = Array.from(seg.querySelectorAll('.dose')).map(td => td.textContent.trim());
        const precos = Array.from(seg.querySelectorAll('.preco-dose')).map(td => td.textContent.trim());
        if(doses.length) return doses.map((d, i) => ({ label:d, preco:precos[i] || '' }));
      }
      const precoTxt = precoEl ? precoEl.textContent.trim() : '';
      if(precoTxt.includes('/')){
        const partes = precoTxt.split('/').map(s => s.trim()).filter(Boolean);
        if(partes.length === 2) return [{ label:'Meia dose', preco:partes[0] }, { label:'Dose', preco:partes[1] }];
        if(partes.length > 2) return partes.map((p, i) => ({ label:'Opção ' + (i+1), preco:p }));
      }
      return null;
    }

    function abrirEscolha(nome, ops, btnRef){
      const p = document.getElementById('escPainel');

          escOverlay.classList.remove('aberto');
          if(btnRef) feedbackBtn(btnRef);

      escOverlay.classList.add('aberto');

    window.montarBotoesLista = function(){
      const _ativo = _cartCfg().ativo;
      document.querySelectorAll('main .item').forEach(item => {
        if(item.closest('#jogos')) return;
        if(item.closest('.sec-pratodia')){ const _e = item.querySelector('.btn-add-lista'); if(_e) _e.remove(); return; }

        const nomeEl = item.querySelector('.nome');

        btn.className = 'btn-add-lista';

        btn.addEventListener('click', e => {
          e.stopPropagation();
          const ops = opcoesDoItem(item, precoEl);
          if(ops && ops.length){
            abrirEscolha(nomeEl.textContent.trim(), ops, btn);
          } else {
            adicionarALista(nomeEl.textContent.trim(), precoEl ? precoEl.textContent.trim() : '');
            feedbackBtn(btn);
          }
        });
        item.appendChild(btn);
      });

  (function(){

    window.__setPhotoboothInfo = function(n, s, m){ NOME = n || ''; SOCIAL = s || ''; if(m) MOLDE = m; };

    input.type = 'file';
    input.accept = 'image/*';
    input.setAttribute('capture','environment');

    document.body.appendChild(input);

    overlay.id = 'camOverlay';

    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if(e.target === overlay) overlay.classList.remove('aberto'); });

      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => comporMoldura(ev.target.result);
      reader.readAsDataURL(file);
      input.value = '';
