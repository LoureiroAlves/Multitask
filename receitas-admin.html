<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Receitas — Painel àMesa</title>
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="receitas/receitas.css">
<style>
  html,body{ margin:0; background:#f6efe2; }
  .barra{ position:sticky; top:0; z-index:60; background:#2e2418; color:#fff; display:flex; align-items:center; gap:12px; padding:10px 16px; flex-wrap:wrap; }
  .barra a{ color:#ffd27a; font-weight:900; text-decoration:none; }
  .migalhas{ font-weight:800; font-size:.9rem; opacity:.95; }
  .migalhas a{ color:#fff; opacity:.75; } .migalhas a:hover{ opacity:1; }
  .migalhas span{ opacity:.5; margin:0 6px; }
  main{ max-width:1200px; margin:0 auto; padding:18px 16px 80px; }
  h1.t{ font-family:'Playfair Display', serif; margin:4px 0 14px; font-size:1.8rem; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .bt{ border:none; border-radius:12px; padding:10px 14px; font-weight:900; font-size:.9rem; background:#fff; color:#2e2418; border:1.5px solid var(--r-linha); cursor:pointer; }
  .bt.p{ background:#c05a3a; color:#fff; border-color:#c05a3a; }
  .bt.v{ background:#2e9b57; color:#fff; border-color:#2e9b57; }
  .bt.x{ color:#b23; }
  .grelha{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px; }
  .catA{ position:relative; border-radius:20px; padding:18px; min-height:118px; color:#fff; background:var(--c); cursor:pointer; overflow:hidden; box-shadow:0 8px 20px rgba(46,36,24,.12); }
  .catA .e{ position:absolute; right:6px; top:-4px; font-size:3.6rem; }
  .catA b{ font-family:'Playfair Display', serif; font-size:1.25rem; display:block; margin-top:40px; }
  .catA small{ font-weight:800; opacity:.9; }
  .catA .ed{ position:absolute; left:10px; top:10px; background:rgba(255,255,255,.25); border:none; color:#fff; border-radius:10px; padding:4px 9px; font-weight:900; cursor:pointer; }
  .catA.off{ filter:grayscale(.7); opacity:.7; }
  .nova{ border:2.5px dashed #cdbb9a; border-radius:20px; min-height:118px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#8a7a63; cursor:pointer; background:transparent; font-size:1rem; }
  .itens{ display:grid; gap:10px; }
  .item{ display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:12px 14px; cursor:pointer; box-shadow:0 4px 12px rgba(46,36,24,.06); }
  .item .ic{ font-size:1.8rem; width:46px; text-align:center; } .item b{ font-family:'Playfair Display', serif; font-size:1.08rem; }
  .item .m{ color:#8a7a63; font-weight:800; font-size:.8rem; } .item .st{ margin-left:auto; font-weight:900; font-size:.72rem; border-radius:999px; padding:4px 10px; }
  .st.pub{ background:#e3f5ea; color:#1e6b3c; } .st.ras{ background:#fff1d6; color:#8a5b00; }
  /* editor */
  .ed-layout{ display:grid; grid-template-columns:minmax(0, 1fr) 400px; gap:18px; align-items:start; }
  @media (max-width:980px){ .ed-layout{ grid-template-columns:1fr; } .previa{ position:static !important; } }
  .ferr{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .caixa{ background:#fff; border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 4px 14px rgba(46,36,24,.06); }
  .caixa h3{ margin:0 0 10px; font-family:'Playfair Display', serif; font-size:1.2rem; display:flex; align-items:center; justify-content:space-between; }
  label.l{ display:block; font-weight:900; font-size:.78rem; color:#8a7a63; margin:10px 0 4px; letter-spacing:.3px; }
  input.c, textarea.c, select.c{ width:100%; border:1.5px solid var(--r-linha); border-radius:10px; padding:9px 10px; font:700 .95rem 'Nunito', sans-serif; color:#2e2418; background:#fffdf9; }
  textarea.c{ min-height:70px; resize:vertical; }
  .linha2{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
  @media (max-width:640px){ .linha2{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .ing{ display:grid; grid-template-columns:minmax(0,2.2fr) 80px 130px minmax(0,1.5fr) auto auto; gap:6px; align-items:center; padding:6px 0; border-bottom:1px dashed var(--r-linha); }
  @media (max-width:760px){ .ing{ grid-template-columns:1fr 1fr; } }
  .ing .id{ grid-column:1/-1; font-size:.7rem; color:#a8987c; font-weight:800; margin-top:-2px; }
  .mini{ border:none; background:#f3ece0; border-radius:8px; padding:7px 9px; font-weight:900; cursor:pointer; }
  .passoE{ border:1.5px solid var(--r-linha); border-radius:14px; padding:12px; margin-bottom:10px; background:#fffdf9; }
  .passoE .cab{ display:flex; gap:8px; align-items:center; }
  .passoE .num{ width:30px; height:30px; border-radius:50%; background:#c05a3a; color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; flex:none; }
  .chipsI{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chipsI button{ border:1.5px solid var(--r-linha); background:#fff; border-radius:999px; padding:5px 10px; font-weight:800; font-size:.78rem; cursor:pointer; }
  .chipsI button.on{ background:#2e2418; color:#fff; border-color:#2e2418; }
  .qtdT{ margin:10px 0 4px; font-weight:900; font-size:.78rem; color:var(--r-muted); } .qtdT small{ font-weight:700; }
  .qtdL{ display:grid; grid-template-columns:1fr 110px 120px; gap:6px; align-items:center; margin-top:5px; } .qtdL span{ font-weight:800; font-size:.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .previa{ position:sticky; top:70px; }
  .tel{ background:#15100b; border-radius:44px; padding:12px; box-shadow:0 30px 60px rgba(46,36,24,.25); }
  .tel .sc{ background:var(--r-bg); border-radius:34px; height:76vh; max-height:780px; overflow:auto; padding:14px 12px 30px; }
  .msg{ font-weight:800; border-radius:12px; padding:10px 12px; margin:8px 0; display:none; }
  .msg.ok{ display:block; background:#e3f5ea; color:#1e6b3c; } .msg.erro{ display:block; background:#fbe7e4; color:#a33; } .msg.av{ display:block; background:#fff1d6; color:#8a5b00; }
  .sw{ display:flex; align-items:center; gap:8px; font-weight:900; cursor:pointer; background:#fff; border:1.5px solid var(--r-linha); border-radius:12px; padding:8px 12px; }
  .modal{ position:fixed; inset:0; z-index:9000; background:rgba(30,20,10,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal .cx{ background:#fff; border-radius:20px; padding:18px; width:100%; max-width:560px; max-height:90vh; overflow:auto; }
  .bloqueio{ max-width:460px; margin:60px auto; background:#fff; border-radius:20px; padding:24px; text-align:center; font-weight:800; }
</style>
</head>
<body class="amr">
<div class="barra"><a href="painel.html">← Painel</a><div class="migalhas" id="mig"></div></div>
<main id="app"><div style="text-align:center;padding:40px;font-weight:800;color:#8a7a63;">A verificar o acesso…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="receitas/modelo.js"></script>
<script src="receitas/dados.js"></script>
<script src="receitas/layouts.js"></script>
<script src="receitas/lista.js"></script>
<script src="receitas/player.js"></script>
<script>
(function(){
  var APP = document.getElementById('app'), MIG = document.getElementById('mig');
  var M = AMR.modelo, D = AMR.dados, e = M.esc;
  var CATS = [];

  function migalhas(itens){ MIG.innerHTML = itens.map(function(x){ return x[1] ? '<a href="' + x[1] + '">' + e(x[0]) + '</a>' : '<b>' + e(x[0]) + '</b>'; }).join('<span>›</span>'); }
  function catPorSlug(s){ return CATS.filter(function(c){ return c.slug === s; })[0]; }
  function catPorId(id){ return CATS.filter(function(c){ return c.id === id; })[0]; }
  function msg(el, t, tipo){ el.className = 'msg ' + tipo; el.innerHTML = t; }

  // ================= CATEGORIAS =================
  async function vistaCategorias(){
    migalhas([['Negócios', 'painel.html'], ['Receitas']]);
    APP.innerHTML = '<h1 class="t">🍳 Receitas</h1><p style="margin:-6px 0 16px;color:#8a7a63;font-weight:800;">Categorias de receitas. Abre uma categoria para veres e editares as receitas. <a href="receitas.html" target="_blank" style="color:#c05a3a;">Ver o site ↗</a></p><div class="grelha" id="g"></div>';
    CATS = await D.categorias(true);
    var g = document.getElementById('g');
    var totais = await Promise.all(CATS.map(function(c){ return D.receitas({ categoriaId:c.id, porPagina:1, incluirRascunhos:true }).then(function(r){ return r.total; }).catch(function(){ return '?'; }); }));
    g.innerHTML = CATS.map(function(c, i){ return '<div class="catA' + (c.ativo ? '' : ' off') + '" style="--c:' + e(c.cor) + '" data-s="' + e(c.slug) + '"><button class="ed" data-ed="' + e(c.id) + '">✎</button><span class="e">' + e(c.emoji) + '</span><b>' + e(c.nome) + '</b><small>' + totais[i] + ' receita(s)' + (c.ativo ? '' : ' · oculta') + '</small></div>'; }).join('')
      + '<button class="nova" id="novaCat">+ Nova categoria</button>';
    g.querySelectorAll('.catA').forEach(function(d){ d.onclick = function(ev){ if(ev.target.closest('.ed')) return; location.hash = 'cat=' + d.dataset.s; }; });
    g.querySelectorAll('[data-ed]').forEach(function(b){ b.onclick = function(){ formCategoria(catPorId(b.dataset.ed)); }; });
    document.getElementById('novaCat').onclick = function(){ formCategoria(null); };
  }
  function formCategoria(c){
    c = c || { nome:'', slug:'', emoji:'🍽️', cor:'#c05a3a', descricao:'', ordem:100, ativo:true };
    var md = document.createElement('div'); md.className = 'modal';
    md.innerHTML = '<div class="cx"><h3 class="serif" style="margin:0 0 6px;">' + (c.id ? 'Editar categoria' : 'Nova categoria') + '</h3>'
      + '<label class="l">Nome</label><input class="c" id="cN" value="' + e(c.nome) + '" placeholder="Ex.: Bacalhau">'
      + '<label class="l">Identificador no endereço</label><input class="c" id="cS" value="' + e(c.slug) + '" placeholder="bacalhau"' + (c.id ? ' disabled title="Não muda depois de criada, para não partir links."' : '') + '>'
      + '<div class="linha2"><div><label class="l">Emoji</label><input class="c" id="cE" value="' + e(c.emoji) + '"></div><div><label class="l">Cor</label><input class="c" id="cC" type="color" value="' + e(c.cor) + '" style="height:42px;padding:3px;"></div><div><label class="l">Ordem</label><input class="c" id="cO" type="number" value="' + (c.ordem || 100) + '"></div><div><label class="l">Visível</label><label class="sw"><input type="checkbox" id="cA"' + (c.ativo !== false ? ' checked' : '') + '> no site</label></div></div>'
      + '<label class="l">Descrição curta (opcional)</label><input class="c" id="cD" value="' + e(c.descricao || '') + '">'
      + '<div class="msg" id="cM"></div><div style="display:flex;gap:8px;margin-top:14px;"><button class="bt" id="cX">Cancelar</button><button class="bt p" id="cG" style="flex:1;">Guardar categoria</button></div></div>';
    document.body.appendChild(md);
    var nE = md.querySelector('#cN'), sE = md.querySelector('#cS');
    if(!c.id) nE.oninput = function(){ sE.value = M.slug(nE.value); };
    md.querySelector('#cX').onclick = function(){ md.remove(); };
    md.querySelector('#cG').onclick = async function(){
      var o = { id:c.id, nome:nE.value.trim(), slug:c.id ? c.slug : M.slug(sE.value || nE.value), emoji:md.querySelector('#cE').value.trim(), cor:md.querySelector('#cC').value, ordem:md.querySelector('#cO').value, ativo:md.querySelector('#cA').checked, descricao:md.querySelector('#cD').value.trim() };
      if(!o.nome || !o.slug){ msg(md.querySelector('#cM'), 'Falta o nome.', 'erro'); return; }
      try{ await D.guardarCategoria(o); md.remove(); vistaCategorias(); }catch(err){ msg(md.querySelector('#cM'), 'Erro: ' + e(err.message), 'erro'); }
    };
  }

  // ================= RECEITAS DE UMA CATEGORIA =================
  async function vistaCategoria(slug){
    if(!CATS.length) CATS = await D.categorias(true);
    var c = catPorSlug(slug); if(!c){ location.hash = ''; return; }
    migalhas([['Negócios', 'painel.html'], ['Receitas', '#'], [c.nome]]);
    APP.innerHTML = '<h1 class="t"><span style="font-size:2.2rem">' + e(c.emoji) + '</span>' + e(c.nome) + '<button class="bt p" id="nova" style="margin-left:auto;">+ Nova receita</button></h1>'
      + '<div class="amr-pesq" style="margin-bottom:14px;"><input id="q" type="search" placeholder="Procurar receita (nome, ingrediente, etiqueta)…"></div><div class="itens" id="l"></div><div id="mais"></div>';
    document.getElementById('nova').onclick = function(){ location.hash = 'rec=nova&cat=' + c.slug; };
    var pagina = 0, termo = '';
    async function carregar(reini){
      if(reini){ pagina = 0; document.getElementById('l').innerHTML = ''; }
      var r = await D.receitas({ categoriaId:c.id, pesquisa:termo, pagina:pagina, incluirRascunhos:true, porPagina:50 });
      var l = document.getElementById('l');
      if(!r.lista.length && pagina === 0){ l.innerHTML = '<div class="amr-vazio">' + (termo ? 'Nada encontrado.' : 'Ainda não há receitas nesta categoria. Cria a primeira! 👆') + '</div>'; }
      l.insertAdjacentHTML('beforeend', r.lista.map(function(x){ return '<div class="item" data-id="' + e(x.id) + '"><span class="ic">' + e(x.emoji || c.emoji) + '</span><div><b>' + e(x.nome) + '</b><div class="m">' + e([M.DIFICULDADES[x.dificuldade], M.tempoTexto(x.tempo_total), x.porcoes ? x.porcoes + ' pax' : ''].filter(Boolean).join(' · ')) + ' · /' + e(x.slug) + '</div></div><span class="st ' + (x.publicado ? 'pub' : 'ras') + '">' + (x.publicado ? 'PUBLICADA' : 'RASCUNHO') + '</span></div>'; }).join(''));
      l.querySelectorAll('.item').forEach(function(it){ it.onclick = function(){ location.hash = 'rec=' + it.dataset.id + '&cat=' + c.slug; }; });
      var mais = document.getElementById('mais'); mais.innerHTML = '';
      if((pagina + 1) * r.porPagina < r.total){ var b = document.createElement('button'); b.className = 'amr-mais'; b.textContent = 'Ver mais (' + (r.total - (pagina + 1) * r.porPagina) + ')'; b.onclick = function(){ pagina++; carregar(false); }; mais.appendChild(b); }
    }
    var t; document.getElementById('q').oninput = function(ev){ clearTimeout(t); t = setTimeout(function(){ termo = ev.target.value.trim(); carregar(true); }, 280); };
    carregar(true);
  }

  // ================= EDITOR DA RECEITA =================
  var MODELO_NOVO = { nome:'', descricao:'', porcoes:4, tempo:{ preparacao:10, cozedura:20 }, dificuldade:'facil', ingredientes:[], passos:[], notas:[], tags:[], player:{ ativo:true }, layout:{ tipo:'classico' } };
  async function vistaEditor(id, catSlug){
    if(!CATS.length) CATS = await D.categorias(true);
    var reg = { id:null, publicado:false, ordem:100 }, R;
    var cat = catPorSlug(catSlug) || CATS[0];
    if(id && id !== 'nova'){
      var dd = await D.receitaPorId(id);
      if(!dd){ APP.innerHTML = '<div class="amr-vazio">Receita não encontrada.</div>'; return; }
      reg = dd; cat = catPorId(reg.categoria_id) || cat;
      R = M.normalizar(reg.dados || {}).receita;
    } else {
      R = M.normalizar(Object.assign({}, MODELO_NOVO, { nome:'Nova receita', categoria:cat.slug })).receita; R.ingredientes = []; R.passos = [];
    }
    R.categoria = cat.slug;
    var slugOriginal = reg.slug || '', slugMexido = !!reg.id;
    migalhas([['Negócios', 'painel.html'], ['Receitas', '#'], [cat.nome, '#cat=' + cat.slug], [R.nome || 'Nova receita']]);

    APP.innerHTML = '<div class="ferr">'
      + '<button class="bt" id="bImp">📁 Importar JSON</button><button class="bt" id="bCol">📋 Colar JSON</button><button class="bt" id="bExp">⬇️ Exportar JSON</button>'
      + '<label class="sw"><input type="checkbox" id="pub"' + (reg.publicado ? ' checked' : '') + '> Publicada no site</label>'
      + '<span style="flex:1"></span>' + (reg.id ? '<button class="bt x" id="bDel">🗑 Apagar</button><a class="bt" id="bVer" target="_blank" href="receitas.html?r=' + encodeURIComponent(reg.slug) + '">👁 Ver no site</a>' : '')
      + '<button class="bt v" id="bGuardar">💾 Guardar</button><input type="file" id="fImp" accept=".json,application/json" style="display:none"></div>'
      + '<div class="msg" id="msg"></div>'
      + '<div class="ed-layout"><div id="form"></div><div class="previa"><div style="font-weight:900;color:#8a7a63;font-size:.8rem;margin:0 0 6px 6px;">PRÉ-VISUALIZAÇÃO (como no site)</div><div class="tel"><div class="sc amr" id="prev"></div></div></div></div>';
    var MSG = document.getElementById('msg');

    function opcoesUnid(sel){ return Object.keys(M.UNIDADES).map(function(u){ var n = u === 'un' ? 'unidade(s)' : u === 'colher-sopa' ? 'c. sopa' : u === 'colher-cha' ? 'c. chá' : u; return '<option value="' + u + '"' + (u === sel ? ' selected' : '') + '>' + n + '</option>'; }).join(''); }
    function pintaForm(){
      var f = document.getElementById('form');
      f.innerHTML = '<div class="caixa"><h3>Básico</h3>'
        + '<label class="l">Nome</label><input class="c" data-k="nome" value="' + e(R.nome) + '">'
        + '<div class="linha2"><div style="grid-column:span 2"><label class="l">Endereço (slug)</label><input class="c" id="slug" value="' + e(R.id) + '"></div><div style="grid-column:span 2"><label class="l">Categoria</label><select class="c" id="selCat">' + CATS.map(function(c){ return '<option value="' + e(c.slug) + '"' + (c.slug === R.categoria ? ' selected' : '') + '>' + e(c.emoji + ' ' + c.nome) + '</option>'; }).join('') + '</select></div></div>'
        + '<label class="l">Descrição</label><textarea class="c" data-k="descricao">' + e(R.descricao) + '</textarea>'
        + '<div class="linha2"><div><label class="l">Porções</label><input class="c" type="number" min="1" data-k="porcoes" value="' + R.porcoes + '"></div><div><label class="l">Preparação (min)</label><input class="c" type="number" min="0" data-t="preparacao" value="' + (R.tempo.preparacao || 0) + '"></div><div><label class="l">Cozedura (min)</label><input class="c" type="number" min="0" data-t="cozedura" value="' + (R.tempo.cozedura || 0) + '"></div><div><label class="l">Total (min)</label><input class="c" type="number" min="0" data-t="total" value="' + (R.tempo.total || 0) + '"></div></div>'
        + '<div class="linha2"><div><label class="l">Dificuldade</label><select class="c" data-k="dificuldade">' + Object.keys(M.DIFICULDADES).map(function(d){ return '<option value="' + d + '"' + (d === R.dificuldade ? ' selected' : '') + '>' + M.DIFICULDADES[d] + '</option>'; }).join('') + '</select></div><div><label class="l">Emoji</label><input class="c" data-ly="emoji" value="' + e(R.layout.emoji || '') + '" placeholder="' + e((catPorSlug(R.categoria) || {}).emoji || '') + '"></div><div><label class="l">Cor</label><input class="c" type="color" data-ly="cor" value="' + e(R.layout.cor || (catPorSlug(R.categoria) || {}).cor || '#c05a3a') + '" style="height:40px;padding:3px;"></div><div><label class="l">Layout</label><select class="c" data-ly="tipo">' + AMR.layouts.nomes().map(function(n){ return '<option' + (n === R.layout.tipo ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div></div>'
        + '<label class="l">Etiquetas (separadas por vírgulas)</label><input class="c" id="tags" value="' + e(R.tags.join(', ')) + '">'
        + '<label class="sw" style="margin-top:10px;display:inline-flex;"><input type="checkbox" id="plAtivo"' + (R.player.ativo ? ' checked' : '') + '> Mostrar "Começar receita" (modo passo a passo)</label></div>'
        // ingredientes
        + '<div class="caixa"><h3>Ingredientes <button class="mini" id="addI">+ Ingrediente</button></h3><div id="ings">' + R.ingredientes.map(function(i, k){
            return '<div class="ing" data-i="' + k + '"><input class="c" data-f="nome" value="' + e(i.nome) + '" placeholder="Nome"><input class="c" data-f="quantidade" type="number" step="any" value="' + (i.quantidade == null ? '' : i.quantidade) + '" placeholder="Qtd"' + (i.unidade === 'q.b.' ? ' disabled' : '') + '><select class="c" data-f="unidade">' + opcoesUnid(i.unidade) + '</select><input class="c" data-f="nota" value="' + e(i.nota || '') + '" placeholder="Nota (opcional)"><label title="Opcional" style="font-size:.75rem;font-weight:900;"><input type="checkbox" data-f="opcional"' + (i.opcional ? ' checked' : '') + '> opc.</label><span style="white-space:nowrap"><button class="mini" data-m="-1">↑</button><button class="mini" data-m="1">↓</button><button class="mini" data-d="1">✕</button></span><div class="id">id: ' + e(i.ingrediente_id) + '</div></div>'; }).join('') + '</div></div>'
        // passos
        + '<div class="caixa"><h3>Passos <button class="mini" id="addP">+ Passo</button></h3><div id="pss">' + R.passos.map(function(p, k){
            var tm = p.timer ? p.timer.segundos : 0;
            return '<div class="passoE" data-p="' + k + '"><div class="cab"><span class="num">' + (k + 1) + '</span><input class="c" data-f="titulo" value="' + e(p.titulo) + '" placeholder="Título do passo"><span style="white-space:nowrap"><button class="mini" data-m="-1">↑</button><button class="mini" data-m="1">↓</button><button class="mini" data-d="1">✕</button></span></div>'
              + '<textarea class="c" data-f="descricao" style="margin-top:8px;" placeholder="O que fazer neste passo">' + e(p.descricao) + '</textarea>'
              + '<div class="linha2"><div><label class="l">⏱ Minutos</label><input class="c" type="number" min="0" data-f="tmin" value="' + Math.floor(tm / 60) + '"></div><div><label class="l">Segundos</label><input class="c" type="number" min="0" max="59" data-f="tseg" value="' + (tm % 60) + '"></div><div style="grid-column:span 2"><label class="l">Nome do temporizador</label><input class="c" data-f="trot" value="' + e(p.timer ? p.timer.rotulo : '') + '" placeholder="(opcional)"></div></div>'
              + '<label class="l">Dica (opcional)</label><input class="c" data-f="dica" value="' + e(p.dica || '') + '">'
              + '<label class="l">Ingredientes usados neste passo</label><div class="chipsI">' + R.ingredientes.map(function(i){ return '<button type="button" data-ing="' + e(i.ingrediente_id) + '" class="' + ((p.ingredientes || []).indexOf(i.ingrediente_id) >= 0 ? 'on' : '') + '">' + e(i.nome) + '</button>'; }).join('') + '</div><div class="qtdsP">' + qtdsHTML(p) + '</div></div>'; }).join('') + '</div></div>'
        + '<div class="caixa"><h3>Notas</h3><textarea class="c" id="notas" placeholder="Uma nota por linha">' + e(R.notas.join('\n')) + '</textarea></div>';
      ligaForm();
    }
    var tPrev = null;
    function previa(){ clearTimeout(tPrev); tPrev = setTimeout(function(){ try{ var r = M.normalizar(JSON.parse(JSON.stringify(R))).receita; AMR.layouts.render(document.getElementById('prev'), r, { categoria:catPorSlug(R.categoria) || {}, aoComecar:function(f){ AMR.player.abrir(r, f); }, aoLista:function(f){ AMR.lista.abrir(r, f); } }); }catch(err){ document.getElementById('prev').innerHTML = '<div class="amr-vazio">' + e(err.message) + '</div>'; } }, 200); }
    // quantidade usada NESTE passo (ingredientesDoPasso). Vazio = usa a quantidade total da receita.
    function qtdsHTML(p){
      var sel = (p.ingredientes || []).map(function(id){ return R.ingredientes.filter(function(i){ return i.ingrediente_id === id; })[0]; }).filter(Boolean);
      if(!sel.length) return '';
      return '<div class="qtdT">Quantidade neste passo <small>(vazio = a quantidade total)</small></div>' + sel.map(function(i){
        var d = (p.ingredientesDoPasso || []).filter(function(x){ return x.ingrediente_id === i.ingrediente_id; })[0] || {};
        var u = d.unidade || i.unidade || 'g';
        return '<div class="qtdL" data-qi="' + e(i.ingrediente_id) + '"><span>' + e(i.nome) + '</span><input class="c" type="number" step="any" min="0" data-q="q" value="' + (d.quantidade == null ? '' : d.quantidade) + '" placeholder="' + (i.quantidade == null ? 'q.b.' : (i.quantidade + ' (total)')) + '"' + (u === 'q.b.' ? ' disabled' : '') + '><select class="c" data-q="u">' + opcoesUnid(u) + '</select></div>';
      }).join('');
    }
    function ligaQtds(box, p){
      var c = box.querySelector('.qtdsP'); c.innerHTML = qtdsHTML(p);
      c.querySelectorAll('.qtdL').forEach(function(l){
        var id = l.dataset.qi, qi = l.querySelector('[data-q="q"]'), ui = l.querySelector('[data-q="u"]');
        function grava(){
          p.ingredientesDoPasso = (p.ingredientesDoPasso || []).filter(function(x){ return x.ingrediente_id !== id; });
          qi.disabled = ui.value === 'q.b.';
          if(ui.value === 'q.b.') p.ingredientesDoPasso.push({ ingrediente_id:id, quantidade:null, unidade:'q.b.' });
          else if(qi.value !== '') p.ingredientesDoPasso.push({ ingrediente_id:id, quantidade:parseFloat(qi.value), unidade:ui.value });
          if(!p.ingredientesDoPasso.length) delete p.ingredientesDoPasso;
          previa();
        }
        qi.oninput = grava; ui.onchange = grava;
      });
    }
    function ligaForm(){
      var f = document.getElementById('form');
      f.querySelectorAll('[data-k]').forEach(function(x){ x.oninput = function(){ var k = x.dataset.k; R[k] = (k === 'porcoes') ? Math.max(1, parseInt(x.value, 10) || 1) : x.value; if(k === 'nome' && !slugMexido){ R.id = M.slug(x.value); document.getElementById('slug').value = R.id; } previa(); }; });
      f.querySelectorAll('[data-t]').forEach(function(x){ x.oninput = function(){ R.tempo[x.dataset.t] = parseInt(x.value, 10) || 0; if(x.dataset.t !== 'total'){ R.tempo.total = (R.tempo.preparacao || 0) + (R.tempo.cozedura || 0); f.querySelector('[data-t="total"]').value = R.tempo.total; } previa(); }; });
      f.querySelectorAll('[data-ly]').forEach(function(x){ x.oninput = function(){ R.layout[x.dataset.ly] = x.value; previa(); }; });
      document.getElementById('slug').oninput = function(ev){ slugMexido = true; R.id = M.slug(ev.target.value); };
      document.getElementById('selCat').onchange = function(ev){ R.categoria = ev.target.value; previa(); };
      document.getElementById('tags').oninput = function(ev){ R.tags = ev.target.value.split(','); previa(); };
      document.getElementById('plAtivo').onchange = function(ev){ R.player.ativo = ev.target.checked; previa(); };
      document.getElementById('notas').oninput = function(ev){ R.notas = ev.target.value.split('\n'); previa(); };
      // ingredientes
      document.getElementById('addI').onclick = function(){ R.ingredientes.push({ ingrediente_id:'', nome:'', quantidade:null, unidade:'g' }); pintaForm(); var ls = document.querySelectorAll('#ings .ing input[data-f="nome"]'); if(ls.length) ls[ls.length - 1].focus(); };
      f.querySelectorAll('#ings .ing').forEach(function(row){
        var i = R.ingredientes[+row.dataset.i];
        row.querySelectorAll('[data-f]').forEach(function(x){ x.oninput = x.onchange = function(){ var k = x.dataset.f;
          if(k === 'opcional') i.opcional = x.checked; else if(k === 'quantidade') i.quantidade = x.value === '' ? null : parseFloat(x.value); else i[k] = x.value;
          if(k === 'nome' && !i._idFixo){ i.ingrediente_id = M.slug(x.value); row.querySelector('.id').textContent = 'id: ' + i.ingrediente_id; }
          if(k === 'unidade'){ var q = row.querySelector('[data-f="quantidade"]'); q.disabled = x.value === 'q.b.'; if(x.value === 'q.b.'){ i.quantidade = null; q.value = ''; } }
          previa(); }; });
        row.querySelector('[data-f="nome"]').addEventListener('change', function(){ pintaForm(); });   // ao sair do campo: atualiza os botões de ingredientes nos passos
        row.querySelectorAll('[data-m]').forEach(function(b){ b.onclick = function(){ var k = +row.dataset.i, n = k + (+b.dataset.m); if(n < 0 || n >= R.ingredientes.length) return; var a = R.ingredientes; var t = a[k]; a[k] = a[n]; a[n] = t; pintaForm(); previa(); }; });
        row.querySelector('[data-d]').onclick = function(){ var id = i.ingrediente_id; R.ingredientes.splice(+row.dataset.i, 1); R.passos.forEach(function(p){ if(p.ingredientes) p.ingredientes = p.ingredientes.filter(function(x){ return x !== id; }); if(p.ingredientesDoPasso){ p.ingredientesDoPasso = p.ingredientesDoPasso.filter(function(x){ return x.ingrediente_id !== id; }); if(!p.ingredientesDoPasso.length) delete p.ingredientesDoPasso; } }); pintaForm(); previa(); };
      });
      // passos
      document.getElementById('addP').onclick = function(){ R.passos.push({ titulo:'', descricao:'' }); pintaForm(); var ls = document.querySelectorAll('#pss .passoE input[data-f="titulo"]'); if(ls.length) ls[ls.length - 1].focus(); };
      f.querySelectorAll('#pss .passoE').forEach(function(box){
        var p = R.passos[+box.dataset.p];
        function timer(){ var s = (parseInt(box.querySelector('[data-f="tmin"]').value, 10) || 0) * 60 + (parseInt(box.querySelector('[data-f="tseg"]').value, 10) || 0); if(s > 0) p.timer = { ativo:true, segundos:s, rotulo:box.querySelector('[data-f="trot"]').value }; else delete p.timer; }
        box.querySelectorAll('[data-f]').forEach(function(x){ x.oninput = function(){ var k = x.dataset.f; if(k === 'tmin' || k === 'tseg' || k === 'trot') timer(); else p[k] = x.value; previa(); }; });
        box.querySelectorAll('[data-ing]').forEach(function(b){ b.onclick = function(){ p.ingredientes = p.ingredientes || []; var id = b.dataset.ing, ix = p.ingredientes.indexOf(id); if(ix >= 0){ p.ingredientes.splice(ix, 1); if(p.ingredientesDoPasso){ p.ingredientesDoPasso = p.ingredientesDoPasso.filter(function(x){ return x.ingrediente_id !== id; }); if(!p.ingredientesDoPasso.length) delete p.ingredientesDoPasso; } } else p.ingredientes.push(id); b.classList.toggle('on', ix < 0); ligaQtds(box, p); previa(); }; });
        ligaQtds(box, p);
        box.querySelectorAll('[data-m]').forEach(function(b){ b.onclick = function(){ var k = +box.dataset.p, n = k + (+b.dataset.m); if(n < 0 || n >= R.passos.length) return; var a = R.passos; var t = a[k]; a[k] = a[n]; a[n] = t; pintaForm(); previa(); }; });
        box.querySelector('[data-d]').onclick = function(){ R.passos.splice(+box.dataset.p, 1); pintaForm(); previa(); };
      });
    }
    function aplicaJSON(texto){
      try{
        var bruto = (typeof texto === 'string') ? JSON.parse(texto) : texto;
        if(bruto && Array.isArray(bruto.categorias) && !bruto.ingredientes) throw new Error('Isto parece o JSON de um menu de restaurante (tem "categorias"), não uma receita. Os menus importam-se no editor do restaurante.');
        var res = M.normalizar(bruto), nova = res.receita;
        if(!nova.nome && !nova.ingredientes.length && !nova.passos.length) throw new Error('Não encontrei uma receita neste JSON (falta nome, ingredientes e passos).');
        if(nova.categoria && !catPorSlug(nova.categoria)) res.avisos.push('A categoria "' + nova.categoria + '" não existe — ficou em ' + R.categoria + '.');
        if(!nova.categoria || !catPorSlug(nova.categoria)) nova.categoria = R.categoria;
        nova.ingredientes.forEach(function(i){ i._idFixo = true; });
        R = nova; slugMexido = true; pintaForm(); previa();
        msg(MSG, 'JSON importado ✓ — revê os campos e carrega em <b>💾 Guardar</b>.' + (res.avisos.length ? '<br>⚠️ ' + res.avisos.map(e).join('<br>⚠️ ') : ''), res.avisos.length ? 'av' : 'ok');
      }catch(err){ msg(MSG, 'Erro a importar: ' + e(err.message), 'erro'); }
    }
    document.getElementById('bImp').onclick = function(){ document.getElementById('fImp').click(); };
    document.getElementById('fImp').onchange = function(ev){ var fl = ev.target.files && ev.target.files[0]; if(!fl) return; var rd = new FileReader(); rd.onload = function(){ aplicaJSON(rd.result); ev.target.value = ''; }; rd.readAsText(fl); };
    document.getElementById('bCol').onclick = function(){
      var md = document.createElement('div'); md.className = 'modal';
      md.innerHTML = '<div class="cx"><h3 class="serif" style="margin:0 0 8px;">Colar JSON da receita</h3><textarea class="c" id="jt" style="min-height:300px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;" placeholder="{ &quot;nome&quot;: &quot;…&quot;, &quot;ingredientes&quot;: [ … ], &quot;passos&quot;: [ … ] }"></textarea><div style="display:flex;gap:8px;margin-top:10px;"><button class="bt" id="jx">Cancelar</button><button class="bt p" id="jok" style="flex:1;">Interpretar e preencher</button></div></div>';
      document.body.appendChild(md);
      md.querySelector('#jx').onclick = function(){ md.remove(); };
      md.querySelector('#jok').onclick = function(){ var t = md.querySelector('#jt').value; md.remove(); aplicaJSON(t); };
    };
    document.getElementById('bExp').onclick = function(){
      var r = M.normalizar(JSON.parse(JSON.stringify(R))).receita;
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type:'application/json' })); a.download = (r.id || 'receita') + '.json'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
    document.getElementById('bGuardar').onclick = async function(){
      var b = this;
      var limpo = JSON.parse(JSON.stringify(R)); (limpo.ingredientes || []).forEach(function(i){ delete i._idFixo; });
      var r = M.normalizar(limpo).receita, er = M.validar(r);
      if(er.length){ msg(MSG, '⚠️ ' + er.map(e).join('<br>⚠️ '), 'erro'); return; }
      var c = catPorSlug(r.categoria); if(!c){ msg(MSG, 'Escolhe a categoria.', 'erro'); return; }
      b.disabled = true; b.textContent = 'A guardar…';
      try{
        if(r.id !== slugOriginal && !(await D.slugLivre(r.id, reg.id))){ throw new Error('Já existe outra receita com o endereço "' + r.id + '". Muda o slug.'); }
        var res = await D.guardarReceita({ id:reg.id, categoria_id:c.id, slug:r.id, dados:r, publicado:document.getElementById('pub').checked, ordem:reg.ordem });
        var novo = !reg.id; reg.id = res.id; reg.slug = res.slug; slugOriginal = res.slug; reg.publicado = res.publicado;
        msg(MSG, '✓ Guardado' + (res.publicado ? ' e publicado' : ' como rascunho') + '. <a target="_blank" href="receitas.html?r=' + encodeURIComponent(res.slug) + '" style="color:inherit;">Ver no site ↗</a>', 'ok');
        if(novo) history.replaceState(null, '', '#rec=' + res.id + '&cat=' + c.slug);
      }catch(err){ msg(MSG, 'Erro a guardar: ' + e(err.message), 'erro'); }
      b.disabled = false; b.textContent = '💾 Guardar';
    };
    var del = document.getElementById('bDel'); if(del) del.onclick = async function(){ if(!confirm('Apagar a receita "' + R.nome + '"? Isto não se pode desfazer.')) return; try{ await D.apagarReceita(reg.id); location.hash = 'cat=' + R.categoria; }catch(err){ msg(MSG, 'Erro: ' + e(err.message), 'erro'); } };
    R.ingredientes.forEach(function(i){ i._idFixo = true; });   // ids existentes não mudam (os passos dependem deles)
    pintaForm(); previa();
  }

  // ================= ROTAS =================
  function rota(){
    var h = new URLSearchParams((location.hash || '').slice(1));
    var f = h.get('rec') ? vistaEditor(h.get('rec'), h.get('cat')) : h.get('cat') ? vistaCategoria(h.get('cat')) : vistaCategorias();
    Promise.resolve(f).catch(function(err){ APP.innerHTML = '<div class="amr-vazio">Erro: ' + e(err.message) + '<br><br>Já correste o <b>receitas.sql</b> no Supabase?</div>'; });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', rota);
  (async function(){
    var s = await D.sessao(), adm = s ? await D.eAdmin() : false;
    if(!adm){ migalhas([['Receitas']]); APP.innerHTML = '<div class="bloqueio">🔒 Esta área é só para o administrador.<br><br><a class="bt p" href="painel.html" style="text-decoration:none;display:inline-block;">Entrar no Painel</a><p style="color:#8a7a63;font-size:.85rem;">Depois de entrares no Painel, volta a abrir esta página.</p></div>'; return; }
    rota();
  })();
})();
</script>
</body>
